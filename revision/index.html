<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0f172a; --bg2: #1e293b; --card: #1e293b; --card2: #273449;
  --line: #334155; --ink: #e2e8f0; --ink-dim: #94a3b8; --ink-faint: #64748b;
  --accent: #38bdf8; --accent2: #0ea5e9;
  --red: #f87171; --amber: #fbbf24; --green: #34d399;
  --pol: #a78bfa; --his: #fb923c; --bus: #22d3ee;
  --head: 'Fraunces', Georgia, serif; --body: 'Inter', system-ui, sans-serif;
}
html, body { background: var(--bg); color: var(--ink); font-family: var(--body); }
body { max-width: 720px; margin: 0 auto; padding-bottom: 84px; min-height: 100vh; }
h1, h2, h3 { font-family: var(--head); font-weight: 700; letter-spacing: -0.01em; }
a { color: var(--accent); }
.wrap { padding: 16px; }
header { padding: 18px 16px 10px; }
header .date { color: var(--ink-dim); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
header h1 { font-size: 26px; margin-top: 2px; }
.phase-chip { display:inline-block; margin-top:8px; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; background:var(--card2); color:var(--accent); border:1px solid var(--line); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.card h2 { font-size: 17px; margin-bottom: 4px; }
.muted { color: var(--ink-dim); font-size: 13px; line-height: 1.5; }
.faint { color: var(--ink-faint); font-size: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.spread { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.btn { font-family: var(--body); font-weight: 600; font-size: 14px; border: none; border-radius: 10px; padding: 11px 14px; background: var(--accent); color: #06263a; cursor: pointer; }
.btn.sec { background: var(--card2); color: var(--ink); border: 1px solid var(--line); }
.btn.sm { padding: 7px 11px; font-size: 13px; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; }
input, select, textarea { font-family: var(--body); font-size: 15px; color: var(--ink); background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
textarea { min-height: 160px; resize: vertical; line-height: 1.5; }
label { display:block; font-size:13px; font-weight:600; color: var(--ink-dim); margin: 10px 0 5px; }
.pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.pill.pol { background: rgba(167,139,250,.16); color: var(--pol); }
.pill.his { background: rgba(251,146,60,.16); color: var(--his); }
.pill.bus { background: rgba(34,211,238,.16); color: var(--bus); }
/* today plan items */
.task { display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line); }
.task:last-child { border-bottom: none; }
.task .box { flex:0 0 22px; width:22px; height:22px; border:2px solid var(--line); border-radius:6px; margin-top:2px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; color: var(--bg); }
.task.done .box { background: var(--green); border-color: var(--green); }
.task.done .t-title { text-decoration: line-through; color: var(--ink-faint); }
.t-title { font-weight:600; font-size:15px; }
.t-meta { font-size:12px; color: var(--ink-dim); margin-top:2px; }
.t-dur { flex:0 0 auto; font-size:12px; font-weight:700; color: var(--ink-dim); background: var(--bg2); border-radius:8px; padding:3px 8px; }
/* rag confidence */
.rag { display:flex; gap:5px; }
.rag button { flex:1; height:30px; border-radius:7px; border:1px solid var(--line); background:var(--bg2); color:var(--ink-faint); font-weight:700; font-size:12px; cursor:pointer; }
.rag button.on0 { background:var(--red); color:#3b0a0a; border-color:var(--red); }
.rag button.on1 { background:var(--amber); color:#3b2a06; border-color:var(--amber); }
.rag button.on2 { background:var(--green); color:#052e1c; border-color:var(--green); }
.topic { padding:11px 0; border-bottom:1px solid var(--line); }
.topic:last-child { border-bottom:none; }
.progressbar { height:8px; border-radius:999px; background:var(--bg2); overflow:hidden; }
.progressbar > span { display:block; height:100%; background:linear-gradient(90deg,var(--accent2),var(--green)); }
.count { text-align:center; }
.count .n { font-family:var(--head); font-size:30px; font-weight:700; }
.count .l { font-size:12px; color:var(--ink-dim); }
.count-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.tag { display:inline-block; font-size:12px; font-weight:600; padding:6px 10px; border-radius:999px; border:1px solid var(--line); background:var(--bg2); color:var(--ink-dim); cursor:pointer; margin:0 6px 6px 0; }
.tag.on { background:var(--accent); color:#06263a; border-color:var(--accent); }
.banner { font-size:12px; line-height:1.5; padding:10px 12px; border-radius:10px; background:rgba(251,191,36,.1); border:1px solid rgba(251,191,36,.35); color:#fcd34d; }
.marking-out { white-space:pre-wrap; font-size:14px; line-height:1.6; }
.marking-out h3 { font-size:16px; margin:14px 0 4px; color:var(--accent); }
/* bottom nav */
nav { position:fixed; bottom:0; left:0; right:0; max-width:720px; margin:0 auto; background:rgba(15,23,42,.92); backdrop-filter:blur(10px); border-top:1px solid var(--line); display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom)); }
nav button { flex:1; background:none; border:none; color:var(--ink-faint); font-family:var(--body); font-size:10px; font-weight:600; padding:6px 2px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; }
nav button.on { color:var(--accent); }
nav .ic { font-size:19px; line-height:1; }
.hidden { display:none; }
.empty { text-align:center; color:var(--ink-faint); font-size:14px; padding:24px 12px; }
.split2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
hr.sep { border:none; border-top:1px solid var(--line); margin:12px 0; }
.tiny-link { background:none; border:none; color:var(--accent); font-size:13px; font-weight:600; cursor:pointer; padding:0; }
</style>
</head>
<body>

<header>
  <div class="date" id="hdrDate">—</div>
  <h1 id="hdrTitle">Today</h1>
  <div id="hdrPhase"></div>
</header>

<main id="app"><div class="wrap"><p class="muted">Loading…</p></div></main>

<nav>
  <button data-tab="today" class="on"><span class="ic">☀️</span>Today</button>
  <button data-tab="subjects"><span class="ic">🗂️</span>Subjects</button>
  <button data-tab="notes"><span class="ic">🧠</span>Notes</button>
  <button data-tab="practice"><span class="ic">✍️</span>Practice</button>
  <button data-tab="essays"><span class="ic">📝</span>Essays</button>
  <button data-tab="progress"><span class="ic">📊</span>Progress</button>
  <button data-tab="settings"><span class="ic">⚙️</span>More</button>
</nav>

/* ---------- 2. STATE (localStorage) ---------- */
const LS_KEY = 'revision-planner-state-v1';
const defaultSettings = {
  capWeekday: 60,    // minutes on a school day (his realistic baseline)
  capWeekend: 60,    // minutes on weekend / holiday — raise this in Settings when ready
  model: 'claude-sonnet-5',
  proxyUrl: '',      // preferred: hosted marking proxy (no key on device)
  proxyToken: '',    // optional shared token for the proxy
  apiKey: '',        // fallback: personal on-device Anthropic key
  exams: {
    mockOct: '2026-10-13',
    mockFeb: '2027-02-23',
    finals:  '2027-05-18',  // approximate start of the exam window — EDIT when timetable is published
  },
};
let STATE = load();
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if (s && s.settings) { s.settings = Object.assign({}, defaultSettings, s.settings);
      s.settings.exams = Object.assign({}, defaultSettings.exams, s.settings.exams);
      s.notes = s.notes || []; s.cards = s.cards || [];   // notes-check + retrieval cards
      // Migration → taught/untaught.  Saved states predate the flag, so pre-tick
      // anything already rated or reviewed and send the user through the
      // checklist once to confirm, rather than guessing the rest of the course.
      if (s.onboarded === undefined) {
        Object.values(s.topics || {}).forEach(ts => {
          if (ts.taught === undefined) ts.taught = !!(ts.lastReviewed || ts.confidence !== null);
        });
        s.onboarded = false;
      }
      return s; }
  } catch (e) {}
  return { settings: structuredClone(defaultSettings), topics: {}, practice: [], essays: [], plan: {}, nea: {}, notes: [], cards: [], onboarded: false };
}
function save() { localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }
function topicState(id) {
  if (!STATE.topics[id]) STATE.topics[id] = { confidence: null, lastReviewed: null, intervalIdx: 0, nextReview: null, taught: false };
  return STATE.topics[id];
}
// Has school actually covered this yet?  Henry is part-way through the course,
// so roughly half the spec is untaught at any given time.  Untaught topics are
// kept out of the planner and the question bank entirely — being scheduled onto
// material nobody has taught you, and then marked down for not knowing it, is
// the fastest way to make a revision app feel punishing rather than useful.
function isTaught(id) { const ts = STATE.topics[id]; return !!(ts && ts.taught); }
function setTaught(id, on) {
  const ts = topicState(id);
  ts.taught = !!on;
  if (!on) { ts.confidence = null; ts.nextReview = null; }   // untaught topics carry no rating
  save();
}

/* ---------- 3. DATES & SPACING ---------- */
const INTERVALS = [1, 3, 7, 14, 30, 60]; // days; doubles beyond the last
const DAY = 86400000;
function today() { const d = new Date(); d.setHours(0,0,0,0); return d; }
function iso(d) { return new Date(d).toISOString().slice(0,10); }
function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / DAY); }
function fmtDate(d) { return new Date(d).toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' }); }
function intervalFor(ts) {
  // Low confidence shortens the interval; high confidence lengthens it.
  let idx = ts.intervalIdx || 0;
  let base = idx < INTERVALS.length ? INTERVALS[idx] : INTERVALS[INTERVALS.length-1] * Math.pow(2, idx - INTERVALS.length + 1);
  if (ts.confidence === 0) base = Math.max(1, Math.round(base * 0.4));
  else if (ts.confidence === 1) base = Math.max(1, Math.round(base * 0.7));
  return base;
}
function markReviewed(id, wentWell) {
  const ts = topicState(id);
  ts.lastReviewed = iso(today());
  ts.intervalIdx = wentWell ? (ts.intervalIdx || 0) + 1 : Math.max(0, (ts.intervalIdx || 0) - 1);
  ts.nextReview = iso(new Date(+today() + intervalFor(ts) * DAY));
  save();
}
// --- Retrieval cards (auto-generated from notes; spaced like topics) ---
function baseInterval(idx) { return idx < INTERVALS.length ? INTERVALS[idx] : INTERVALS[INTERVALS.length-1] * Math.pow(2, idx - INTERVALS.length + 1); }
function cardsDue() { const n = iso(today()); return STATE.cards.filter(c => !c.nextReview || c.nextReview <= n); }
function scheduleCard(card, gotIt) {
  card.lastReviewed = iso(today());
  card.intervalIdx = gotIt ? (card.intervalIdx || 0) + 1 : 0;   // miss → back to 1-day
  card.nextReview = iso(new Date(+today() + baseInterval(card.intervalIdx) * DAY));
  save();
}

/* ---------- 4. MILESTONE PHASE ---------- */
function phaseFor(date) {
  const e = STATE.settings.exams;
  const t = +new Date(date);
  if (t < +new Date(e.mockOct)) return { key:'learn', label:'Foundation phase → Oct mocks', mix:{ learn:0.6, practice:0.25, review:0.15 } };
  if (t < +new Date(e.mockFeb)) return { key:'consolidate', label:'Consolidation → Feb mocks', mix:{ learn:0.3, practice:0.4, review:0.3 } };
  if (t < +new Date(e.finals))  return { key:'peak', label:'Peak phase → summer exams', mix:{ learn:0.1, practice:0.55, review:0.35 } };
  return { key:'exams', label:'Exam period — final reviews', mix:{ learn:0, practice:0.5, review:0.5 } };
}

/* ---------- 5. DAILY PLAN BUILDER ---------- */
const ACTIVITIES = {
  learn:    { label:'Learn / first-pass notes + brain-dump', mins:30 },
  review:   { label:'Retrieval quiz (from memory)', mins:10 },
  practice: { label:'Past-paper question', mins:20 },
  essay:    { label:'Timed essay + self-mark', mins:40 },
};
function allTopics() {
  const out = [];
  CONTENT.subjects.forEach(s => s.topics.forEach(t => { if (t.id !== 'his-nea') out.push({ ...t, subject:s.id, subjectName:s.name, cls:s.cls }); }));
  return out;
}
// Everything the planner is allowed to touch: taught topics only.
function taughtTopics() { return allTopics().filter(t => isTaught(t.id)); }
// A question is drawable once its topics have been taught.  Questions tagged
// with specific topics use those; the rest fall back to "anything taught on
// that paper", which is the best we can do for a question with no topic tags.
// Extract/interpretation/source questions carry their own stimulus material —
// the AO is about engaging with it, so the question is meaningless without it.
function extractsToText(q) {
  if (!q || !q.extracts || !q.extracts.length) return '';
  return q.extracts.map(x => `${x.label}\n${x.text}${x.attrib ? `\n(${x.attrib})` : ''}`).join('\n\n');
}
function questionAvailable(q) {
  if (q.topics && q.topics.length) return q.topics.some(isTaught);
  return allTopics().some(t => t.subject === q.subject && t.paper === q.paper && isTaught(t.id));
}
function priority(t) {
  const ts = topicState(t.id);
  let p = 0;
  if (ts.confidence === 0) p += 5; else if (ts.confidence === 1) p += 3; else if (ts.confidence === null) p += 2;
  if (!ts.lastReviewed) p += 2;
  if (ts.nextReview && ts.nextReview <= iso(today())) p += 3;         // due
  if (ts.nextReview && ts.nextReview < iso(today())) p += 1;          // overdue
  return p;
}
// A topic is "introduced" once it's been studied or rated — only then can it
// be retrieved/practised. You can't recall what you haven't yet learned.
function introduced(id) { const ts = STATE.topics[id]; return !!(ts && (ts.lastReviewed || ts.confidence !== null)); }
function buildPlan(dateKey) {
  if (STATE.plan[dateKey]) return STATE.plan[dateKey];
  const d = new Date(dateKey);
  const isWeekend = [0,6].includes(d.getDay());
  const phase = phaseFor(dateKey);
  // Day-mode overrides: rest = no plan; light = half capacity.
  const mode = (STATE.dayMode && STATE.dayMode[dateKey]) || 'normal';
  let cap = isWeekend ? STATE.settings.capWeekend : STATE.settings.capWeekday;
  if (mode === 'rest') { const plan = { date:dateKey, cap:0, phase:phase.label, items:[], mins:0, mode }; STATE.plan[dateKey] = plan; save(); return plan; }
  if (mode === 'light') cap = Math.round(cap / 2);
  // Cap brand-new topics per day so learning stays consolidated, not crammed.
  const newBudget = { learn:3, consolidate:2, peak:1, exams:0 }[phase.key];
  const now = iso(today());
  const topics = taughtTopics();
  // Three pools: due reviews (retention — protected first), brand-new topics,
  // and already-known-but-not-due (extra practice to fill any spare time).
  const dueRev = topics.filter(t => { const ts = topicState(t.id); return introduced(t.id) && ts.nextReview && ts.nextReview <= now; });
  const fresh  = topics.filter(t => !introduced(t.id));
  const known  = topics.filter(t => introduced(t.id) && !dueRev.includes(t));
  const byPriority = arr => arr.map(t => ({ t, p: priority(t) + Math.random()*0.4 })).sort((a,b) => b.p - a.p).map(x => x.t);
  const interleave = arr => { const bs = { pol:[], his:[], bus:[] }; arr.forEach(t => bs[t.subject].push(t));
    const o = []; for (let i = 0; i < 30; i++) ['pol','his','bus'].forEach(s => { if (bs[s][i]) o.push(bs[s][i]); }); return o; };
  const dueQ   = interleave(byPriority(dueRev));
  const freshQ = interleave(byPriority(fresh)).slice(0, newBudget);
  const knownQ = interleave(byPriority(known));
  // For an introduced topic, choose retrieval vs practice/essay from the phase mix.
  const pickIntro = () => { const m = phase.mix; const pract = m.practice / (m.practice + m.review || 1);
    if (Math.random() < pract) return (Math.random() < 0.35 ? 'essay' : 'practice'); return 'review'; };
  const items = []; let used = 0;
  const add = (t, type) => { const act = ACTIVITIES[type]; if (used + act.mins > cap + 8) return false;
    items.push({ topicId:t.id, title:t.title, subject:t.subjectName, cls:t.cls, type, label:act.label, mins:act.mins, done:false }); used += act.mins; return true; };
  // 1) Protect retention: due reviews first.  2) Steady new intake (capped).
  // 3) Any spare time → extra practice of known material.
  for (const t of dueQ)   { if (used >= cap) break; add(t, pickIntro()); }
  for (const t of freshQ) { if (used >= cap) break; add(t, 'learn'); }
  for (const t of knownQ) { if (used >= cap) break; add(t, pickIntro()); }
  const plan = { date:dateKey, cap, phase:phase.label, items, mins:used, mode };
  STATE.plan[dateKey] = plan; save();
  return plan;
}

/* ---------- 6. RENDER ---------- */
const app = document.getElementById('app');
let TAB = 'today';
let currentQ = null;        // question currently drawn from the bank
let pendingEssay = null;    // { type, text } handed from Practice to the Essay marker
let notesResult = null;     // last notes-check result awaiting save: { topicId, feedback, cards, rag }
let cardRun = null;         // active card review: { queue:[cards], idx, revealed }
function setHeader(title, phaseHtml) {
  document.getElementById('hdrDate').textContent = fmtDate(today()).toUpperCase();
  document.getElementById('hdrTitle').textContent = title;
  document.getElementById('hdrPhase').innerHTML = phaseHtml || '';
}
function render() {
  if (!STATE.onboarded) { document.querySelectorAll('nav button').forEach(b => b.classList.remove('on')); return renderOnboarding(); }
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === TAB));
  ({ today:renderToday, subjects:renderSubjects, notes:renderNotes, practice:renderPractice, essays:renderEssays, progress:renderProgress, settings:renderSettings }[TAB])();
}

/* --- First run: what has school actually covered? ---------------------------
   The planner is only as good as this list.  Everything left unticked stays out
   of the daily plan and the question bank until it's taught, so the app never
   schedules Henry onto material he hasn't met — and never marks him down for it.
   Editable later from Subjects, so a wrong guess here costs nothing.          */
function renderOnboarding() {
  setHeader('Getting set up', '');
  let h = `<div class="wrap">
    <div class="card"><h2>What have you covered so far?</h2>
      <p class="muted">Tick every topic school has already taught. Leave the rest — they'll stay out of your plan until you mark them covered, so you won't get scheduled onto Year 13 content before you've met it.</p>
      <p class="faint">You can change any of this later in Subjects.</p>
    </div>`;
  CONTENT.subjects.forEach(s => {
    const n = s.topics.filter(t => isTaught(t.id)).length;
    h += `<div class="card"><div class="spread"><h2><span class="pill ${s.cls}">${s.name}</span> <span class="faint">${s.board}</span></h2>
      <button class="tiny-link" data-all="${s.id}">${n===s.topics.length?'Clear all':'Select all'}</button></div>`;
    s.papers.forEach(p => {
      const ts = s.topics.filter(t => t.paper === p.id);
      if (!ts.length) return;
      h += `<div style="margin-top:10px" class="faint">${p.name}</div>`;
      ts.forEach(t => {
        h += `<div class="topic" style="padding:6px 0"><label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer">
          <input type="checkbox" data-ob="${t.id}" ${isTaught(t.id)?'checked':''} style="margin-top:3px">
          <span class="t-title" style="font-size:14px;font-weight:400">${t.title}</span></label></div>`;
      });
    });
    h += `</div>`;
  });
  h += `<button class="btn" id="obDone" style="width:100%;margin-bottom:24px">Done — build my plan</button></div>`;
  app.innerHTML = h;
  app.querySelectorAll('[data-ob]').forEach(cb => cb.onchange = () => setTaught(cb.dataset.ob, cb.checked));
  app.querySelectorAll('[data-all]').forEach(b => b.onclick = () => {
    const s = CONTENT.subjects.find(x => x.id === b.dataset.all);
    const turnOn = s.topics.filter(t => isTaught(t.id)).length !== s.topics.length;
    s.topics.forEach(t => setTaught(t.id, turnOn));
    renderOnboarding();
  });
  document.getElementById('obDone').onclick = () => {
    if (!taughtTopics().length && !confirm('Nothing ticked — the planner will have nothing to work with. Continue anyway?')) return;
    STATE.onboarded = true; STATE.plan = {}; save(); TAB = 'today'; window.scrollTo(0,0); render();
  };
}

/* --- Today --- */
function renderToday() {
  const key = iso(today());
  const plan = buildPlan(key);

  const doneCount = plan.items.filter(i => i.done).length;
  const pct = plan.items.length ? Math.round(doneCount / plan.items.length * 100) : 0;
  const mode = plan.mode || 'normal';
  let h = `<div class="wrap">`;
  h += `<div class="card"><div class="spread"><div><h2>${doneCount}/${plan.items.length} done · ${plan.mins} min planned</h2>

  const due = cardsDue();
  if (due.length) h += `<div class="card" style="border-color:var(--accent)"><div class="spread"><div><h2>🔁 ${due.length} recall card${due.length>1?'s':''} due</h2>

  if (mode === 'rest') { h += `<div class="empty">🌱 Rest day — recovery is part of the plan. Reviews will pick up tomorrow.</div>`; }
  else if (!plan.items.length) { h += `<div class="empty">Nothing queued yet — mark the topics school has covered in <b>Subjects</b> and they'll start flowing in.</div>`; }
  h += `<div class="card">`;
  plan.items.forEach((it, idx) => {
    h += `<div class="task ${it.done?'done':''}" data-i="${idx}">
      <div class="box tbox">${it.done?'✓':''}</div>
      <div style="flex:1">
        <div class="t-title">${it.label}</div>
        <div class="t-meta"><span class="pill ${it.cls}">${it.subject}</span> &nbsp;${it.title}</div>
      </div>
      <div class="t-dur">${it.mins}m</div>
    </div>`;
  });
  h += `</div>`;
  // End-of-session prompt: check today's notes.
  h += `<div class="card" style="background:var(--card2)"><div class="spread"><div><h2>🧠 Finished studying?</h2>
    <div class="muted">Paste today's notes for a quick accuracy check — and turn them into recall cards.</div></div>
    <button class="btn sec" id="tdNotes">Check notes</button></div></div>`;
  h += `<button class="tiny-link" id="regen">↻ Regenerate today's plan</button>`;
  h += `</div>`;
  app.innerHTML = h;
  app.querySelectorAll('.task').forEach(el => el.querySelector('.tbox').onclick = () => {
    const i = +el.dataset.i; const it = plan.items[i]; it.done = !it.done;
    // Completing any block (including a first-pass "learn") advances the topic's
    // spaced-review schedule and marks it introduced.
    if (it.done) markReviewed(it.topicId, true);
    save(); renderToday();
  });
  app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    STATE.dayMode = STATE.dayMode || {}; STATE.dayMode[key] = b.dataset.mode;
    delete STATE.plan[key]; save(); renderToday();
  });
  const dueBtn = document.getElementById('tdCards');
  if (dueBtn) dueBtn.onclick = () => { cardRun = { queue: cardsDue(), idx:0, revealed:false }; TAB = 'notes'; window.scrollTo(0,0); render(); };
  document.getElementById('tdNotes').onclick = () => { TAB = 'notes'; window.scrollTo(0,0); render(); };
  document.getElementById('regen').onclick = () => { delete STATE.plan[key]; save(); renderToday(); };
}

function renderSubjects() {

          </div>

          ${on?`<div class="rag" data-topic="${t.id}">

      });
    });
    h += `</div>`;
  });
  h += `</div>`;
  app.innerHTML = h;
  app.querySelectorAll('[data-taught]').forEach(b => b.onclick = () => {
    const id = b.dataset.taught;
    setTaught(id, !isTaught(id));
    STATE.plan = {};   // today's plan was built from the old topic set — rebuild it
    save(); renderSubjects();
  });
  app.querySelectorAll('.rag').forEach(rag => rag.querySelectorAll('button').forEach(b => b.onclick = () => {
    const ts = topicState(rag.dataset.topic);

    ts.confidence = ts.confidence === c ? null : c;

    save(); renderSubjects();
  }));
}

const RAG_TXT = { green:'🟢 Green — solid', amber:'🟡 Amber — needs work', red:'🔴 Red — significant gaps' };
const RAG_CONF = { green:2, amber:1, red:0 };
function subjectAssessmentNote(subId) {
  return {
    pol: 'AQA Politics: notes need precise, current examples (Acts, cases, votes, data), clear concepts, both sides of debates, and named thinkers for ideologies.',
    his: 'AQA History: notes need specific evidence (dates, names, figures) AND analytical framing — causation, significance, change/continuity; plus historians’ interpretations (Comp 1 Russia) and source provenance skills (Comp 2 Wars of the Roses).',
    bus: 'Edexcel Business: notes need definitions, application to real businesses, developed analysis chains, evaluation (MOPS + short vs long term), and the quantitative methods (ratios, investment appraisal, break-even).',
  }[subId] || '';
}

async function checkNotes() {
  const subId = document.getElementById('ntSub').value;
  const topicId = document.getElementById('ntTopic').value;
  const notes = document.getElementById('ntText').value.trim();
  const out = document.getElementById('ntOut');
  if (!notes) { alert('Paste your notes first.'); return; }
  if (!STATE.settings.proxyUrl && !STATE.settings.apiKey) { alert('Set up marking under More → Marking service.'); return; }
  const topic = allTopics().find(t=>t.id===topicId) || { title:topicId };
  const sub = CONTENT.subjects.find(s=>s.id===subId);
  out.innerHTML = `<div class="card"><div class="muted">Checking your notes… 15–30 seconds.</div></div>`;
  const prompt =
`You are an experienced A-level teacher helping a student make effective revision notes. Review the student's notes on a specific topic. Be encouraging but rigorous.

SUBJECT: ${sub.name} — ${sub.board}
TOPIC: ${topic.title}
HOW THIS SUBJECT IS ASSESSED: ${subjectAssessmentNote(subId)}
Use your knowledge of this exact specification's content for the topic. IMPORTANT: only state something is a factual error if you are confident; if unsure, say "check this" rather than asserting. Never invent errors.

STUDENT'S NOTES:
"""${notes}"""

Respond with these markdown headings:
### Accuracy
List any factual errors or misconceptions with the correction. If none, say "No errors spotted." Mark anything you're unsure about with "(check this)".
### Missing key points
The most important spec points for this topic that are missing or thin in the notes.
### Are these exam-useful notes?
Briefly judge whether they're the *right type* of notes for how this subject is assessed, and how to improve their format (more concise, more evidence, add evaluation, etc.).
### Score
Give a RAG rating (Red/Amber/Green) and a one-line reason.
### One-line summary
One memorable sentence.

Then, on the very last line, output ONLY a JSON object (no code fence, no extra text) of the form:
{"rag":"green|amber|red","cards":[{"q":"...","a":"..."},{"q":"...","a":"..."},{"q":"...","a":"..."}]}
with 3–5 short retrieval questions and answers drawn from the correct content for this topic (fix any errors in the student's notes). Keep answers concise.`;
  try {
    const text = await callLLM([{ role:'user', content: prompt }], 1600);
    // Split off the trailing JSON line.
    let feedback = text, parsed = null;
    const m = text.match(/\{[\s\S]*"cards"[\s\S]*\}\s*$/);
    if (m) { try { parsed = JSON.parse(m[0]); feedback = text.slice(0, m.index).trim(); } catch(e) {} }
    const cards = (parsed && Array.isArray(parsed.cards)) ? parsed.cards.filter(c=>c.q&&c.a) : [];
    const rag = parsed && ['green','amber','red'].includes(parsed.rag) ? parsed.rag : null;
    notesResult = { subject:subId, topicId, feedback, cards, rag,
      summary:(feedback.split(/one-?line summary/i)[1]||'').replace(/^[:\s#*-]+/,'').split('\n')[0].slice(0,160) };
    let oh = `<div class="card marking-out">${mdLite(feedback)}</div>`;
    oh += `<div class="card"><div class="spread"><div><h2>Add to your reviews</h2><div class="muted">${cards.length} recall card${cards.length!==1?'s':''} generated${rag?` · suggested rating ${RAG_TXT[rag]}`:''}.</div></div></div>`;
    if (cards.length) oh += `<div class="faint" style="margin-top:8px">${cards.map(c=>`• ${c.q}`).join('<br>')}</div>`;
    oh += `<button class="btn" id="ntSave" style="margin-top:12px">Save & schedule ${cards.length} card${cards.length!==1?'s':''}</button></div>`;
    out.innerHTML = oh;
    document.getElementById('ntSave').onclick = saveNotesResult;
  } catch (e) {
    out.innerHTML = `<div class="card"><div class="banner">Couldn't check notes: ${e.message}</div></div>`;
  }
}
function saveNotesResult() {
  if (!notesResult) return;
  const r = notesResult;
  // schedule new cards (due now → enter tomorrow's reviews)
  r.cards.forEach((c,i) => STATE.cards.push({ id:`card-${Date.now()}-${i}`, topicId:r.topicId, subject:r.subject,
    q:c.q, a:c.a, intervalIdx:0, lastReviewed:null, nextReview: iso(today()) }));
  // mark topic introduced + advance its spacing; nudge confidence from the RAG
  markReviewed(r.topicId, true);
  if (r.rag) { const ts = topicState(r.topicId); ts.confidence = RAG_CONF[r.rag]; }
  STATE.notes.push({ date: iso(today()), subject:r.subject, topicId:r.topicId, rag:r.rag, summary:r.summary });
  notesResult = null; save();
  render();
}
function renderCardRun() {
  const run = cardRun;
  if (run.idx >= run.queue.length) {
    let h = `<div class="wrap"><div class="card"><h2>✅ Recall session done</h2><div class="muted">${run.queue.length} card${run.queue.length!==1?'s':''} reviewed. Missed ones come back tomorrow; the rest are spaced further out.</div>
      <button class="btn" id="crDone" style="margin-top:12px">Back to notes</button></div></div>`;
    app.innerHTML = h; document.getElementById('crDone').onclick = () => { cardRun = null; renderNotes(); };
    return;
  }
  const card = run.queue[run.idx];
  const sub = CONTENT.subjects.find(s=>s.id===card.subject);
  const topic = allTopics().find(t=>t.id===card.topicId) || {};
  let h = `<div class="wrap">
    <div class="spread" style="margin-bottom:10px"><div class="faint">Card ${run.idx+1} / ${run.queue.length}</div><button class="tiny-link" id="crExit">Exit</button></div>
    <div class="card" style="min-height:180px"><div class="faint" style="margin-bottom:8px"><span class="pill ${sub?.cls||''}">${sub?.name||''}</span> ${topic.title||''}</div>
      <div class="t-title" style="font-size:17px;line-height:1.5">${card.q}</div>`;
  if (run.revealed) h += `<hr class="sep"><div class="muted" style="font-size:15px;line-height:1.6">${card.a}</div>`;
  h += `</div>`;
  if (!run.revealed) h += `<button class="btn" id="crShow" style="width:100%">Show answer</button>`;
  else h += `<div class="split2"><button class="btn sec" id="crMiss">Missed it</button><button class="btn" id="crGot">Got it ✓</button></div>`;
  h += `</div>`;
  app.innerHTML = h;
  document.getElementById('crExit').onclick = () => { cardRun = null; renderNotes(); };
  if (!run.revealed) document.getElementById('crShow').onclick = () => { run.revealed = true; renderCardRun(); };
  else {
    document.getElementById('crGot').onclick = () => { scheduleCard(card, true); run.idx++; run.revealed=false; renderCardRun(); };
    document.getElementById('crMiss').onclick = () => { scheduleCard(card, false); run.idx++; run.revealed=false; renderCardRun(); };
  }
}

    save(); renderPractice();

  app.querySelectorAll('[data-nea]').forEach(el => el.querySelector('.nbox').onclick = () => { const i = el.dataset.nea; STATE.nea[i] = !STATE.nea[i]; save(); renderPractice(); });
}

/* --- Essays: LLM marking --- */
function renderEssays() {
  setHeader('Essay marking', '');
  const opts = Object.entries(CONTENT.rubrics).map(([k,r])=>`<option value="${k}">${r.name}</option>`).join('');
  let h = `<div class="wrap">
    <div class="banner">⚠️ This is an <b>unofficial approximation</b> to help you improve — not a predicted or official grade. Always cross-check with your teacher and the real mark scheme.</div>
    <div class="card" style="margin-top:12px">
      <label>Question type</label><select id="esType">${opts}</select>
      <label>The exam question (paste it)</label><textarea id="esQ" style="min-height:70px" placeholder="e.g. 'Analyse and evaluate the view that…'"></textarea>
      <label>Extracts / sources <span class="faint">— only for extract, interpretation and source questions</span></label>
      <textarea id="esX" style="min-height:70px" placeholder="Paste the extracts or sources here. Without them, an interpretations or source-value answer can't be marked properly — the AO is about engaging with them."></textarea>
      <label>Your answer</label><textarea id="esA" placeholder="Paste your essay here…"></textarea>
      <button class="btn" id="esGo" style="margin-top:12px">Mark my answer</button>
      <div id="esKeyWarn"></div>
    </div>
    <div id="esOut"></div>`;
  h += `<div class="card"><h2>Past feedback</h2>`;
  if (!STATE.essays.length) h += `<div class="empty">Marked essays will be saved here so you can track improvement.</div>`;
  else STATE.essays.slice().reverse().slice(0,8).forEach(e => {
    h += `<div class="topic"><div class="spread"><div><b>${CONTENT.rubrics[e.type]?.name||e.type}</b></div><div class="faint">${e.date}</div></div>
          <div class="muted" style="margin-top:4px">${e.summary||''}</div></div>`;
  });
  h += `</div></div>`;
  app.innerHTML = h;
  // If a question was handed over from the Practice bank, prefill it.
  if (pendingEssay) {
    document.getElementById('esType').value = pendingEssay.type;
    document.getElementById('esQ').value = pendingEssay.text;
    document.getElementById('esX').value = pendingEssay.extracts || '';
    pendingEssay = null;
    document.getElementById('esA').focus();
  }
  if (!STATE.settings.proxyUrl && !STATE.settings.apiKey) document.getElementById('esKeyWarn').innerHTML =
    `<div class="faint" style="margin-top:8px">Marking isn't set up yet — add a proxy URL (or a personal key) under <b>More → Marking service</b>.</div>`;
  document.getElementById('esGo').onclick = markEssay;
}
// Shared LLM call — routes through the hosted proxy when set, else the
// personal on-device key. Returns the assistant's text.
async function callLLM(messages, maxTokens = 1200) {
  const s = STATE.settings;
  if (!s.proxyUrl && !s.apiKey) throw new Error('Marking not set up (More → Marking service).');
  const payload = { model: s.model, max_tokens: maxTokens, messages };
  let res;
  if (s.proxyUrl) {
    const headers = { 'content-type':'application/json' };
    if (s.proxyToken) headers['x-access-token'] = s.proxyToken;
    res = await fetch(s.proxyUrl, { method:'POST', headers, body: JSON.stringify(payload) });
  } else {
    res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{ 'content-type':'application/json', 'x-api-key': s.apiKey,
        'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
      body: JSON.stringify(payload),
    });
  }
  if (!res.ok) { const t = await res.text(); throw new Error(`${res.status}: ${t.slice(0,300)}`); }
  const data = await res.json();
  return (data.content || []).map(c => c.text || '').join('\n');
}
async function markEssay() {
  const type = document.getElementById('esType').value;
  const q = document.getElementById('esQ').value.trim();
  const extracts = document.getElementById('esX').value.trim();
  const a = document.getElementById('esA').value.trim();
  const out = document.getElementById('esOut');
  const s = STATE.settings;
  if (!a) { alert('Paste your answer first.'); return; }
  if (!s.proxyUrl && !s.apiKey) { alert('Set up marking under More → Marking service (a proxy URL, or a personal API key).'); return; }
  const r = CONTENT.rubrics[type];
  out.innerHTML = `<div class="card"><div class="muted">Marking… this can take 15–30 seconds.</div></div>`;
  const isPoints = r.style === 'points';
  const ladder = (r.bands || []).map(b => isPoints ? `(${b.r} marks) ${b.d}` : `Level ${b.l} (${b.r} marks): ${b.d}`).join('\n\n');
  const method = isPoints
    ? `This tariff is marked by POINTS, not levels. Award each creditable point against the breakdown below and total them.`
    : `Mark using the official levels-of-response approach: read holistically, start at the lowest level and work up until the descriptor no longer fits, then place the answer by best fit. Choose the mark within that level by how far it reaches towards the level above — an answer that is predominantly Level 3 with some Level 4 material sits at the top of Level 3, not in Level 4.`;
  const prompt =
`You are an experienced ${r.name.split('—')[0].trim()} A-level examiner. ${method}

QUESTION TYPE: ${r.name} (max ${r.max} marks). Assessment objectives: ${r.ao}.

MARK SCHEME — ${isPoints ? 'points breakdown' : 'full level descriptors, verbatim from the exam board'}:
${ladder}

Treat any indicative content as illustrative, NOT a checklist — do not penalise valid alternative content or reward keyword-stuffing.
${extracts ? `\nEXTRACTS / SOURCES THE ANSWER MUST ENGAGE WITH:\n${extracts}\n` : ''}
EXAM QUESTION: ${q || '(not supplied — infer from the answer)'}

STUDENT ANSWER:
"""${a}"""

Respond in this exact structure with markdown headings:
### ${isPoints ? 'Mark' : 'Level & mark'}
State ${isPoints ? 'a specific mark' : 'the level and a specific mark'} out of ${r.max}, with one sentence of justification quoting the phrase from the ${isPoints ? 'breakdown' : 'descriptor'} that decided it.
### AO-by-AO feedback
For each assessment objective in "${r.ao}", say what was and wasn't evidenced.
### ${isPoints ? 'The marks you didn\'t get' : 'What the next band up needs'}
${isPoints
  ? 'Name each mark not awarded and what specifically would have earned it.'
  : 'Name the level above and state exactly what is missing from this answer to reach it, in the mark scheme\'s own terms. If already at the top band, say what would make it a secure rather than borderline top-band answer.'}
### Three things to improve
Three concrete, actionable fixes tied to the mark scheme (e.g. "your judgement isn't substantiated — add a criterion for why X outweighs Y").
### One-line summary
A single sentence the student can remember.

End by reminding them this is an approximation, not an official mark.`;
  try {
    const text = await callLLM([{ role:'user', content: prompt }], 1200);
    out.innerHTML = `<div class="card marking-out">${mdLite(text)}</div>`;
    const sumMatch = text.split(/one-?line summary/i)[1] || '';
    STATE.essays.push({ date: iso(today()), type, summary: sumMatch.replace(/^[:\s#*-]+/,'').split('\n')[0].slice(0,160) });
    save();
  } catch (e) {
    out.innerHTML = `<div class="card"><div class="banner">Couldn't get feedback: ${e.message}</div>
      <div class="faint" style="margin-top:8px">${s.proxyUrl ? 'Check the proxy URL/token (More → Marking service) and the Worker logs in Cloudflare.' : 'Check your API key and network.'}</div></div>`;
  }
}
function mdLite(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
}

/* --- Progress --- */
function renderProgress() {
  setHeader('Progress', '');
  const e = STATE.settings.exams; const t0 = today();
  const cd = (d) => Math.max(0, daysBetween(t0, d));
  let h = `<div class="wrap"><div class="card"><h2>Countdown</h2><div class="count-grid" style="margin-top:10px">
    <div class="count"><div class="n">${cd(e.mockOct)}</div><div class="l">days to Oct mocks</div></div>
    <div class="count"><div class="n">${cd(e.mockFeb)}</div><div class="l">days to Feb mocks</div></div>
    <div class="count"><div class="n">${cd(e.finals)}</div><div class="l">days to finals</div></div>
  </div></div>`;
  // confidence overview
  CONTENT.subjects.forEach(s => {
    const cs = s.topics.map(t => topicState(t.id).confidence);
    const g = cs.filter(c=>c===2).length, a = cs.filter(c=>c===1).length, r = cs.filter(c=>c===0).length, n = cs.filter(c=>c===null).length;
    const pct = Math.round(g/s.topics.length*100);
    h += `<div class="card"><div class="spread"><h2><span class="pill ${s.cls}">${s.name}</span></h2><div class="faint">${pct}% green</div></div>
      <div class="progressbar" style="margin:8px 0"><span style="width:${pct}%"></span></div>
      <div class="faint">🟢 ${g} secure · 🟡 ${a} shaky · 🔴 ${r} weak · ⚪ ${n} not rated</div>`;
    // weakest topics
    const weak = s.topics.filter(t=>[0,1].includes(topicState(t.id).confidence)).slice(0,3);
    if (weak.length) h += `<div class="faint" style="margin-top:6px">Focus next: ${weak.map(w=>w.title).join(' · ')}</div>`;
    h += `</div>`;
  });
  // practice trend
  h += `<div class="card"><h2>Practice</h2>`;
  if (!STATE.practice.length) h += `<div class="empty">Log past-paper attempts to see your average.</div>`;
  else { const avg = Math.round(STATE.practice.reduce((s,p)=>s+(p.got/p.max),0)/STATE.practice.length*100);
    h += `<div class="muted">${STATE.practice.length} attempts logged · average <b>${avg}%</b></div>`; }
  h += `</div></div>`;
  app.innerHTML = h;
}

      <label>Proxy URL</label><input id="stProxy" placeholder="https://…​.workers.dev" value="${s.proxyUrl}">
      <label>Proxy access token (optional)</label><input id="stProxyTok" type="password" placeholder="the ACCESS_TOKEN you set" value="${s.proxyToken}">
      <hr class="sep">
      <div class="faint">Or, as a fallback, a personal Anthropic key stored only on this device:</div>
      <label>Anthropic API key (fallback)</label><input id="stKey" type="password" placeholder="sk-ant-…" value="${s.apiKey}">
      <label>Model</label><input id="stModel" value="${s.model}">
      <div class="faint" style="margin-top:6px">${s.proxyUrl ? '✅ Using the proxy — no key needed on this device.' : (s.apiKey ? 'Using the on-device key.' : 'Not set up yet.')}</div></div>
    <div class="card"><h2>Data</h2><div class="muted">Everything lives on this device. Back it up here.</div>
      <div class="split2" style="margin-top:10px"><button class="btn sec" id="stExport">Export backup</button><button class="btn sec" id="stImport">Import backup</button></div>
      <button class="tiny-link" id="stReset" style="margin-top:14px;color:var(--red)">Reset all data</button></div>
    <div class="card"><h2>About the plan</h2><div class="muted">Built from the AQA/Edexcel specs and evidence-based revision science. History = <b>1H Russia 1855–1964</b> (breadth) + <b>2B Wars of the Roses 1450–1499</b> (depth) + <b>Civil Rights</b> NEA. Business Paper 3 pre-release industry for 2027 needs confirming when published. See <b>REVISION_PLANNER_PLAN.md</b> in the repo.</div></div>
  </div>`;
  app.innerHTML = h;
  const bind = (id, fn) => document.getElementById(id).onchange = fn;
  bind('stWd', e => { s.capWeekday = +e.target.value; save(); });
  bind('stWe', e => { s.capWeekend = +e.target.value; save(); });
  bind('stOct', e => { s.exams.mockOct = e.target.value; save(); });
  bind('stFeb', e => { s.exams.mockFeb = e.target.value; save(); });
  bind('stFin', e => { s.exams.finals = e.target.value; save(); });
  bind('stProxy', e => { s.proxyUrl = e.target.value.trim(); save(); });
  bind('stProxyTok', e => { s.proxyToken = e.target.value.trim(); save(); });
  bind('stKey', e => { s.apiKey = e.target.value.trim(); save(); });
  bind('stModel', e => { s.model = e.target.value.trim(); save(); });
  document.getElementById('stExport').onclick = () => {
    const blob = new Blob([JSON.stringify(STATE,null,2)], { type:'application/json' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = 'revision-backup.json'; a.click(); URL.revokeObjectURL(url);
  };
  document.getElementById('stImport').onclick = () => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json';
    inp.onchange = () => { const f = inp.files[0]; const rd = new FileReader();
      rd.onload = () => { try { STATE = JSON.parse(rd.result); save(); alert('Restored.'); render(); } catch(e){ alert('Bad file.'); } }; rd.readAsText(f); };
    inp.click();
  };
  document.getElementById('stReset').onclick = () => { if (confirm('Erase all data on this device?')) { localStorage.removeItem(LS_KEY); STATE = load(); render(); } };
}
