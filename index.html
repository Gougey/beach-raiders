            ctx.fillStyle = hpRatio > 0.5 ? C.healthGreen : C.healthRed;
            ctx.fillRect(sx - hbWidth / 2, drawY - spriteHeight / 2 - 7, hbWidth * hpRatio, 3);
        }
        return;
    }

    // ---- Fallback: procedural drawing ----
    ctx.save();
    ctx.translate(sx, sy);

    if (u.type === 'infantry' || u.type === 'bazooka') {
        const walkPhase = Math.sin((u.walkFrame || 0) + u.x * 0.1) * (u.state === 'march' ? 4 : 0);

        // === BOOM BEACH CHUNKY SOLDIER ===
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(0, u.h / 2, 9, 3, 0, 0, Math.PI * 2);
        ctx.fill();

        // Boots
        const bootColor = isPlayer ? '#1b3a1b' : '#3e1a1a';
        ctx.fillStyle = bootColor;
        ctx.beginPath();
        ctx.ellipse(-3 - walkPhase * 0.8, u.h / 2, 4, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(3 + walkPhase * 0.8, u.h / 2, 4, 3, 0, 0, Math.PI * 2);
        ctx.fill();

        // Legs
        const pantsColor = isPlayer ? '#2e7d32' : '#8e2424';
        ctx.strokeStyle = pantsColor;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-3, 4);
        ctx.lineTo(-3 - walkPhase * 0.8, u.h / 2 - 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(3, 4);
        ctx.lineTo(3 + walkPhase * 0.8, u.h / 2 - 2);
        ctx.stroke();

        // Body/vest — chunky torso
        const vestColor1 = isPlayer ?
            (u.type === 'infantry' ? '#2e7d32' : '#00695c') :
            (u.type === 'infantry' ? '#c62828' : '#d84315');
        const vestColor2 = isPlayer ?
            (u.type === 'infantry' ? '#1b5e20' : '#004d40') :
            (u.type === 'infantry' ? '#8e0000' : '#bf360c');
        const vestGrad = ctx.createLinearGradient(-7, -7, 7, 8);
        vestGrad.addColorStop(0, vestColor1);
        vestGrad.addColorStop(1, vestColor2);
        ctx.fillStyle = vestGrad;
        roundRect(-7, -7, 14, 14, 2);
        ctx.fill();
        // Vest outline
        ctx.strokeStyle = vestColor2;
        ctx.lineWidth = 1;
        roundRect(-7, -7, 14, 14, 2);
        ctx.stroke();
        // Vest pocket/detail
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(-5, -2, 4, 4);
        ctx.fillRect(1, -2, 4, 4);

        // Arms
        ctx.strokeStyle = vestColor1;
        ctx.lineWidth = 3.5;
        ctx.lineCap = 'round';
        // Back arm
        ctx.beginPath();
        ctx.moveTo(-dir * 5, -3);
        ctx.lineTo(-dir * 8, 3);
        ctx.stroke();
        // Front arm (holding weapon)
        ctx.beginPath();
        ctx.moveTo(dir * 5, -3);
        ctx.lineTo(dir * 9, -1);
        ctx.stroke();

        // Skin-colored hands
        ctx.fillStyle = '#ffcc80';
        ctx.beginPath();
        ctx.arc(dir * 9, -1, 2, 0, Math.PI * 2);
        ctx.fill();

        // Head — big chunky Boom Beach head
        const headGrad = ctx.createRadialGradient(0, -12, 1, 0, -10, 7);
        headGrad.addColorStop(0, '#ffe0b2');
        headGrad.addColorStop(1, '#ffcc80');
        ctx.fillStyle = headGrad;
        ctx.beginPath();
        ctx.arc(0, -11, 6.5, 0, Math.PI * 2);
        ctx.fill();
        // Head outline
        ctx.strokeStyle = '#e6a86e';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(0, -11, 6.5, 0, Math.PI * 2);
        ctx.stroke();

        // Simple face
        // Eyes
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(dir * 2, -12, 1.2, 0, Math.PI * 2);
        ctx.arc(dir * -2, -12, 1, 0, Math.PI * 2);
        ctx.fill();
        // Mouth (small line)
        ctx.strokeStyle = '#bf8a60';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(-2, -8.5);
        ctx.lineTo(2, -8.5);
        ctx.stroke();

        // Helmet
        const helmetColor1 = isPlayer ? '#2e7d32' : '#5d4037';
        const helmetColor2 = isPlayer ? '#1b5e20' : '#3e2723';
        const helmetGrad = ctx.createLinearGradient(-7, -18, 7, -12);
        helmetGrad.addColorStop(0, helmetColor1);
        helmetGrad.addColorStop(1, helmetColor2);
        ctx.fillStyle = helmetGrad;
        ctx.beginPath();
        ctx.arc(0, -13, 7.5, Math.PI, 0);
        ctx.fill();
        // Helmet brim
        ctx.fillStyle = helmetColor2;
        ctx.fillRect(-8, -13, 16, 2);
        // Helmet shine
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath();
        ctx.arc(-2, -16, 3, 0, Math.PI * 2);
        ctx.fill();

        // Weapon with proper detail
        if (u.type === 'bazooka') {
            // Bazooka tube
            ctx.fillStyle = '#546e7a';
            ctx.save();
            ctx.translate(dir * 9, -2);
            ctx.rotate(dir > 0 ? -0.1 : Math.PI + 0.1);
            roundRect(0, -3, 22, 6, 2);
            ctx.fill();
            ctx.strokeStyle = '#37474f';
            ctx.lineWidth = 1;
            roundRect(0, -3, 22, 6, 2);
            ctx.stroke();
            // Bazooka opening
            ctx.fillStyle = '#263238';
            ctx.beginPath();
            ctx.arc(22, 0, 3, 0, Math.PI * 2);
            ctx.fill();
            // Sight
            ctx.fillStyle = '#78909c';
            ctx.fillRect(8, -5, 3, 3);
            ctx.restore();
        } else {
            // Rifle
            ctx.fillStyle = '#5d4037';
            ctx.save();
            ctx.translate(dir * 9, -1);
            ctx.rotate(dir > 0 ? -0.15 : Math.PI + 0.15);
            ctx.fillRect(0, -1.5, 14, 3);
            // Barrel
            ctx.fillStyle = '#37474f';
            ctx.fillRect(10, -1, 8, 2);
            // Stock
            ctx.fillStyle = '#4e342e';
            ctx.fillRect(-4, -2, 5, 4);
            ctx.restore();
        }

        // Muzzle flash when fighting
        if (u.state === 'fight' && u.attackCooldown > u.attackRate - 5) {
            ctx.fillStyle = '#ffeb3b';
            ctx.shadowBlur = 6;
            ctx.shadowColor = '#ff9800';
            ctx.beginPath();
            ctx.arc(dir * 24, -3, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

    } else if (u.type === 'tank') {
        // === BOOM BEACH CHUNKY CARTOON TANK ===
        const bodyColor1 = isPlayer ? '#546e7a' : '#5d4037';
        const bodyColor2 = isPlayer ? '#37474f' : '#4e342e';
        const accentColor = isPlayer ? '#4fc3f7' : '#ef5350';

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        ctx.ellipse(0, u.h / 2 + 3, 24, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Treads with individual track links
        ctx.fillStyle = '#212121';
        roundRect(-20, 2, 40, 12, 4);
        ctx.fill();
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 1;
        roundRect(-20, 2, 40, 12, 4);
        ctx.stroke();
        // Track links
        ctx.fillStyle = '#333';
        for (let t = -17; t < 18; t += 5) {
            const linkOff = ((frameCount * (u.state === 'march' ? 2 : 0) + t * 10) % 5);
            ctx.fillRect(t + linkOff * 0.2, 4, 3, 8);
        }
        // Track wheels
        ctx.fillStyle = '#424242';
        for (let w = -14; w <= 14; w += 7) {
            ctx.beginPath();
            ctx.arc(w, 8, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#555';
            ctx.beginPath();
            ctx.arc(w, 8, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#424242';
        }

        // Hull with angled armor
        const hullGrad = ctx.createLinearGradient(0, -8, 0, 4);
        hullGrad.addColorStop(0, bodyColor1);
        hullGrad.addColorStop(1, bodyColor2);
        ctx.fillStyle = hullGrad;
        ctx.beginPath();
        ctx.moveTo(-18, 3);
        ctx.lineTo(-15, -7);
        ctx.lineTo(-8, -9);
        ctx.lineTo(12, -9);
        ctx.lineTo(16, -7);
        ctx.lineTo(18, 3);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = shadeColor(bodyColor2, -20);
        ctx.lineWidth = 1.5;
        ctx.stroke();
        // Hull highlight
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.beginPath();
        ctx.moveTo(-14, -7);
        ctx.lineTo(-8, -9);
        ctx.lineTo(12, -9);
        ctx.lineTo(14, -7);
        ctx.closePath();
        ctx.fill();
        // Armor plate lines
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(-10, -9);
        ctx.lineTo(-12, 3);
        ctx.moveTo(5, -9);
        ctx.lineTo(7, 3);
        ctx.stroke();

        // Turret — rounded with gradient
        const turretGrad = ctx.createRadialGradient(0, -10, 2, 0, -8, 10);
        turretGrad.addColorStop(0, isPlayer ? '#78909c' : '#795548');
        turretGrad.addColorStop(1, isPlayer ? '#455a64' : '#4e342e');
        ctx.fillStyle = turretGrad;
        ctx.beginPath();
        ctx.arc(0, -9, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = shadeColor(bodyColor2, -20);
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, -9, 9, 0, Math.PI * 2);
        ctx.stroke();
        // Turret highlight
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.beginPath();
        ctx.arc(-2, -12, 5, 0, Math.PI * 2);
        ctx.fill();

        // Barrel with proper shape
        ctx.fillStyle = '#333';
        const barrelLen = 24;
        ctx.beginPath();
        ctx.moveTo(dir * 7, -11);
        ctx.lineTo(dir * (7 + barrelLen), -11);
        ctx.lineTo(dir * (7 + barrelLen), -7);
        ctx.lineTo(dir * 7, -7);
        ctx.closePath();
        ctx.fill();
        // Barrel muzzle brake
        ctx.fillStyle = '#444';
        ctx.fillRect(dir * (7 + barrelLen - 4), -12, dir * 6, 6);
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 1;
        ctx.strokeRect(dir * (7 + barrelLen - 4), -12, dir * 6, 6);
        // Barrel highlight
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.fillRect(dir * 7, -11, dir * barrelLen, 1.5);

        // Team emblem on turret
        ctx.fillStyle = accentColor;
        ctx.shadowBlur = 3;
        ctx.shadowColor = accentColor;
        ctx.beginPath();
        ctx.arc(0, -9, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        // Inner emblem detail
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ctx.arc(0, -9, 2, 0, Math.PI * 2);
        ctx.fill();

        // Exhaust puff when moving
        if (u.state === 'march' && frameCount % 8 < 4) {
            ctx.fillStyle = 'rgba(100,100,100,0.3)';
            const exDir = isPlayer ? -1 : 1;
            ctx.beginPath();
            ctx.arc(exDir * 20, -2, 3 + Math.random() * 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // Muzzle flash for tank
        if (u.state === 'fight' && u.attackCooldown > u.attackRate - 5) {
            const muzzleX = dir * (7 + barrelLen + 2);
            ctx.fillStyle = '#ffeb3b';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ff9800';
            ctx.beginPath();
            ctx.arc(muzzleX, -9, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(muzzleX, -9, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    // Health bar — Boom Beach style with rounded corners and outline
    if (u.hp < u.maxHp) {
        const hbWidth = u.type === 'tank' ? 34 : 22;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        roundRect(-hbWidth / 2 - 1, -u.h / 2 - 12, hbWidth + 2, 6, 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 0.5;
        roundRect(-hbWidth / 2 - 1, -u.h / 2 - 12, hbWidth + 2, 6, 2);
        ctx.stroke();
        const hpRatio = u.hp / u.maxHp;
        const barColor = hpRatio > 0.5 ? C.healthGreen : C.healthRed;
        const barGrad = ctx.createLinearGradient(0, -u.h / 2 - 11, 0, -u.h / 2 - 7);
        barGrad.addColorStop(0, barColor);
        barGrad.addColorStop(1, shadeColor(barColor, -25));
        ctx.fillStyle = barGrad;
        if (hpRatio > 0) {
            roundRect(-hbWidth / 2, -u.h / 2 - 11, hbWidth * hpRatio, 4, 1.5);
            ctx.fill();
        }
    }

    ctx.restore();
}

function drawBullets() {
    for (const b of bullets) {
        const sx = b.x - cameraX;
        if (sx < -10 || sx > W + 10) continue;

        if (b.type === 'heli') {
            // Bright tracer round — streak oriented along velocity vector so
            // it reads clearly against sky and ground. Hot-red core, orange
            // halo, white-hot tip.
            const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy) || 1;
            const dx = b.vx / speed;
            const dy = b.vy / speed;
            const len = 14;        // streak length
            const tailX = sx - dx * len;
            const tailY = b.y - dy * len;

            ctx.save();
            // Outer glow
            ctx.shadowBlur = 14;
            ctx.shadowColor = '#ff5722';
            ctx.strokeStyle = '#ff7043';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(tailX, tailY);
            ctx.lineTo(sx, b.y);
            ctx.stroke();
            // Bright core
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#ffeb3b';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(tailX, tailY);
            ctx.lineTo(sx, b.y);
            ctx.stroke();
            // White-hot leading tip
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(sx, b.y, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        } else if (b.type === 'shell') {
            // Tank shell with trail
            ctx.fillStyle = 'rgba(80,80,80,0.3)';
            ctx.beginPath();
            ctx.arc(sx - b.vx * 3, b.y - b.vy * 3, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(80,80,80,0.15)';
            ctx.beginPath();
            ctx.arc(sx - b.vx * 6, b.y - b.vy * 6, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#444';
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(sx, b.y, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        } else if (b.type === 'rocket') {
            // Rocket with smoke trail
            ctx.fillStyle = '#ef5350';
            ctx.shadowBlur = 6;
            ctx.shadowColor = '#ff5722';
            ctx.beginPath();
            ctx.arc(sx, b.y, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            // Rocket tip
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(sx + b.vx * 0.3, b.y + b.vy * 0.3, 1.5, 0, Math.PI * 2);
            ctx.fill();
            // Smoke trail
            spawnParticles(b.x, b.y, '#aaa', 1, 0.3, 8);
            spawnParticles(b.x - b.vx, b.y - b.vy, '#ff9800', 1, 0.5, 5);
        }
    }
}

function drawParticles() {
    for (const p of particles) {
        const sx = p.x - cameraX;
        if (sx < -20 || sx > W + 20) continue;
        const alpha = p.life / p.maxLife;

        if (p.isShockwave) {
            ctx.globalAlpha = alpha * 0.5;
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(sx, p.y, p.radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 1;
            continue;
        }

        if (p.isCasing) {
            ctx.globalAlpha = alpha;
            ctx.fillStyle = '#d4a017';
            ctx.fillRect(sx - 1, p.y - 1.5, 2, 3);
            ctx.globalAlpha = 1;
            continue;
        }

        if (p.isDust) {
            ctx.globalAlpha = alpha * 0.4;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(sx, p.y, p.size * (1.5 - alpha * 0.5), 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
            continue;
        }

        if (p.isDebris) {
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color;
            ctx.save();
            ctx.translate(sx, p.y);
            ctx.rotate(p.life * 0.3);
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
            ctx.restore();
            ctx.globalAlpha = 1;
            continue;
        }

        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.shadowBlur = p.size * alpha * 2;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(sx, p.y, p.size * alpha, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
}

function drawAmbientParticles() {
    for (const l of ambientParticles) {
        const sx = l.x - cameraX;
        if (sx < -10 || sx > W + 10) continue;
        ctx.save();
        ctx.translate(sx, l.y);
        ctx.rotate(l.rot);
        ctx.fillStyle = l.color;
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.ellipse(0, 0, l.size, l.size * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.restore();
    }
}

// ===========================================================================
// MOCKUP-BASED HUD
// Top:    [stats panel] [wave bar] [enemy panel] [pause]
// Bottom: [DEPLOY card panel]                              [income + powerups]
// ===========================================================================

// ---- Reusable HUD helpers ----

function hudPanel(x, y, w, h, opts = {}) {
    // Dark navy panel with rounded corners and subtle border, like the mockup
    const r = opts.radius || 14;
    ctx.save();
    // Drop shadow
    ctx.shadowBlur = 12;
    ctx.shadowColor = 'rgba(0, 10, 30, 0.5)';
    ctx.shadowOffsetY = 3;
    // Background
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, opts.top || 'rgba(20, 30, 55, 0.92)');
    grad.addColorStop(1, opts.bottom || 'rgba(10, 20, 40, 0.92)');
    ctx.fillStyle = grad;
    roundRect(x, y, w, h, r);
    ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    // Inner highlight
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
    ctx.lineWidth = 1;
    roundRect(x + 1, y + 1, w - 2, h - 2, r - 1);
    ctx.stroke();
    // Outer border
    ctx.strokeStyle = opts.border || 'rgba(0, 0, 0, 0.6)';
    ctx.lineWidth = 2;
    roundRect(x, y, w, h, r);
    ctx.stroke();
    ctx.restore();
}

function iconCoin(cx, cy, r) {
    ctx.save();
    ctx.fillStyle = '#ffc107';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ff8f00'; ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#fff8e1';
    ctx.beginPath(); ctx.arc(cx - r * 0.3, cy - r * 0.3, r * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff8f00';
    ctx.font = `bold ${r * 1.3}px "Lilita One", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('$', cx, cy + 1);
    ctx.restore();
}

function iconShield(cx, cy, r, color) {
    ctx.save();
    ctx.fillStyle = color || '#42a5f5';
    ctx.strokeStyle = '#0d47a1';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy - r);
    ctx.lineTo(cx + r * 0.85, cy - r * 0.5);
    ctx.quadraticCurveTo(cx + r * 0.85, cy + r * 0.6, cx, cy + r);
    ctx.quadraticCurveTo(cx - r * 0.85, cy + r * 0.6, cx - r * 0.85, cy - r * 0.5);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // Inner highlight
    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.beginPath();
    ctx.moveTo(cx, cy - r * 0.7);
    ctx.lineTo(cx + r * 0.4, cy - r * 0.3);
    ctx.lineTo(cx, cy + r * 0.2);
    ctx.lineTo(cx - r * 0.4, cy - r * 0.3);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

function iconCross(cx, cy, r) {
    // Green plus/medical cross
    ctx.save();
    const w = r * 0.45;
    ctx.fillStyle = '#43a047';
    ctx.strokeStyle = '#1b5e20';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.rect(cx - r, cy - w, r * 2, w * 2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.rect(cx - w, cy - r, w * 2, r * 2);
    ctx.fill(); ctx.stroke();
    // Re-fill with no stroke to clean up overlap
    ctx.strokeStyle = 'transparent';
    ctx.fillStyle = '#43a047';
    ctx.fillRect(cx - r + 1, cy - w + 1, r * 2 - 2, w * 2 - 2);
    ctx.fillRect(cx - w + 1, cy - r + 1, w * 2 - 2, r * 2 - 2);
    // Outline overall plus
    ctx.strokeStyle = '#1b5e20';
    ctx.beginPath();
    ctx.moveTo(cx - r, cy - w); ctx.lineTo(cx - w, cy - w); ctx.lineTo(cx - w, cy - r);
    ctx.lineTo(cx + w, cy - r); ctx.lineTo(cx + w, cy - w); ctx.lineTo(cx + r, cy - w);
    ctx.lineTo(cx + r, cy + w); ctx.lineTo(cx + w, cy + w); ctx.lineTo(cx + w, cy + r);
    ctx.lineTo(cx - w, cy + r); ctx.lineTo(cx - w, cy + w); ctx.lineTo(cx - r, cy + w);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
}

function iconCastle(cx, cy, r) {
    ctx.save();
    ctx.fillStyle = '#c62828';
    ctx.strokeStyle = '#4e0000';
    ctx.lineWidth = 2;
    // Crenellated top
    ctx.beginPath();
    ctx.moveTo(cx - r, cy + r);
    ctx.lineTo(cx - r, cy - r * 0.4);
    ctx.lineTo(cx - r * 0.6, cy - r * 0.4);
    ctx.lineTo(cx - r * 0.6, cy - r);
    ctx.lineTo(cx - r * 0.2, cy - r);
    ctx.lineTo(cx - r * 0.2, cy - r * 0.4);
    ctx.lineTo(cx + r * 0.2, cy - r * 0.4);
    ctx.lineTo(cx + r * 0.2, cy - r);
    ctx.lineTo(cx + r * 0.6, cy - r);
    ctx.lineTo(cx + r * 0.6, cy - r * 0.4);
    ctx.lineTo(cx + r, cy - r * 0.4);
    ctx.lineTo(cx + r, cy + r);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // Door
    ctx.fillStyle = '#4e0000';
    ctx.fillRect(cx - r * 0.25, cy + r * 0.1, r * 0.5, r * 0.9);
    ctx.restore();
}

function iconStar(cx, cy, r, color, outline) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.strokeStyle = outline;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
        const angle = (i * Math.PI) / 5 - Math.PI / 2;
        const rad = i % 2 === 0 ? r : r * 0.45;
        const x = cx + Math.cos(angle) * rad;
        const y = cy + Math.sin(angle) * rad;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
}

function iconPause(cx, cy, r) {
    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx - r * 0.5, cy - r, r * 0.35, r * 2);
    ctx.fillRect(cx + r * 0.15, cy - r, r * 0.35, r * 2);
    ctx.restore();
}

function iconMissile(cx, cy, r) {
    // 2 small red rockets
    ctx.save();
    for (let i = 0; i < 2; i++) {
        const ox = i === 0 ? -r * 0.45 : r * 0.45;
        const tilt = i === 0 ? -0.35 : 0.35;
        ctx.save();
        ctx.translate(cx + ox, cy);
        ctx.rotate(tilt);
        // Body
        ctx.fillStyle = '#fafafa';
        ctx.strokeStyle = '#212121';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.9);
        ctx.lineTo(r * 0.25, -r * 0.6);
        ctx.lineTo(r * 0.25, r * 0.6);
        ctx.lineTo(-r * 0.25, r * 0.6);
        ctx.lineTo(-r * 0.25, -r * 0.6);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        // Red nose
        ctx.fillStyle = '#e53935';
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.9);
        ctx.lineTo(r * 0.25, -r * 0.6);
        ctx.lineTo(-r * 0.25, -r * 0.6);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        // Fins
        ctx.fillStyle = '#e53935';
        ctx.beginPath();
        ctx.moveTo(-r * 0.25, r * 0.4);
        ctx.lineTo(-r * 0.5, r * 0.8);
        ctx.lineTo(-r * 0.25, r * 0.8);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(r * 0.25, r * 0.4);
        ctx.lineTo(r * 0.5, r * 0.8);
        ctx.lineTo(r * 0.25, r * 0.8);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.restore();
    }
    ctx.restore();
}

function iconWrench(cx, cy, r) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-Math.PI / 4);
    ctx.fillStyle = '#90a4ae';
    ctx.strokeStyle = '#37474f';
    ctx.lineWidth = 1.5;
    // Handle
    ctx.beginPath();
    ctx.rect(-r * 0.18, -r * 0.4, r * 0.36, r * 1.2);
    ctx.fill(); ctx.stroke();
    // Head
    ctx.beginPath();
    ctx.arc(0, -r * 0.55, r * 0.45, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#0a1628';
    ctx.beginPath();
    ctx.arc(0, -r * 0.55, r * 0.18, 0, Math.PI * 2);
    ctx.fill();
    // Notch (open end)
    ctx.fillStyle = '#0a1628';
    ctx.beginPath();
    ctx.moveTo(-r * 0.25, -r);
    ctx.lineTo(0, -r * 0.65);
    ctx.lineTo(r * 0.25, -r);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

// Tiny soldier silhouette icon for the wave bar
function iconSoldier(cx, cy, h, color) {
    ctx.save();
    ctx.fillStyle = color;
    // Helmet
    ctx.beginPath();
    ctx.arc(cx, cy - h * 0.3, h * 0.18, Math.PI, 0);
    ctx.fill();
    // Body
    ctx.fillRect(cx - h * 0.12, cy - h * 0.15, h * 0.24, h * 0.4);
    // Legs
    ctx.fillRect(cx - h * 0.13, cy + h * 0.22, h * 0.08, h * 0.18);
    ctx.fillRect(cx + h * 0.05, cy + h * 0.22, h * 0.08, h * 0.18);
    ctx.restore();
}

// Round button background with bevel
function bevelButton(x, y, w, h, opts = {}) {
    const r = opts.radius || 10;
    ctx.save();
    // Drop shadow
    ctx.shadowBlur = 6;
    ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
    ctx.shadowOffsetY = 2;
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, opts.top || 'rgba(40, 55, 85, 0.95)');
    grad.addColorStop(1, opts.bottom || 'rgba(15, 25, 50, 0.95)');
    ctx.fillStyle = grad;
    roundRect(x, y, w, h, r);
    ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    // Inner highlight
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.lineWidth = 1;
    roundRect(x + 1, y + 1, w - 2, h - 2, r - 1);
    ctx.stroke();
    ctx.strokeStyle = opts.border || 'rgba(0, 0, 0, 0.6)';
    ctx.lineWidth = 2;
    roundRect(x, y, w, h, r);
    ctx.stroke();
    ctx.restore();
}

// ---- Main HUD ----

function drawHUD() {
    hudHitRects = [];
    pauseHitRect = null;

    drawTopHUD();
    drawDeployPanel();
    drawIncomePowerupPanel();

    // Pause overlay if game is paused
    if (gameState === 'paused') {
        ctx.save();
        ctx.fillStyle = 'rgba(10, 22, 40, 0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ffd54f';
        ctx.font = 'bold 80px "Lilita One", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowBlur = 16;
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.fillText('PAUSED', W / 2, H / 2 - 20);
        ctx.font = '600 22px "Fredoka", sans-serif';
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 4;
        ctx.fillText('Press P / Esc / click pause to resume', W / 2, H / 2 + 50);
        ctx.restore();
    }
}

// ----- Top HUD -----

function drawTopHUD() {
    // === LEFT — money / base hp / heli hp combined panel ===
    const leftX = 12, leftY = 12;
    const leftW = 460, leftH = 60;
    hudPanel(leftX, leftY, leftW, leftH);

    // Money cell
    iconCoin(leftX + 32, leftY + leftH / 2, 16);
    ctx.fillStyle = '#ffd54f';
    ctx.font = 'bold 26px "Lilita One", sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.shadowBlur = 4; ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.fillText(Math.floor(money).toString(), leftX + 56, leftY + leftH / 2 + 1);
    ctx.shadowBlur = 0;

    // Vertical separator
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(leftX + 145, leftY + 8); ctx.lineTo(leftX + 145, leftY + leftH - 8); ctx.stroke();

    // Base HP cell
    iconShield(leftX + 165, leftY + leftH / 2, 13, '#42a5f5');
    ctx.fillStyle = '#90caf9';
    ctx.font = 'bold 11px "Lilita One", sans-serif';
    ctx.fillText('BASE HP', leftX + 188, leftY + 22);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px "Lilita One", sans-serif';
    ctx.fillText(`${Math.max(0, Math.ceil(playerBase.hp))} / ${playerBase.maxHp}`, leftX + 188, leftY + 41);

    // Vertical separator
    ctx.beginPath(); ctx.moveTo(leftX + 305, leftY + 8); ctx.lineTo(leftX + 305, leftY + leftH - 8); ctx.stroke();

    // Heli HP cell
    iconCross(leftX + 325, leftY + leftH / 2, 11);
    ctx.fillStyle = '#a5d6a7';
    ctx.font = 'bold 11px "Lilita One", sans-serif';
    ctx.fillText('HELI HP', leftX + 348, leftY + 22);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px "Lilita One", sans-serif';
    ctx.fillText(`${Math.max(0, Math.ceil(heli.hp))} / ${heli.maxHp}`, leftX + 348, leftY + 41);

    // === CENTER — wave progress bar ===
    drawWaveBar();

    // === RIGHT — enemy base panel ===
    const rightW = 220, rightH = 60;
    const rightX = W - rightW - 70 - 12;  // leave room for pause button
    const rightY = 12;
    hudPanel(rightX, rightY, rightW, rightH);

    iconCastle(rightX + 30, rightY + rightH / 2, 16);
    ctx.fillStyle = '#ef9a9a';
    ctx.font = 'bold 11px "Lilita One", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('ENEMY BASE HP', rightX + 56, rightY + 22);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px "Lilita One", sans-serif';
    ctx.fillText(`${Math.max(0, Math.ceil(enemyBase.hp))} / ${enemyBase.maxHp}`,
                 rightX + 56, rightY + 41);

    // === Pause button ===
    const pauseSize = 48;
    const pauseX = W - pauseSize - 14;
    const pauseY = 18;
    bevelButton(pauseX, pauseY, pauseSize, pauseSize, { radius: 12 });
    iconPause(pauseX + pauseSize / 2, pauseY + pauseSize / 2, 11);
    pauseHitRect = { x: pauseX, y: pauseY, w: pauseSize, h: pauseSize };
}

function drawWaveBar() {
    // Position centered below the top edge, between the left and right panels
    const barY = 30;
    const barH = 20;
    const barX = 510;
    const barW = W - 510 - 320;  // ~370 wide

    // Wood/dark backdrop
    hudPanel(barX - 20, barY - 14, barW + 40, barH + 30, { radius: 14 });

    // Star icons at ends
    iconStar(barX - 4, barY + barH / 2, 12, '#42a5f5', '#0d47a1');
    iconStar(barX + barW + 4, barY + barH / 2, 12, '#e53935', '#4e0000');

    // Bar background
    ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
    roundRect(barX + 10, barY, barW - 20, barH, 10);
    ctx.fill();

    // Player progress (blue) — fills based on enemy base HP destroyed
    const enemyHpRatio = enemyBase.hp / enemyBase.maxHp;
    const playerProgress = (1 - enemyHpRatio) * 0.5; // half the bar belongs to each side conceptually
    // Enemy progress (red) — fills based on player base HP destroyed
    const playerHpRatio = playerBase.hp / playerBase.maxHp;
    const enemyProgress = (1 - playerHpRatio) * 0.5;

    // We mostly visualise wave progress: blue from left up to current wave end,
    // red from current wave to total. Like a tug-of-war progress bar.
    const waveFrac = Math.min(1, ((currentWave - 1) + waveTimer / WAVE_DURATION_MS) / TOTAL_WAVES);
    const blueW = (barW - 20) * waveFrac;

    // Blue (player progress)
    if (blueW > 0) {
        const bg = ctx.createLinearGradient(0, barY, 0, barY + barH);
        bg.addColorStop(0, '#42a5f5');
        bg.addColorStop(1, '#1565c0');
        ctx.fillStyle = bg;
        roundRect(barX + 10, barY, blueW, barH, 10);
        ctx.fill();
    }
    // Red (remaining waves)
    const redW = (barW - 20) - blueW;
    if (redW > 0) {
        const rg = ctx.createLinearGradient(0, barY, 0, barY + barH);
        rg.addColorStop(0, '#ef5350');
        rg.addColorStop(1, '#c62828');
        ctx.fillStyle = rg;
        roundRect(barX + 10 + blueW, barY, redW, barH, 10);
        ctx.fill();
    }

    // Soldier icons distributed along the red section to show upcoming waves
    const upcomingCount = TOTAL_WAVES - currentWave;
    const startSoldiers = barX + 10 + blueW + 18;
    const endSoldiers = barX + barW - 12;
    if (upcomingCount > 0) {
        const span = Math.max(20, endSoldiers - startSoldiers);
        for (let i = 0; i < upcomingCount; i++) {
            const sx = startSoldiers + (i + 0.5) * (span / upcomingCount);
            iconSoldier(sx, barY + barH / 2, 18, '#5d4037');
        }
    }

    // Wave indicator triangle below the current wave boundary
    const triX = barX + 10 + blueW;
    ctx.fillStyle = '#69f0ae';
    ctx.strokeStyle = '#1b5e20';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(triX, barY + barH + 2);
    ctx.lineTo(triX - 6, barY + barH + 12);
    ctx.lineTo(triX + 6, barY + barH + 12);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // Bar border
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.lineWidth = 2;
    roundRect(barX + 10, barY, barW - 20, barH, 10);
    ctx.stroke();

    // "WAVE 3 / 5" text below the bar
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px "Lilita One", sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowBlur = 4;
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.fillText(`WAVE ${currentWave} / ${TOTAL_WAVES}`, barX + barW / 2, barY + barH + 22);
    ctx.shadowBlur = 0;
}

// ----- Bottom-left DEPLOY panel -----

function drawDeployPanel() {
    const panelX = 12;
    const panelW = 360;
    const panelH = 110;
    const panelY = H - panelH - 12;
    hudPanel(panelX, panelY, panelW, panelH);

    // Header
    ctx.fillStyle = '#90caf9';
    ctx.font = 'bold 14px "Lilita One", sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.shadowBlur = 4; ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.fillText('DEPLOY', panelX + 16, panelY + 10);
    ctx.shadowBlur = 0;

    // 3 unit cards
    const cards = [
        { key: '1', cost: 10, type: 'infantry', sprite: 'infantry_blue_1', action: () => { if (money >= 10) spawnPlayerUnit('infantry'); } },
        { key: '2', cost: 40, type: 'tank',     sprite: 'tank_blue',       action: () => { if (money >= 40) spawnPlayerUnit('tank'); } },
        { key: '3', cost: 25, type: 'bazooka',  sprite: 'bazooka_blue_1',  action: () => { if (money >= 25) spawnPlayerUnit('bazooka'); } },
    ];
    const cardW = 96, cardH = 76;
    const cardY = panelY + 28;
    const startX = panelX + 16;

    for (let i = 0; i < cards.length; i++) {
        const card = cards[i];
        const cx = startX + i * (cardW + 8);
        const canAfford = money >= card.cost;

        // Card frame
        bevelButton(cx, cardY, cardW, cardH, {
            radius: 12,
            top: canAfford ? 'rgba(35, 50, 85, 0.95)' : 'rgba(40, 40, 50, 0.85)',
            bottom: canAfford ? 'rgba(15, 25, 55, 0.95)' : 'rgba(20, 20, 30, 0.85)',
        });

        // Number badge top-left
        ctx.fillStyle = '#ffc107';
        ctx.strokeStyle = '#0a1628';
        ctx.lineWidth = 2;
        const badgeR = 11;
        ctx.beginPath();
        ctx.arc(cx + 12, cardY + 12, badgeR, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#0a1628';
        ctx.font = 'bold 14px "Lilita One", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(card.key, cx + 12, cardY + 13);

        // Unit portrait (cropped sprite)
        const img = SPRITES[card.sprite];
        if (img && img.complete && img.naturalWidth > 0) {
            const aspect = img.naturalWidth / img.naturalHeight;
            const ph = 48;
            const pw = ph * aspect;
            ctx.save();
            if (!canAfford) ctx.filter = 'grayscale(100%) brightness(0.7)';
            ctx.drawImage(img, cx + cardW / 2 - pw / 2, cardY + 16, pw, ph);
            ctx.restore();
        }

        // Cost label at bottom
        ctx.fillStyle = canAfford ? '#69f0ae' : '#888';
        ctx.font = 'bold 18px "Lilita One", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowBlur = 4; ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.fillText(`$${card.cost}`, cx + cardW / 2, cardY + cardH - 14);
        ctx.shadowBlur = 0;

        hudHitRects.push({ x: cx, y: cardY, w: cardW, h: cardH, action: card.action });
    }
}

// ----- Bottom-right INCOME + POWERUPS panel -----

function drawIncomePowerupPanel() {
    const panelW = 460;
    const panelH = 110;
    const panelX = W - panelW - 12;
    const panelY = H - panelH - 12;
    hudPanel(panelX, panelY, panelW, panelH);

    // Top row — money + income
    ctx.fillStyle = '#69f0ae';
    ctx.font = 'bold 22px "Lilita One", sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.shadowBlur = 4; ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.fillText(`$${Math.floor(money)}`, panelX + 18, panelY + 22);

    ctx.fillStyle = '#90caf9';
    ctx.font = 'bold 11px "Lilita One", sans-serif';
    ctx.fillText('INCOME', panelX + 220, panelY + 22);
    ctx.fillStyle = '#69f0ae';
    ctx.font = 'bold 18px "Lilita One", sans-serif';
    const incomePerSec = Math.round(INCOME_RATE * 60);
    ctx.fillText(`+$${incomePerSec} /s`, panelX + 286, panelY + 22);
    ctx.shadowBlur = 0;

    // 3 powerup buttons
    const btnW = 130, btnH = 56;
    const btnY = panelY + 42;
    const startX = panelX + 16;
    const powerups = [
        { id: 'airstrike', icon: iconMissile, cost: POWERUPS.airstrike.cost, action: activateAirstrike },
        { id: 'shield',    icon: iconShield,  cost: POWERUPS.shield.cost,    action: activateShield },
        { id: 'repair',    icon: iconWrench,  cost: POWERUPS.repair.cost,    action: activateRepair },
    ];
    for (let i = 0; i < powerups.length; i++) {
        const p = powerups[i];
        const bx = startX + i * (btnW + 8);
        const canAfford = money >= p.cost;
        bevelButton(bx, btnY, btnW, btnH, {
            radius: 12,
            top: canAfford ? 'rgba(35, 50, 85, 0.95)' : 'rgba(40, 40, 50, 0.85)',
            bottom: canAfford ? 'rgba(15, 25, 55, 0.95)' : 'rgba(20, 20, 30, 0.85)',
        });
        // Icon
        if (p.id === 'shield') {
            iconShield(bx + btnW / 2, btnY + btnH / 2 - 4, 14, '#42a5f5');
        } else {
            p.icon(bx + btnW / 2, btnY + btnH / 2 - 4, 18);
        }
        // Cost
        ctx.fillStyle = canAfford ? '#69f0ae' : '#888';
        ctx.font = 'bold 16px "Lilita One", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowBlur = 4; ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.fillText(`$${p.cost}`, bx + btnW / 2, btnY + btnH - 12);
        ctx.shadowBlur = 0;

        hudHitRects.push({ x: bx, y: btnY, w: btnW, h: btnH, action: p.action });
    }

    // Active shield indicator
    if (powerupShieldMs > 0) {
        ctx.fillStyle = '#42a5f5';
        ctx.font = 'bold 11px "Lilita One", sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(`SHIELD ${(powerupShieldMs / 1000).toFixed(1)}s`,
                     panelX + panelW - 16, panelY + 22);
    }
}

// ---- MAIN RENDER ----
function render() {
    ctx.clearRect(0, 0, W, H);

    // Apply screen shake
    ctx.save();
    ctx.translate(screenShakeX, screenShakeY);

    drawSky();
    drawBackgroundMountains();
    drawBirds();
    drawClouds();
    drawBackgroundTrees();

    // Background palm trees (behind ground)
    for (const tree of palmTrees) {
        drawPalmTree(tree);
    }

    drawGround();
    drawFlowers();
    drawScenery();
    drawOcean();

    // Bases
    drawBase(playerBase, 'player');
    drawBase(enemyBase, 'enemy');

    // Units
    for (const u of units) {
        drawUnit(u);
    }

    // Bullets
    drawBullets();

    // Helicopter
    drawHelicopter();

    // Particles (on top)
    drawParticles();
    drawAmbientParticles();

    ctx.restore(); // End screen shake

    // HUD (not affected by shake)
    drawHUD();
}

// ---- GAME LOOP ----
function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

// Start the loop (rendering menu background)
loadSprites();
initGame();
gameState = 'menu';
gameLoop();

</script>
