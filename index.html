    // Try sprite rendering first
    const spriteKey = team === 'player' ? 'base_blue' : 'base_red';
    const img = SPRITES[spriteKey];
    if (img && img.complete && img.naturalWidth > 0) {
        const baseHeight = 150;
        // Plant the base into the sand — bottom of sprite sits ~16px below the
        // grass line (around y=576) so the sandbags settle into the sand.
        const baseAnchorY = GROUND_Y + 16;
        const drawY = baseAnchorY - baseHeight / 2;
        drawSprite(spriteKey, sx, drawY, baseHeight, false);

        // Health bar above sprite
        const hbWidth = 70;
        const hbX = sx - hbWidth / 2;
        const hbY = baseAnchorY - baseHeight - 12;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(hbX - 2, hbY - 2, hbWidth + 4, 10);
        const hpRatio = base.hp / base.maxHp;
        ctx.fillStyle = hpRatio > 0.5 ? C.healthGreen : hpRatio > 0.25 ? '#ff9800' : C.healthRed;
        ctx.fillRect(hbX, hbY, hbWidth * hpRatio, 6);
        return;
    }

    // ---- Fallback: procedural drawing ----
    ctx.save();
    if (team === 'player') {
        // === PLAYER BASE — Boom Beach HQ: Tropical military building ===

        // Sandbag wall
        ctx.fillStyle = '#c8b08a';
        for (let i = 0; i < 8; i++) {
            const sbx = sx - 55 + i * 14;
            const sby = by - 10;
            ctx.beginPath();
            ctx.ellipse(sbx, sby, 7, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#a0896a';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
        ctx.fillStyle = '#c8b08a';
        for (let i = 0; i < 7; i++) {
            const sbx = sx - 48 + i * 14;
            const sby = by - 18;
            ctx.beginPath();
            ctx.ellipse(sbx, sby, 7, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#a0896a';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        // Main building body (wooden/metal)
        const buildGrad = ctx.createLinearGradient(sx - 40, by - 70, sx + 40, by);
        buildGrad.addColorStop(0, '#8d6e63');
        buildGrad.addColorStop(0.3, '#795548');
        buildGrad.addColorStop(0.7, '#6d4c41');
        buildGrad.addColorStop(1, '#5d4037');
        ctx.fillStyle = buildGrad;
        ctx.fillRect(sx - 40, by - 60, 80, 42);

        // Building outline
        ctx.strokeStyle = '#4e342e';
        ctx.lineWidth = 2;
        ctx.strokeRect(sx - 40, by - 60, 80, 42);

        // Wood plank lines
        ctx.strokeStyle = 'rgba(78,52,46,0.3)';
        ctx.lineWidth = 1;
        for (let py = by - 55; py < by - 20; py += 8) {
            ctx.beginPath();
            ctx.moveTo(sx - 38, py);
            ctx.lineTo(sx + 38, py);
            ctx.stroke();
        }

        // Metal reinforcement strips
        ctx.fillStyle = '#78909c';
        ctx.fillRect(sx - 42, by - 62, 84, 4);
        ctx.fillRect(sx - 42, by - 20, 84, 4);
        // Metal sheen
        ctx.fillStyle = 'rgba(176,190,197,0.3)';
        ctx.fillRect(sx - 42, by - 62, 84, 2);
        ctx.fillRect(sx - 42, by - 20, 84, 2);

        // Roof - tropical metal roof
        ctx.fillStyle = '#546e7a';
        ctx.beginPath();
        ctx.moveTo(sx - 52, by - 60);
        ctx.lineTo(sx, by - 90);
        ctx.lineTo(sx + 52, by - 60);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#37474f';
        ctx.lineWidth = 2;
        ctx.stroke();
        // Roof highlight
        ctx.fillStyle = 'rgba(176,190,197,0.2)';
        ctx.beginPath();
        ctx.moveTo(sx - 48, by - 62);
        ctx.lineTo(sx - 5, by - 86);
        ctx.lineTo(sx, by - 85);
        ctx.lineTo(sx - 40, by - 62);
        ctx.closePath();
        ctx.fill();

        // Door
        const doorGrad = ctx.createLinearGradient(sx - 8, by - 36, sx + 8, by - 36);
        doorGrad.addColorStop(0, '#4e342e');
        doorGrad.addColorStop(0.5, '#3e2723');
        doorGrad.addColorStop(1, '#4e342e');
        ctx.fillStyle = doorGrad;
        roundRect(sx - 8, by - 36, 16, 18, 2);
        ctx.fill();
        // Door handle
        ctx.fillStyle = '#d4a017';
        ctx.beginPath();
        ctx.arc(sx + 4, by - 27, 1.5, 0, Math.PI * 2);
        ctx.fill();

        // Windows with glow
        for (const wx of [-25, 20]) {
            ctx.fillStyle = '#bbdefb';
            ctx.shadowBlur = 6;
            ctx.shadowColor = '#bbdefb';
            roundRect(sx + wx - 6, by - 52, 12, 10, 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            // Window cross
            ctx.strokeStyle = '#795548';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(sx + wx, by - 52);
            ctx.lineTo(sx + wx, by - 42);
            ctx.moveTo(sx + wx - 6, by - 47);
            ctx.lineTo(sx + wx + 6, by - 47);
            ctx.stroke();
        }

        // Antenna
        ctx.strokeStyle = '#78909c';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sx + 25, by - 60);
        ctx.lineTo(sx + 30, by - 100);
        ctx.stroke();
        // Antenna tip blink
        ctx.fillStyle = frameCount % 40 < 20 ? '#f44336' : '#b71c1c';
        ctx.beginPath();
        ctx.arc(sx + 30, by - 100, 2, 0, Math.PI * 2);
        ctx.fill();
        // Antenna cross pieces
        ctx.strokeStyle = '#90a4ae';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(sx + 26, by - 80);
        ctx.lineTo(sx + 34, by - 85);
        ctx.moveTo(sx + 26, by - 90);
        ctx.lineTo(sx + 34, by - 93);
        ctx.stroke();

        // Blue flag
        ctx.strokeStyle = '#546e7a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sx - 5, by - 90);
        ctx.lineTo(sx - 5, by - 115);
        ctx.stroke();
        // Flag cloth with wave
        const flagWave = Math.sin(frameCount * 0.08) * 3;
        ctx.fillStyle = '#1e88e5';
        ctx.beginPath();
        ctx.moveTo(sx - 5, by - 115);
        ctx.quadraticCurveTo(sx + 8, by - 112 + flagWave, sx + 18, by - 110 + flagWave * 0.5);
        ctx.quadraticCurveTo(sx + 8, by - 106 + flagWave * 0.3, sx - 5, by - 103);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#1565c0';
        ctx.lineWidth = 1;
        ctx.stroke();
        // Star on flag
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        const starX = sx + 6;
        const starY = by - 109 + flagWave * 0.5;
        for (let i = 0; i < 5; i++) {
            const a = (i * 4 * Math.PI / 5) - Math.PI / 2;
            const r = i === 0 ? 0 : 3;
            if (i === 0) ctx.moveTo(starX + 3 * Math.cos(a), starY + 3 * Math.sin(a));
            else {
                const innerA = a - 2 * Math.PI / 5;
                ctx.lineTo(starX + 1.5 * Math.cos(innerA), starY + 1.5 * Math.sin(innerA));
                ctx.lineTo(starX + 3 * Math.cos(a), starY + 3 * Math.sin(a));
            }
        }
        ctx.closePath();
        ctx.fill();

    } else {
        // === ENEMY BASE — Dark fortress with red accents ===

        // Base platform
        ctx.fillStyle = '#37474f';
        ctx.fillRect(sx - 55, by - 5, 110, 8);

        // Main fortress body
        const fortGrad = ctx.createLinearGradient(sx - 50, by - 70, sx + 50, by);
        fortGrad.addColorStop(0, '#424242');
        fortGrad.addColorStop(0.5, '#37474f');
        fortGrad.addColorStop(1, '#263238');
        ctx.fillStyle = fortGrad;
        ctx.fillRect(sx - 45, by - 65, 90, 60);
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 2;
        ctx.strokeRect(sx - 45, by - 65, 90, 60);

        // Dark stone texture
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.lineWidth = 1;
        for (let py = by - 60; py < by - 10; py += 10) {
            ctx.beginPath();
            ctx.moveTo(sx - 43, py);
            ctx.lineTo(sx + 43, py);
            ctx.stroke();
            for (let px = sx - 40; px < sx + 40; px += 18) {
                const offset = (py % 20 === 0) ? 9 : 0;
                ctx.beginPath();
                ctx.moveTo(px + offset, py);
                ctx.lineTo(px + offset, py + 10);
                ctx.stroke();
            }
        }

        // Red accent stripe
        ctx.fillStyle = '#c62828';
        ctx.fillRect(sx - 47, by - 67, 94, 5);
        ctx.fillStyle = '#ef5350';
        ctx.fillRect(sx - 47, by - 67, 94, 2);

        // Guard towers on sides
        for (const side of [-1, 1]) {
            const towerX = sx + side * 50;
            ctx.fillStyle = '#37474f';
            ctx.fillRect(towerX - 10, by - 80, 20, 75);
            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(towerX - 10, by - 80, 20, 75);
            // Tower top
            ctx.fillStyle = '#c62828';
            ctx.beginPath();
            ctx.moveTo(towerX - 12, by - 80);
            ctx.lineTo(towerX, by - 92);
            ctx.lineTo(towerX + 12, by - 80);
            ctx.closePath();
            ctx.fill();
            // Tower window (slit)
            ctx.fillStyle = '#ff8a65';
            ctx.shadowBlur = 4;
            ctx.shadowColor = '#ff5722';
            ctx.fillRect(towerX - 2, by - 55, 4, 10);
            ctx.shadowBlur = 0;
        }

        // Battlements
        ctx.fillStyle = '#37474f';
        for (let i = 0; i < 7; i++) {
            ctx.fillRect(sx - 45 + i * 14, by - 75, 10, 12);
        }

        // Skull emblem with glow
        ctx.shadowBlur = 8;
        ctx.shadowColor = 'rgba(244,67,54,0.5)';
        ctx.fillStyle = '#e0e0e0';
        ctx.beginPath();
        ctx.arc(sx, by - 42, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        // Skull details
        ctx.fillStyle = '#212121';
        ctx.beginPath();
        ctx.arc(sx - 4, by - 44, 3, 0, Math.PI * 2);
        ctx.arc(sx + 4, by - 44, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#e0e0e0';
        ctx.beginPath();
        ctx.arc(sx, by - 38, 5, 0, Math.PI, false);
        ctx.fill();
        ctx.fillStyle = '#212121';
        for (let t = -3; t <= 3; t += 2) {
            ctx.fillRect(sx + t, by - 38, 1, 5);
        }

        // Barbed wire effect
        ctx.strokeStyle = '#616161';
        ctx.lineWidth = 1;
        const barbY = by - 70;
        ctx.beginPath();
        for (let bx = sx - 55; bx < sx + 55; bx += 4) {
            const barbWave = Math.sin(bx * 0.3) * 2;
            ctx.lineTo(bx, barbY + barbWave);
        }
        ctx.stroke();
        // Barb points
        ctx.fillStyle = '#616161';
        for (let bx = sx - 55; bx < sx + 55; bx += 12) {
            const barbWave = Math.sin(bx * 0.3) * 2;
            ctx.beginPath();
            ctx.moveTo(bx, barbY + barbWave - 3);
            ctx.lineTo(bx + 2, barbY + barbWave);
            ctx.lineTo(bx, barbY + barbWave + 3);
            ctx.lineTo(bx - 2, barbY + barbWave);
            ctx.closePath();
            ctx.fill();
        }

        // Cannons
        ctx.fillStyle = '#212121';
        for (const side of [-1, 1]) {
            const canX = sx + side * 35;
            ctx.fillRect(canX - 3, by - 25, 6 + side * 12, 6);
            // Cannon highlight
            ctx.fillStyle = '#424242';
            ctx.fillRect(canX - 2, by - 25, 4 + side * 10, 2);
            ctx.fillStyle = '#212121';
        }

        // Red flag
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sx, by - 75);
        ctx.lineTo(sx, by - 100);
        ctx.stroke();
        const flagWave = Math.sin(frameCount * 0.08) * 3;
        ctx.fillStyle = '#c62828';
        ctx.beginPath();
        ctx.moveTo(sx, by - 100);
        ctx.quadraticCurveTo(sx + 8, by - 97 + flagWave, sx + 16, by - 95 + flagWave * 0.5);
        ctx.quadraticCurveTo(sx + 8, by - 91 + flagWave * 0.3, sx, by - 88);
        ctx.closePath();
        ctx.fill();
    }
    ctx.restore();

    // Health bar with Boom Beach style
    const hbWidth = 70;
    const hbX = sx - hbWidth / 2;
    const hbY = by - (team === 'player' ? 125 : 108);
    // Background
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    roundRect(hbX - 2, hbY - 2, hbWidth + 4, 10, 3);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1;
    roundRect(hbX - 2, hbY - 2, hbWidth + 4, 10, 3);
    ctx.stroke();
    // Bar
    const hpRatio = Math.max(0, base.hp / base.maxHp);
    const hpColor = hpRatio > 0.5 ? C.healthGreen : hpRatio > 0.25 ? '#ff9800' : C.healthRed;
    if (hpRatio > 0) {
        const barGrad = ctx.createLinearGradient(hbX, hbY, hbX, hbY + 6);
        barGrad.addColorStop(0, hpColor);
        barGrad.addColorStop(1, shadeColor(hpColor, -30));
        ctx.fillStyle = barGrad;
        roundRect(hbX, hbY, hbWidth * hpRatio, 6, 2);
        ctx.fill();
        // Shine
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(hbX + 1, hbY, hbWidth * hpRatio - 2, 2);
    }
}

function shadeColor(color, percent) {
    const num = parseInt(color.replace('#', ''), 16);
    const r = Math.min(255, Math.max(0, (num >> 16) + percent));
    const g = Math.min(255, Math.max(0, ((num >> 8) & 0xff) + percent));
    const b = Math.min(255, Math.max(0, (num & 0xff) + percent));
    return `rgb(${r},${g},${b})`;
}

function drawCrate(c) {
    // Convenience locals for the dimensions
    const HW = CRATE_HALF_W;       // half-width (22)
    const HT = CRATE_TOP;          // distance up from c.y (28)
    const HB = CRATE_BOT;          // distance down from c.y (6)
    const H  = HT + HB;            // total body height (34)
    const W_ = HW * 2;             // total body width (44)

    if (c.state === 'respawning') {
        // Invisible while waiting to redrop. Show a small ghost marker so
        // the player can see WHERE it'll respawn.
        const sx = c.x - cameraX;
        if (sx < -40 || sx > W + 40) return;
        const pulse = 0.4 + 0.3 * Math.sin(frameCount * 0.12);
        ctx.save();
        ctx.globalAlpha = pulse;
        ctx.strokeStyle = c.type === 'medi' ? '#ef5350' : '#42a5f5';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 3]);
        ctx.strokeRect(sx - HW, CRATE_LANDED_Y - HT, W_, H);
        ctx.setLineDash([]);
        // Countdown
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px "Lilita One", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`${(c.respawnTimer / 1000).toFixed(0)}s`, sx, CRATE_LANDED_Y + 6);
        ctx.restore();
        return;
    }

    const sx = c.x - cameraX;
    if (sx < -80 || sx > W + 80) return;
    const sy = c.y;

    // Parachute (only while descending)
    if (c.state === 'parachuting') {
        ctx.save();
        // Strings — anchored to the top corners of the now-larger crate
        ctx.strokeStyle = '#3e2723';
        ctx.lineWidth = 1.4;
        for (let dx of [-18, -6, 6, 18]) {
            ctx.beginPath();
            ctx.moveTo(sx + dx, sy - HT);
            ctx.lineTo(sx + dx * 1.6, sy - HT - 28);
            ctx.stroke();
        }
        // Canopy — scaled up to suit the new crate
        ctx.fillStyle = c.type === 'medi' ? '#ef5350' : '#42a5f5';
        ctx.strokeStyle = '#0a1628';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(sx, sy - HT - 28, 32, Math.PI, 0);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        // White stripe centre on the canopy
        ctx.fillStyle = '#fff';
        ctx.fillRect(sx - 4, sy - HT - 28 - 32, 8, 32);
        ctx.restore();
    }

    // Crate body — wooden chest with metal bands
    ctx.save();
    ctx.fillStyle = '#6d4c41';
    ctx.strokeStyle = '#3e2723';
    ctx.lineWidth = 2.4;
    ctx.fillRect(sx - HW, sy - HT, W_, H);
    ctx.strokeRect(sx - HW, sy - HT, W_, H);
    // Plank seam — sits just under the symbol plate, splits lid from base
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(sx - HW, sy - 2); ctx.lineTo(sx + HW, sy - 2); ctx.stroke();
    // Metal corner brackets (6x6, inset 1px)
    ctx.strokeStyle = '#9e9e9e';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx - HW + 1,     sy - HT + 1, 6, 6);
    ctx.strokeRect(sx + HW - 7,     sy - HT + 1, 6, 6);
    ctx.strokeRect(sx - HW + 1,     sy + HB - 7, 6, 6);
    ctx.strokeRect(sx + HW - 7,     sy + HB - 7, 6, 6);

    // Symbol on the lid — white plate ~60% of body, then red cross or shield
    const plateW = 24, plateH = 20;
    const plateX = sx - plateW / 2;
    const plateY = sy - HT + 4;
    if (c.type === 'medi') {
        ctx.fillStyle = '#fff';
        ctx.fillRect(plateX, plateY, plateW, plateH);
        ctx.fillStyle = '#e53935';
        // Cross — vertical bar 6 wide, horizontal bar 6 tall, centred
        ctx.fillRect(sx - 3, plateY + 2, 6, plateH - 4);
        ctx.fillRect(plateX + 2, plateY + 7, plateW - 4, 6);
    } else if (c.type === 'shield') {
        ctx.fillStyle = '#fff';
        ctx.fillRect(plateX, plateY, plateW, plateH);
        ctx.fillStyle = '#1976d2';
        ctx.beginPath();
        ctx.moveTo(sx, plateY + 2);
        ctx.lineTo(sx + 9, plateY + 6);
        ctx.quadraticCurveTo(sx + 9, plateY + plateH - 3, sx, plateY + plateH - 1);
        ctx.quadraticCurveTo(sx - 9, plateY + plateH - 3, sx - 9, plateY + 6);
        ctx.closePath();
        ctx.fill();
    }

    // HP pips above the crate when damaged
    if (c.state === 'landed' && c.hp < BALANCE.crates.hp) {
        for (let i = 0; i < BALANCE.crates.hp; i++) {
            ctx.fillStyle = i < c.hp ? '#69f0ae' : 'rgba(255,255,255,0.2)';
            ctx.beginPath();
            ctx.arc(sx - 10 + i * 10, sy - HT - 8, 3, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    ctx.restore();
}

function drawAirDefence(aa) {
    const sx = aa.x - cameraX;
    if (sx < -60 || sx > W + 60) return;
    const by = GROUND_Y - 4;

    ctx.save();
    // Aim the launcher tube toward the heli
    const tx = heli.x - aa.x;
    const ty = heli.y - (by - 28);
    const aimAngle = Math.atan2(ty, tx);

    // Sandbag base
    ctx.fillStyle = '#a1887f';
    ctx.strokeStyle = '#3e2723';
    ctx.lineWidth = 2;
    for (let bx = -22; bx <= 22; bx += 12) {
        ctx.beginPath();
        ctx.ellipse(sx + bx, by - 4, 8, 5, 0, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
    }
    for (let bx = -16; bx <= 16; bx += 12) {
        ctx.beginPath();
        ctx.ellipse(sx + bx, by - 13, 8, 5, 0, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
    }

    // Mount pedestal
    ctx.fillStyle = '#37474f';
    ctx.strokeStyle = '#0a1628';
    ctx.lineWidth = 2;
    ctx.fillRect(sx - 8, by - 24, 16, 12);
    ctx.strokeRect(sx - 8, by - 24, 16, 12);
    // Red panel detail
    ctx.fillStyle = '#c62828';
    ctx.fillRect(sx - 6, by - 22, 12, 3);

    // Rotating launcher
    ctx.save();
    ctx.translate(sx, by - 24);
    ctx.rotate(Math.max(-Math.PI * 0.55, Math.min(0, aimAngle)));
    // Launcher body
    ctx.fillStyle = '#455a64';
    ctx.strokeStyle = '#0a1628';
    ctx.lineWidth = 2;
    ctx.fillRect(0, -7, 24, 14);
    ctx.strokeRect(0, -7, 24, 14);
    // Two missile tubes
    ctx.fillStyle = '#fafafa';
    ctx.fillRect(2, -5, 20, 4);
    ctx.fillRect(2, 1, 20, 4);
    // Red tips
    ctx.fillStyle = '#e53935';
    ctx.fillRect(20, -5, 4, 4);
    ctx.fillRect(20, 1, 4, 4);
    // Exhaust holes
    ctx.fillStyle = '#000';
    ctx.fillRect(0, -4, 2, 2);
    ctx.fillRect(0, 2, 2, 2);
    ctx.restore();

    // HP bar above
    if (aa.hp < aa.maxHp) {
        const hbW = 40;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(sx - hbW / 2 - 1, by - 50, hbW + 2, 5);
        const ratio = aa.hp / aa.maxHp;
        ctx.fillStyle = ratio > 0.5 ? '#69f0ae' : ratio > 0.25 ? '#ff9800' : '#ef5350';
        ctx.fillRect(sx - hbW / 2, by - 49, hbW * ratio, 3);
    }

    // Range warning indicator (subtle red glow if heli is in range)
    const distH = Math.sqrt((heli.x - aa.x) ** 2 + (heli.y - aa.y) ** 2);
    if (distH < BALANCE.aa.range) {
        ctx.fillStyle = 'rgba(244, 67, 54, 0.35)';
        ctx.beginPath();
        ctx.arc(sx, by - 22, 4 + Math.sin(frameCount * 0.2) * 2, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}

function drawHelicopter() {
    const sx = heli.x - cameraX;
    const sy = heli.y + Math.sin(heli.bobTimer) * 2;
    const f = heli.facing;

    // Try sprite-based rendering first
    if (SPRITES.heli && SPRITES.heli.complete && SPRITES.heli.naturalWidth > 0) {
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.beginPath();
        const shadowDist = GROUND_Y - heli.y;
        const shadowScale = 1 + shadowDist * 0.002;
        ctx.ellipse(sx, GROUND_Y - 3, 50 * shadowScale, 9 * shadowScale, 0, 0, Math.PI * 2);
        ctx.fill();

        // Pitch tilt: nose dips toward direction of travel (in WORLD space, not local)
        // Convention: vx > 0 means "going right" → nose should dip right-and-down
        // In canvas coords (Y down), rotating by +angle is clockwise = nose-down-right.
        // So world pitch = +heli.vx * 0.04.
        const targetPitch = heli.vx * 0.04;
        heli.pitch = (heli.pitch || 0) + (targetPitch - (heli.pitch || 0)) * 0.15;

        // Order: translate → rotate (in world space) → flip → draw.
        // Rotating BEFORE flipping means the rotation is applied to the un-flipped sprite,
        // and then the whole thing is mirrored. Visually, mirroring a clockwise tilt produces
        // a counter-clockwise tilt — exactly what we want, because a left-facing heli's
        // nose-dive appears as counter-clockwise rotation on screen.
        const flip = f === -1;
        const img = SPRITES.heli;
        const aspect = img.naturalWidth / img.naturalHeight;
        const drawHeight = 90;
        const drawWidth = drawHeight * aspect;
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(heli.pitch);
        if (flip) ctx.scale(-1, 1);
        ctx.drawImage(img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
        ctx.restore();

        // Health bar
        if (heli.hp < heli.maxHp) {
            const hbWidth = 50;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(sx - hbWidth / 2 - 1, sy - 50, hbWidth + 2, 6);
            const hpRatio = heli.hp / heli.maxHp;
            ctx.fillStyle = hpRatio > 0.5 ? C.healthGreen : C.healthRed;
            ctx.fillRect(sx - hbWidth / 2, sy - 49, hbWidth * hpRatio, 4);
        }

        // Carrying indicator
        if (heli.carrying.length > 0) {
            ctx.fillStyle = C.gold;
            ctx.font = '600 14px "Fredoka", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`×${heli.carrying.length}`, sx, sy + 55);
        }
        return;
    }

    // ---- Fallback: procedural drawing ----
    ctx.save();
    ctx.translate(sx, sy);

    // Shadow on ground — bigger and softer
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath();
    const shadowDist = GROUND_Y - heli.y;
    const shadowScale = 1 + shadowDist * 0.002;
    ctx.ellipse(0, GROUND_Y - heli.y - 3, 28 * shadowScale, 7 * shadowScale, 0, 0, Math.PI * 2);
    ctx.fill();

    // Tail boom with taper
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-f * 20, -5);
    ctx.lineTo(-f * 52, -3);
    ctx.lineTo(-f * 52, 1);
    ctx.lineTo(-f * 20, 4);
    ctx.closePath();
    const tailGrad = ctx.createLinearGradient(0, -5, 0, 4);
    tailGrad.addColorStop(0, '#1565c0');
    tailGrad.addColorStop(1, '#0d47a1');
    ctx.fillStyle = tailGrad;
    ctx.fill();
    ctx.strokeStyle = '#0a3470';
    ctx.lineWidth = 1;
    ctx.stroke();
    // Tail stripe
    ctx.fillStyle = '#42a5f5';
    ctx.fillRect(-f * 35, -2, f * -12, 2);
    ctx.restore();

    // Tail rotor housing
    ctx.fillStyle = '#455a64';
    ctx.beginPath();
    ctx.arc(-f * 50, -2, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#37474f';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Tail rotor blades (spinning)
    ctx.save();
    ctx.translate(-f * 50, -2);
    ctx.rotate(heli.bladeAngle * 2);
    ctx.fillStyle = 'rgba(120,144,156,0.7)';
    ctx.fillRect(-2, -12, 4, 24);
    ctx.restore();

    // Landing skids with proper thickness
    ctx.strokeStyle = '#37474f';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    // Left skid
    ctx.beginPath();
    ctx.moveTo(-12, 12);
    ctx.lineTo(-12, 18);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-22, 19);
    ctx.lineTo(2, 19);
    ctx.stroke();
    // Right skid
    ctx.beginPath();
    ctx.moveTo(12, 12);
    ctx.lineTo(12, 18);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-2, 19);
    ctx.lineTo(22, 19);
    ctx.stroke();
    // Skid strut highlights
    ctx.strokeStyle = '#546e7a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-22, 18);
    ctx.lineTo(2, 18);
    ctx.moveTo(-2, 18);
    ctx.lineTo(22, 18);
    ctx.stroke();

    // Engine/exhaust housing on top-back
    ctx.fillStyle = '#455a64';
    roundRect(-f * 12, -16, 14, 8, 2);
    ctx.fill();
    ctx.strokeStyle = '#37474f';
    ctx.lineWidth = 1;
    roundRect(-f * 12, -16, 14, 8, 2);
    ctx.stroke();
    // Exhaust vent lines
    ctx.strokeStyle = '#263238';
    ctx.lineWidth = 0.5;
    for (let ev = 0; ev < 3; ev++) {
        ctx.beginPath();
        ctx.moveTo(-f * 10 + ev * 4, -15);
        ctx.lineTo(-f * 10 + ev * 4, -10);
        ctx.stroke();
    }

    // Main body — chunky cartoon heli with 3D shading
    const bodyGrad = ctx.createRadialGradient(f * 2, -4, 5, 0, 4, 30);
    bodyGrad.addColorStop(0, '#42a5f5'); // highlight
    bodyGrad.addColorStop(0.5, '#1e88e5');
    bodyGrad.addColorStop(1, '#0d47a1'); // shadow
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.ellipse(0, 2, 28, 15, 0, 0, Math.PI * 2);
    ctx.fill();
    // Body outline
    ctx.strokeStyle = '#0a3470';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(0, 2, 28, 15, 0, 0, Math.PI * 2);
    ctx.stroke();

    // Highlight on top of body
    ctx.fillStyle = 'rgba(100,181,246,0.4)';
    ctx.beginPath();
    ctx.ellipse(f * 3, -5, 18, 6, f * 0.1, 0, Math.PI * 2);
    ctx.fill();

    // Shadow on bottom of body
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.ellipse(0, 10, 20, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Cockpit glass with radial gradient for glossy bubble
    const cockpitGrad = ctx.createRadialGradient(f * 14, -6, 2, f * 11, -1, 14);
    cockpitGrad.addColorStop(0, 'rgba(255,255,255,0.9)');
    cockpitGrad.addColorStop(0.3, 'rgba(187,222,251,0.8)');
    cockpitGrad.addColorStop(0.7, 'rgba(100,181,246,0.5)');
    cockpitGrad.addColorStop(1, 'rgba(66,165,245,0.3)');
    ctx.fillStyle = cockpitGrad;
    ctx.beginPath();
    ctx.ellipse(f * 11, -1, 13, 10, f * 0.15, 0, Math.PI * 2);
    ctx.fill();
    // Cockpit outline
    ctx.strokeStyle = 'rgba(13,71,161,0.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(f * 11, -1, 13, 10, f * 0.15, 0, Math.PI * 2);
    ctx.stroke();
    // Glass reflection highlight
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.ellipse(f * 14, -5, 5, 3.5, f * 0.3, 0, Math.PI * 2);
    ctx.fill();

    // Accent stripe
    ctx.fillStyle = '#ffb300';
    ctx.fillRect(-18, 0, 36, 3);
    ctx.fillStyle = 'rgba(255,202,40,0.3)';
    ctx.fillRect(-18, 0, 36, 1);

    // Minigun underneath
    ctx.fillStyle = '#263238';
    const gunX = f * 20;
    ctx.fillRect(gunX, 9, f * 14, 3);
    ctx.fillRect(gunX + f * 2, 7, f * 4, 2);
    // Gun barrel detail
    ctx.fillStyle = '#37474f';
    ctx.fillRect(gunX + f * 12, 8, f * 4, 5);
    // Muzzle flash when shooting
    if (heli.shootCooldown > 5) {
        ctx.fillStyle = '#ffeb3b';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff9800';
        ctx.beginPath();
        ctx.arc(gunX + f * 16, 11, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(gunX + f * 16, 11, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    // Rotor mast
    ctx.fillStyle = '#455a64';
    ctx.fillRect(-3, -14, 6, -8);
    ctx.fillStyle = '#546e7a';
    ctx.fillRect(-2, -14, 4, -6);

    // Main rotor — motion blur disc when spinning
    ctx.save();
    ctx.translate(0, -22);
    // Semi-transparent rotor disc
    const rotorGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, 42);
    rotorGrad.addColorStop(0, 'rgba(120,144,156,0.25)');
    rotorGrad.addColorStop(0.5, 'rgba(120,144,156,0.15)');
    rotorGrad.addColorStop(0.8, 'rgba(120,144,156,0.08)');
    rotorGrad.addColorStop(1, 'rgba(120,144,156,0)');
    ctx.fillStyle = rotorGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, 42, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    // Blade tips
    ctx.save();
    ctx.rotate(heli.bladeAngle);
    ctx.strokeStyle = 'rgba(69,90,100,0.7)';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-40, 0);
    ctx.lineTo(40, 0);
    ctx.stroke();
    ctx.rotate(Math.PI / 2);
    ctx.beginPath();
    ctx.moveTo(-40, 0);
    ctx.lineTo(40, 0);
    ctx.stroke();
    ctx.restore();
    // Rotor hub
    ctx.fillStyle = '#455a64';
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Carried soldiers indicator
    if (heli.carrying.length > 0) {
        ctx.fillStyle = C.gold;
        ctx.shadowBlur = 4;
        ctx.shadowColor = 'rgba(255,193,7,0.5)';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`\u00d7${heli.carrying.length}`, 0, 32);
        ctx.shadowBlur = 0;
    }

    ctx.restore();

    // Heli health bar — Boom Beach style
    if (heli.hp < heli.maxHp) {
        const hbWidth = 44;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        roundRect(sx - hbWidth / 2 - 2, sy - 32, hbWidth + 4, 8, 3);
        ctx.fill();
        const hpRatio = heli.hp / heli.maxHp;
        const barColor = hpRatio > 0.5 ? C.healthGreen : C.healthRed;
        const barGrad = ctx.createLinearGradient(0, sy - 30, 0, sy - 24);
        barGrad.addColorStop(0, barColor);
        barGrad.addColorStop(1, shadeColor(barColor, -30));
        ctx.fillStyle = barGrad;
        if (hpRatio > 0) {
            roundRect(sx - hbWidth / 2, sy - 30, hbWidth * hpRatio, 4, 2);
            ctx.fill();
        }
    }
}

function drawUnit(u) {
    const sx = u.x - cameraX;
    if (sx < -30 || sx > W + 30) return;
    const sy = u.y;
    const isPlayer = u.team === 'player';
    const dir = isPlayer ? 1 : -1;

    // Try sprite rendering first
    let spriteKey = null;
    let spriteHeight = 0;
    if (u.type === 'infantry' || u.type === 'bazooka') {
        // Per-unit phase offset (deterministic, derived from spawn x) so units
        // don't all step in lockstep
        const phaseOffset = (u.x * 13) % WALK_CYCLE_MS;
        const cycleMs = performance.now() + phaseOffset;
        const marching = u.state === 'march';
        const frame = marching ? walkFrameAt(cycleMs) : 1;
        // Smooth interpolated Y bob — continuous, not stepped per frame
        u._walkY = marching ? walkYAt(cycleMs) : 0;
        const prefix = u.type === 'infantry'
            ? (isPlayer ? 'infantry_blue' : 'infantry_red')
            : (isPlayer ? 'bazooka_blue' : 'bazooka_red');
        spriteKey = `${prefix}_${frame}`;
        spriteHeight = 50;
    } else if (u.type === 'tank') {
        spriteKey = isPlayer ? 'tank_blue' : 'tank_red';
        spriteHeight = 55 * (u.bossScale || 1);
    }

    const img = spriteKey ? SPRITES[spriteKey] : null;
    if (img && img.complete && img.naturalWidth > 0) {
        // Sprite source faces right; flip enemy units (they march left)
        const flip = !isPlayer;
        // Adjust y so the sprite's feet sit on the ground
        let drawY = sy - spriteHeight / 2 + u.h / 2;

        // Soldier walk bob — smoothly interpolated through 8 keyframes.
        // Lowest at midstance (F3/F7), highest at push-off (F4/F8).
        if ((u.type === 'infantry' || u.type === 'bazooka') && u.state === 'march') {
            drawY += u._walkY || 0;
        }
        // Tanks get a tiny rumble while moving.
        if (u.type === 'tank' && u.state === 'march') {
            const phase = (frameCount * 0.35) + u.x * 0.1;
            drawY += Math.sin(phase * 4) * 0.6;
        }

        // Draw sprite
        const aspect = img.naturalWidth / img.naturalHeight;
        const drawWidth = spriteHeight * aspect;
        ctx.save();
        ctx.translate(sx, drawY);
        if (flip) ctx.scale(-1, 1);
        ctx.drawImage(img, -drawWidth / 2, -spriteHeight / 2, drawWidth, spriteHeight);
        ctx.restore();

        // Health bar
        if (u.hp < u.maxHp) {
            const hbWidth = u.type === 'tank' ? 40 : 28;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(sx - hbWidth / 2 - 1, drawY - spriteHeight / 2 - 8, hbWidth + 2, 5);
            const hpRatio = u.hp / u.maxHp;
            ctx.fillStyle = hpRatio > 0.5 ? C.healthGreen : C.healthRed;
            ctx.fillRect(sx - hbWidth / 2, drawY - spriteHeight / 2 - 7, hbWidth * hpRatio, 3);
        }
        return;
    }

    // ---- Fallback: procedural drawing ----
    ctx.save();
    ctx.translate(sx, sy);

    if (u.type === 'infantry' || u.type === 'bazooka') {
        const walkPhase = Math.sin((u.walkFrame || 0) + u.x * 0.1) * (u.state === 'march' ? 4 : 0);

        // === BOOM BEACH CHUNKY SOLDIER ===
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(0, u.h / 2, 9, 3, 0, 0, Math.PI * 2);
        ctx.fill();

        // Boots
        const bootColor = isPlayer ? '#1b3a1b' : '#3e1a1a';
        ctx.fillStyle = bootColor;
        ctx.beginPath();
        ctx.ellipse(-3 - walkPhase * 0.8, u.h / 2, 4, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(3 + walkPhase * 0.8, u.h / 2, 4, 3, 0, 0, Math.PI * 2);
        ctx.fill();

        // Legs
        const pantsColor = isPlayer ? '#2e7d32' : '#8e2424';
        ctx.strokeStyle = pantsColor;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-3, 4);
        ctx.lineTo(-3 - walkPhase * 0.8, u.h / 2 - 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(3, 4);
        ctx.lineTo(3 + walkPhase * 0.8, u.h / 2 - 2);
        ctx.stroke();

        // Body/vest — chunky torso
        const vestColor1 = isPlayer ?
            (u.type === 'infantry' ? '#2e7d32' : '#00695c') :
            (u.type === 'infantry' ? '#c62828' : '#d84315');
        const vestColor2 = isPlayer ?
            (u.type === 'infantry' ? '#1b5e20' : '#004d40') :
            (u.type === 'infantry' ? '#8e0000' : '#bf360c');
        const vestGrad = ctx.createLinearGradient(-7, -7, 7, 8);
        vestGrad.addColorStop(0, vestColor1);
        vestGrad.addColorStop(1, vestColor2);
        ctx.fillStyle = vestGrad;
        roundRect(-7, -7, 14, 14, 2);
        ctx.fill();
        // Vest outline
        ctx.strokeStyle = vestColor2;
        ctx.lineWidth = 1;
        roundRect(-7, -7, 14, 14, 2);
        ctx.stroke();
        // Vest pocket/detail
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(-5, -2, 4, 4);
        ctx.fillRect(1, -2, 4, 4);

        // Arms
        ctx.strokeStyle = vestColor1;
        ctx.lineWidth = 3.5;
        ctx.lineCap = 'round';
        // Back arm
        ctx.beginPath();
        ctx.moveTo(-dir * 5, -3);
        ctx.lineTo(-dir * 8, 3);
        ctx.stroke();
        // Front arm (holding weapon)
        ctx.beginPath();
        ctx.moveTo(dir * 5, -3);
        ctx.lineTo(dir * 9, -1);
        ctx.stroke();

        // Skin-colored hands
        ctx.fillStyle = '#ffcc80';
        ctx.beginPath();
        ctx.arc(dir * 9, -1, 2, 0, Math.PI * 2);
        ctx.fill();

        // Head — big chunky Boom Beach head
        const headGrad = ctx.createRadialGradient(0, -12, 1, 0, -10, 7);
        headGrad.addColorStop(0, '#ffe0b2');
        headGrad.addColorStop(1, '#ffcc80');
        ctx.fillStyle = headGrad;
        ctx.beginPath();
        ctx.arc(0, -11, 6.5, 0, Math.PI * 2);
        ctx.fill();
        // Head outline
        ctx.strokeStyle = '#e6a86e';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(0, -11, 6.5, 0, Math.PI * 2);
        ctx.stroke();

        // Simple face
        // Eyes
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(dir * 2, -12, 1.2, 0, Math.PI * 2);
        ctx.arc(dir * -2, -12, 1, 0, Math.PI * 2);
        ctx.fill();
        // Mouth (small line)
        ctx.strokeStyle = '#bf8a60';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(-2, -8.5);
        ctx.lineTo(2, -8.5);
        ctx.stroke();

        // Helmet
        const helmetColor1 = isPlayer ? '#2e7d32' : '#5d4037';
        const helmetColor2 = isPlayer ? '#1b5e20' : '#3e2723';
        const helmetGrad = ctx.createLinearGradient(-7, -18, 7, -12);
        helmetGrad.addColorStop(0, helmetColor1);
        helmetGrad.addColorStop(1, helmetColor2);
        ctx.fillStyle = helmetGrad;
        ctx.beginPath();
        ctx.arc(0, -13, 7.5, Math.PI, 0);
        ctx.fill();
        // Helmet brim
        ctx.fillStyle = helmetColor2;
        ctx.fillRect(-8, -13, 16, 2);
        // Helmet shine
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath();
        ctx.arc(-2, -16, 3, 0, Math.PI * 2);
        ctx.fill();

        // Weapon with proper detail
        if (u.type === 'bazooka') {
            // Bazooka tube
            ctx.fillStyle = '#546e7a';
            ctx.save();
            ctx.translate(dir * 9, -2);
            ctx.rotate(dir > 0 ? -0.1 : Math.PI + 0.1);
            roundRect(0, -3, 22, 6, 2);
            ctx.fill();
            ctx.strokeStyle = '#37474f';
            ctx.lineWidth = 1;
            roundRect(0, -3, 22, 6, 2);
            ctx.stroke();
            // Bazooka opening
            ctx.fillStyle = '#263238';
            ctx.beginPath();
            ctx.arc(22, 0, 3, 0, Math.PI * 2);
            ctx.fill();
            // Sight
            ctx.fillStyle = '#78909c';
            ctx.fillRect(8, -5, 3, 3);
            ctx.restore();
        } else {
            // Rifle
            ctx.fillStyle = '#5d4037';
            ctx.save();
            ctx.translate(dir * 9, -1);
            ctx.rotate(dir > 0 ? -0.15 : Math.PI + 0.15);
            ctx.fillRect(0, -1.5, 14, 3);
            // Barrel
            ctx.fillStyle = '#37474f';
            ctx.fillRect(10, -1, 8, 2);
            // Stock
            ctx.fillStyle = '#4e342e';
            ctx.fillRect(-4, -2, 5, 4);
            ctx.restore();
        }

        // Muzzle flash when fighting
        if (u.state === 'fight' && u.attackCooldown > u.attackRate - 5) {
            ctx.fillStyle = '#ffeb3b';
            ctx.shadowBlur = 6;
            ctx.shadowColor = '#ff9800';
            ctx.beginPath();
            ctx.arc(dir * 24, -3, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

    } else if (u.type === 'tank') {
        // === BOOM BEACH CHUNKY CARTOON TANK ===
        const bodyColor1 = isPlayer ? '#546e7a' : '#5d4037';
        const bodyColor2 = isPlayer ? '#37474f' : '#4e342e';
        const accentColor = isPlayer ? '#4fc3f7' : '#ef5350';

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        ctx.ellipse(0, u.h / 2 + 3, 24, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Treads with individual track links
        ctx.fillStyle = '#212121';
        roundRect(-20, 2, 40, 12, 4);
        ctx.fill();
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 1;
        roundRect(-20, 2, 40, 12, 4);
        ctx.stroke();
        // Track links
        ctx.fillStyle = '#333';
        for (let t = -17; t < 18; t += 5) {
            const linkOff = ((frameCount * (u.state === 'march' ? 2 : 0) + t * 10) % 5);
            ctx.fillRect(t + linkOff * 0.2, 4, 3, 8);
        }
        // Track wheels
        ctx.fillStyle = '#424242';
        for (let w = -14; w <= 14; w += 7) {
            ctx.beginPath();
            ctx.arc(w, 8, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#555';
            ctx.beginPath();
            ctx.arc(w, 8, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#424242';
        }

        // Hull with angled armor
        const hullGrad = ctx.createLinearGradient(0, -8, 0, 4);
        hullGrad.addColorStop(0, bodyColor1);
        hullGrad.addColorStop(1, bodyColor2);
        ctx.fillStyle = hullGrad;
        ctx.beginPath();
        ctx.moveTo(-18, 3);
        ctx.lineTo(-15, -7);
        ctx.lineTo(-8, -9);
        ctx.lineTo(12, -9);
        ctx.lineTo(16, -7);
        ctx.lineTo(18, 3);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = shadeColor(bodyColor2, -20);
        ctx.lineWidth = 1.5;
        ctx.stroke();
        // Hull highlight
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.beginPath();
        ctx.moveTo(-14, -7);
        ctx.lineTo(-8, -9);
        ctx.lineTo(12, -9);
        ctx.lineTo(14, -7);
        ctx.closePath();
        ctx.fill();
        // Armor plate lines
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(-10, -9);
        ctx.lineTo(-12, 3);
        ctx.moveTo(5, -9);
        ctx.lineTo(7, 3);
        ctx.stroke();

        // Turret — rounded with gradient
        const turretGrad = ctx.createRadialGradient(0, -10, 2, 0, -8, 10);
        turretGrad.addColorStop(0, isPlayer ? '#78909c' : '#795548');
        turretGrad.addColorStop(1, isPlayer ? '#455a64' : '#4e342e');
        ctx.fillStyle = turretGrad;
        ctx.beginPath();
        ctx.arc(0, -9, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = shadeColor(bodyColor2, -20);
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, -9, 9, 0, Math.PI * 2);
        ctx.stroke();
        // Turret highlight
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.beginPath();
        ctx.arc(-2, -12, 5, 0, Math.PI * 2);
        ctx.fill();

        // Barrel with proper shape
        ctx.fillStyle = '#333';
        const barrelLen = 24;
        ctx.beginPath();
        ctx.moveTo(dir * 7, -11);
        ctx.lineTo(dir * (7 + barrelLen), -11);
        ctx.lineTo(dir * (7 + barrelLen), -7);
        ctx.lineTo(dir * 7, -7);
        ctx.closePath();
        ctx.fill();
        // Barrel muzzle brake
        ctx.fillStyle = '#444';
        ctx.fillRect(dir * (7 + barrelLen - 4), -12, dir * 6, 6);
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 1;
        ctx.strokeRect(dir * (7 + barrelLen - 4), -12, dir * 6, 6);
        // Barrel highlight
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.fillRect(dir * 7, -11, dir * barrelLen, 1.5);

        // Team emblem on turret
        ctx.fillStyle = accentColor;
        ctx.shadowBlur = 3;
        ctx.shadowColor = accentColor;
        ctx.beginPath();
        ctx.arc(0, -9, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        // Inner emblem detail
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ctx.arc(0, -9, 2, 0, Math.PI * 2);
        ctx.fill();

        // Exhaust puff when moving
        if (u.state === 'march' && frameCount % 8 < 4) {
            ctx.fillStyle = 'rgba(100,100,100,0.3)';
            const exDir = isPlayer ? -1 : 1;
            ctx.beginPath();
            ctx.arc(exDir * 20, -2, 3 + Math.random() * 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // Muzzle flash for tank
        if (u.state === 'fight' && u.attackCooldown > u.attackRate - 5) {
            const muzzleX = dir * (7 + barrelLen + 2);
            ctx.fillStyle = '#ffeb3b';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ff9800';
            ctx.beginPath();
            ctx.arc(muzzleX, -9, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(muzzleX, -9, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    // Health bar — Boom Beach style with rounded corners and outline
    if (u.hp < u.maxHp) {
        const hbWidth = u.type === 'tank' ? 34 : 22;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        roundRect(-hbWidth / 2 - 1, -u.h / 2 - 12, hbWidth + 2, 6, 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 0.5;
        roundRect(-hbWidth / 2 - 1, -u.h / 2 - 12, hbWidth + 2, 6, 2);
        ctx.stroke();
        const hpRatio = u.hp / u.maxHp;
        const barColor = hpRatio > 0.5 ? C.healthGreen : C.healthRed;
        const barGrad = ctx.createLinearGradient(0, -u.h / 2 - 11, 0, -u.h / 2 - 7);
        barGrad.addColorStop(0, barColor);
        barGrad.addColorStop(1, shadeColor(barColor, -25));
        ctx.fillStyle = barGrad;
        if (hpRatio > 0) {
            roundRect(-hbWidth / 2, -u.h / 2 - 11, hbWidth * hpRatio, 4, 1.5);
            ctx.fill();
        }
    }

    ctx.restore();
}

function drawBullets() {
    for (const b of bullets) {
        const sx = b.x - cameraX;
        if (sx < -10 || sx > W + 10) continue;

        if (b.type === 'heli') {
            // Bright tracer round — streak oriented along velocity vector so
            // it reads clearly against sky and ground. Hot-red core, orange
            // halo, white-hot tip.
            const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy) || 1;
            const dx = b.vx / speed;
            const dy = b.vy / speed;
            const len = 14;        // streak length
            const tailX = sx - dx * len;
            const tailY = b.y - dy * len;

            ctx.save();
            // Outer glow
            ctx.shadowBlur = 14;
            ctx.shadowColor = '#ff5722';
            ctx.strokeStyle = '#ff7043';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(tailX, tailY);
            ctx.lineTo(sx, b.y);
            ctx.stroke();
            // Bright core
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#ffeb3b';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(tailX, tailY);
            ctx.lineTo(sx, b.y);
            ctx.stroke();
            // White-hot leading tip
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(sx, b.y, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        } else if (b.type === 'shell') {
            // Tank shell with trail
            ctx.fillStyle = 'rgba(80,80,80,0.3)';
            ctx.beginPath();
            ctx.arc(sx - b.vx * 3, b.y - b.vy * 3, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(80,80,80,0.15)';
            ctx.beginPath();
            ctx.arc(sx - b.vx * 6, b.y - b.vy * 6, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#444';
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(sx, b.y, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        } else if (b.type === 'rocket') {
            // Rocket with smoke trail
            ctx.fillStyle = '#ef5350';
            ctx.shadowBlur = 6;
            ctx.shadowColor = '#ff5722';
            ctx.beginPath();
            ctx.arc(sx, b.y, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            // Rocket tip
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(sx + b.vx * 0.3, b.y + b.vy * 0.3, 1.5, 0, Math.PI * 2);
            ctx.fill();
            // Smoke trail is spawned in update() so render stays side-effect-free
        } else if (b.type === 'heliMissile') {
            // Player's bought missile — fat red rocket streaking forward
            const ang = Math.atan2(b.vy, b.vx);
            ctx.save();
            ctx.translate(sx, b.y);
            ctx.rotate(ang);
            ctx.fillStyle = '#fafafa';
            ctx.strokeStyle = '#0a1628';
            ctx.lineWidth = 1.5;
            ctx.fillRect(-12, -3, 18, 6);
            ctx.strokeRect(-12, -3, 18, 6);
            // Red nose
            ctx.fillStyle = '#e53935';
            ctx.beginPath();
            ctx.moveTo(6, -3);
            ctx.lineTo(14, 0);
            ctx.lineTo(6, 3);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            // Fins
            ctx.fillStyle = '#e53935';
            ctx.beginPath();
            ctx.moveTo(-12, -3); ctx.lineTo(-16, -7); ctx.lineTo(-9, -3);
            ctx.closePath(); ctx.fill();
            ctx.beginPath();
            ctx.moveTo(-12, 3); ctx.lineTo(-16, 7); ctx.lineTo(-9, 3);
            ctx.closePath(); ctx.fill();
            // Flame at the back
            ctx.fillStyle = '#ffeb3b';
            ctx.beginPath();
            ctx.moveTo(-12, -2);
            ctx.lineTo(-18 - Math.random() * 4, 0);
            ctx.lineTo(-12, 2);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        } else if (b.type === 'aamissile') {
            // Long thin missile streaking toward the heli
            const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy) || 1;
            const ang = Math.atan2(b.vy, b.vx);
            ctx.save();
            ctx.translate(sx, b.y);
            ctx.rotate(ang);
            // Body
            ctx.fillStyle = '#fafafa';
            ctx.strokeStyle = '#212121';
            ctx.lineWidth = 1.5;
            ctx.fillRect(-9, -2, 14, 4);
            ctx.strokeRect(-9, -2, 14, 4);
            // Red nose
            ctx.fillStyle = '#e53935';
            ctx.beginPath();
            ctx.moveTo(5, -2);
            ctx.lineTo(11, 0);
            ctx.lineTo(5, 2);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            // Fins
            ctx.fillStyle = '#e53935';
            ctx.beginPath();
            ctx.moveTo(-9, -2);
            ctx.lineTo(-13, -5);
            ctx.lineTo(-7, -2);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(-9, 2);
            ctx.lineTo(-13, 5);
            ctx.lineTo(-7, 2);
            ctx.closePath();
            ctx.fill();
            // Flame at the back
            ctx.fillStyle = '#ffeb3b';
            ctx.beginPath();
            ctx.moveTo(-9, -1);
            ctx.lineTo(-14 - Math.random() * 4, 0);
            ctx.lineTo(-9, 1);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }
    }
}

function drawParticles() {
    for (const p of particles) {
        const sx = p.x - cameraX;
        if (sx < -20 || sx > W + 20) continue;
        const alpha = p.life / p.maxLife;

        if (p.isShockwave) {
            ctx.globalAlpha = alpha * 0.5;
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(sx, p.y, p.radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 1;
            continue;
        }

        if (p.isCasing) {
            ctx.globalAlpha = alpha;
            ctx.fillStyle = '#d4a017';
            ctx.fillRect(sx - 1, p.y - 1.5, 2, 3);
            ctx.globalAlpha = 1;
            continue;
        }

        if (p.isDust) {
            ctx.globalAlpha = alpha * 0.4;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(sx, p.y, p.size * (1.5 - alpha * 0.5), 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
            continue;
        }

        if (p.isDebris) {
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color;
            ctx.save();
            ctx.translate(sx, p.y);
            ctx.rotate(p.life * 0.3);
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
            ctx.restore();
            ctx.globalAlpha = 1;
            continue;
        }

        // Generic particle — no shadowBlur (huge perf hit at high counts).
        // Compensate the lost glow with a faint second pass at larger radius.
        ctx.globalAlpha = alpha * 0.35;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(sx, p.y, p.size * alpha * 1.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(sx, p.y, p.size * alpha, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawFloatingTexts() {
    if (!floatingTexts.length) return;
    ctx.save();
    ctx.font = 'bold 16px "Lilita One", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const t of floatingTexts) {
        const sx = t.x - cameraX;
        if (sx < -40 || sx > W + 40) continue;
        const alpha = Math.min(1, t.life / (t.maxLife * 0.6));
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#000';
        ctx.fillText(t.text, sx + 1, t.y + 1);
        ctx.fillStyle = t.color;
        ctx.fillText(t.text, sx, t.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
}

function drawAmbientParticles() {
    for (const l of ambientParticles) {
        const sx = l.x - cameraX;
        if (sx < -10 || sx > W + 10) continue;
        ctx.save();
        ctx.translate(sx, l.y);
        ctx.rotate(l.rot);
        ctx.fillStyle = l.color;
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.ellipse(0, 0, l.size, l.size * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.restore();
    }
}

// ===========================================================================
// MOCKUP-BASED HUD
// Top:    [stats panel] [wave bar] [enemy panel] [pause]
// Bottom: [DEPLOY card panel]                              [income + powerups]
// ===========================================================================

// ---- Reusable HUD helpers ----

function hudPanel(x, y, w, h, opts = {}) {
    // Dark navy panel with rounded corners and subtle border, like the mockup
    const r = opts.radius || 14;
    ctx.save();
    // Drop shadow
    ctx.shadowBlur = 12;
    ctx.shadowColor = 'rgba(0, 10, 30, 0.5)';
    ctx.shadowOffsetY = 3;
    // Background
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, opts.top || 'rgba(20, 30, 55, 0.92)');
    grad.addColorStop(1, opts.bottom || 'rgba(10, 20, 40, 0.92)');
    ctx.fillStyle = grad;
    roundRect(x, y, w, h, r);
    ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    // Inner highlight
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
    ctx.lineWidth = 1;
    roundRect(x + 1, y + 1, w - 2, h - 2, r - 1);
    ctx.stroke();
    // Outer border
    ctx.strokeStyle = opts.border || 'rgba(0, 0, 0, 0.6)';
    ctx.lineWidth = 2;
    roundRect(x, y, w, h, r);
    ctx.stroke();
    ctx.restore();
}

function iconCoin(cx, cy, r) {
    ctx.save();
    ctx.fillStyle = '#ffc107';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ff8f00'; ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#fff8e1';
    ctx.beginPath(); ctx.arc(cx - r * 0.3, cy - r * 0.3, r * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff8f00';
    ctx.font = `bold ${r * 1.3}px "Lilita One", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('$', cx, cy + 1);
    ctx.restore();
}

function iconShield(cx, cy, r, color) {
    ctx.save();
    ctx.fillStyle = color || '#42a5f5';
    ctx.strokeStyle = '#0d47a1';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy - r);
    ctx.lineTo(cx + r * 0.85, cy - r * 0.5);
    ctx.quadraticCurveTo(cx + r * 0.85, cy + r * 0.6, cx, cy + r);
    ctx.quadraticCurveTo(cx - r * 0.85, cy + r * 0.6, cx - r * 0.85, cy - r * 0.5);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // Inner highlight
    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.beginPath();
    ctx.moveTo(cx, cy - r * 0.7);
    ctx.lineTo(cx + r * 0.4, cy - r * 0.3);
    ctx.lineTo(cx, cy + r * 0.2);
    ctx.lineTo(cx - r * 0.4, cy - r * 0.3);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

function iconCross(cx, cy, r) {
    // Green plus/medical cross
    ctx.save();
    const w = r * 0.45;
    ctx.fillStyle = '#43a047';
    ctx.strokeStyle = '#1b5e20';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.rect(cx - r, cy - w, r * 2, w * 2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.rect(cx - w, cy - r, w * 2, r * 2);
    ctx.fill(); ctx.stroke();
    // Re-fill with no stroke to clean up overlap
    ctx.strokeStyle = 'transparent';
    ctx.fillStyle = '#43a047';
    ctx.fillRect(cx - r + 1, cy - w + 1, r * 2 - 2, w * 2 - 2);
    ctx.fillRect(cx - w + 1, cy - r + 1, w * 2 - 2, r * 2 - 2);
    // Outline overall plus
    ctx.strokeStyle = '#1b5e20';
    ctx.beginPath();
    ctx.moveTo(cx - r, cy - w); ctx.lineTo(cx - w, cy - w); ctx.lineTo(cx - w, cy - r);
    ctx.lineTo(cx + w, cy - r); ctx.lineTo(cx + w, cy - w); ctx.lineTo(cx + r, cy - w);
    ctx.lineTo(cx + r, cy + w); ctx.lineTo(cx + w, cy + w); ctx.lineTo(cx + w, cy + r);
    ctx.lineTo(cx - w, cy + r); ctx.lineTo(cx - w, cy + w); ctx.lineTo(cx - r, cy + w);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
}

function iconCastle(cx, cy, r) {
    ctx.save();
    ctx.fillStyle = '#c62828';
    ctx.strokeStyle = '#4e0000';
    ctx.lineWidth = 2;
    // Crenellated top
    ctx.beginPath();
    ctx.moveTo(cx - r, cy + r);
    ctx.lineTo(cx - r, cy - r * 0.4);
    ctx.lineTo(cx - r * 0.6, cy - r * 0.4);
    ctx.lineTo(cx - r * 0.6, cy - r);
    ctx.lineTo(cx - r * 0.2, cy - r);
    ctx.lineTo(cx - r * 0.2, cy - r * 0.4);
    ctx.lineTo(cx + r * 0.2, cy - r * 0.4);
    ctx.lineTo(cx + r * 0.2, cy - r);
    ctx.lineTo(cx + r * 0.6, cy - r);
    ctx.lineTo(cx + r * 0.6, cy - r * 0.4);
    ctx.lineTo(cx + r, cy - r * 0.4);
    ctx.lineTo(cx + r, cy + r);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // Door
    ctx.fillStyle = '#4e0000';
    ctx.fillRect(cx - r * 0.25, cy + r * 0.1, r * 0.5, r * 0.9);
    ctx.restore();
}

function iconStar(cx, cy, r, color, outline) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.strokeStyle = outline;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
        const angle = (i * Math.PI) / 5 - Math.PI / 2;
        const rad = i % 2 === 0 ? r : r * 0.45;
        const x = cx + Math.cos(angle) * rad;
        const y = cy + Math.sin(angle) * rad;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
}

function iconPause(cx, cy, r) {
    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx - r * 0.5, cy - r, r * 0.35, r * 2);
    ctx.fillRect(cx + r * 0.15, cy - r, r * 0.35, r * 2);
    ctx.restore();
}

function iconMissile(cx, cy, r) {
    // 2 small red rockets
    ctx.save();
    for (let i = 0; i < 2; i++) {
        const ox = i === 0 ? -r * 0.45 : r * 0.45;
        const tilt = i === 0 ? -0.35 : 0.35;
        ctx.save();
        ctx.translate(cx + ox, cy);
        ctx.rotate(tilt);
        // Body
        ctx.fillStyle = '#fafafa';
        ctx.strokeStyle = '#212121';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.9);
        ctx.lineTo(r * 0.25, -r * 0.6);
        ctx.lineTo(r * 0.25, r * 0.6);
        ctx.lineTo(-r * 0.25, r * 0.6);
        ctx.lineTo(-r * 0.25, -r * 0.6);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        // Red nose
        ctx.fillStyle = '#e53935';
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.9);
        ctx.lineTo(r * 0.25, -r * 0.6);
        ctx.lineTo(-r * 0.25, -r * 0.6);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        // Fins
        ctx.fillStyle = '#e53935';
        ctx.beginPath();
        ctx.moveTo(-r * 0.25, r * 0.4);
        ctx.lineTo(-r * 0.5, r * 0.8);
        ctx.lineTo(-r * 0.25, r * 0.8);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(r * 0.25, r * 0.4);
        ctx.lineTo(r * 0.5, r * 0.8);
        ctx.lineTo(r * 0.25, r * 0.8);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.restore();
    }
    ctx.restore();
}

function iconBullet(cx, cy, r) {
    // Vertical brass cartridge silhouette
    ctx.save();
    ctx.translate(cx, cy);
    // Casing (brass)
    ctx.fillStyle = '#ffc107';
    ctx.strokeStyle = '#bf8f00';
    ctx.lineWidth = 1.2;
    ctx.fillRect(-r * 0.5, -r * 0.3, r, r * 1.3);
    ctx.strokeRect(-r * 0.5, -r * 0.3, r, r * 1.3);
    // Rim
    ctx.fillStyle = '#bf8f00';
    ctx.fillRect(-r * 0.55, r, r * 1.1, r * 0.25);
    // Tip (copper-jacketed bullet)
    ctx.fillStyle = '#b87333';
    ctx.strokeStyle = '#5d4037';
    ctx.beginPath();
    ctx.moveTo(-r * 0.5, -r * 0.3);
    ctx.lineTo(-r * 0.4, -r * 0.9);
    ctx.lineTo(0,        -r * 1.05);
    ctx.lineTo(r * 0.4,  -r * 0.9);
    ctx.lineTo(r * 0.5,  -r * 0.3);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
}

function iconWrench(cx, cy, r) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-Math.PI / 4);
    ctx.fillStyle = '#90a4ae';
    ctx.strokeStyle = '#37474f';
    ctx.lineWidth = 1.5;
    // Handle
    ctx.beginPath();
    ctx.rect(-r * 0.18, -r * 0.4, r * 0.36, r * 1.2);
    ctx.fill(); ctx.stroke();
    // Head
    ctx.beginPath();
    ctx.arc(0, -r * 0.55, r * 0.45, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#0a1628';
    ctx.beginPath();
    ctx.arc(0, -r * 0.55, r * 0.18, 0, Math.PI * 2);
    ctx.fill();
    // Notch (open end)
    ctx.fillStyle = '#0a1628';
    ctx.beginPath();
    ctx.moveTo(-r * 0.25, -r);
    ctx.lineTo(0, -r * 0.65);
    ctx.lineTo(r * 0.25, -r);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

// Tiny soldier silhouette icon for the wave bar
function iconSoldier(cx, cy, h, color) {
    ctx.save();
    ctx.fillStyle = color;
    // Helmet
    ctx.beginPath();
    ctx.arc(cx, cy - h * 0.3, h * 0.18, Math.PI, 0);
    ctx.fill();
    // Body
    ctx.fillRect(cx - h * 0.12, cy - h * 0.15, h * 0.24, h * 0.4);
    // Legs
    ctx.fillRect(cx - h * 0.13, cy + h * 0.22, h * 0.08, h * 0.18);
    ctx.fillRect(cx + h * 0.05, cy + h * 0.22, h * 0.08, h * 0.18);
    ctx.restore();
}

// Round button background with bevel
function bevelButton(x, y, w, h, opts = {}) {
    const r = opts.radius || 10;
    ctx.save();
    // Drop shadow
    ctx.shadowBlur = 6;
    ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
    ctx.shadowOffsetY = 2;
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, opts.top || 'rgba(40, 55, 85, 0.95)');
    grad.addColorStop(1, opts.bottom || 'rgba(15, 25, 50, 0.95)');
    ctx.fillStyle = grad;
    roundRect(x, y, w, h, r);
    ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    // Inner highlight
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.lineWidth = 1;
    roundRect(x + 1, y + 1, w - 2, h - 2, r - 1);
    ctx.stroke();
    ctx.strokeStyle = opts.border || 'rgba(0, 0, 0, 0.6)';
    ctx.lineWidth = 2;
    roundRect(x, y, w, h, r);
    ctx.stroke();
    ctx.restore();
}

// ---- Main HUD ----

function drawHUD() {
    hudHitRects = [];
    pauseHitRect = null;

    drawTopHUD();
    // On touch devices the deploy orbit + a compact gold readout replace
    // the bottom panels, freeing the lower screen edge from clutter.
    if (IS_TOUCH) {
        drawCompactGoldReadout();
    } else {
        drawDeployPanel();
        drawIncomePowerupPanel();
    }
    if (levelState === 'complete') drawShopOverlay();

    // Pause overlay if game is paused
    if (gameState === 'paused') {
        ctx.save();
        ctx.fillStyle = 'rgba(10, 22, 40, 0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ffd54f';
        ctx.font = 'bold 80px "Lilita One", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowBlur = 16;
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.fillText('PAUSED', W / 2, H / 2 - 20);
        ctx.font = '600 22px "Fredoka", sans-serif';
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 4;
        ctx.fillText('Press P / Esc / click pause to resume', W / 2, H / 2 + 50);
        ctx.restore();
    }
}

// ----- Top HUD -----

function drawTopHUD() {
    // === LEFT — compact heli status (HP + ammo only) ===
    const leftX = 12, leftY = 12;
    const leftW = 290, leftH = 60;
    hudPanel(leftX, leftY, leftW, leftH);

    // Heli HP cell
    iconCross(leftX + 22, leftY + leftH / 2, 11);
    ctx.fillStyle = '#a5d6a7';
    ctx.font = 'bold 11px "Lilita One", sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.shadowBlur = 4; ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.fillText('HELI HP', leftX + 44, leftY + 22);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px "Lilita One", sans-serif';
    ctx.fillText(`${Math.max(0, Math.ceil(heli.hp))} / ${heli.maxHp}`,
                 leftX + 44, leftY + 41);

    // Vertical separator
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(leftX + 150, leftY + 8);
    ctx.lineTo(leftX + 150, leftY + leftH - 8);
    ctx.stroke();

    // === Ammo cell — magazine reload (7.5s after empty) ===
    const ammoLow = heli.ammo / heli.maxAmmo < 0.25;
    const isReloading = heli.reloadMs > 0;

    const ammoIconX = leftX + 172;
    const ammoIconY = leftY + leftH / 2;
    const ammoArcR = 19;

    // Soft circular backing
    ctx.save();
    ctx.fillStyle = 'rgba(255, 193, 7, 0.10)';
    ctx.beginPath();
    ctx.arc(ammoIconX, ammoIconY, ammoArcR, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    if (isReloading) ctx.globalAlpha = 0.45;
    iconBullet(ammoIconX, ammoIconY, 12);
    ctx.restore();

    // Ring: solid gold when ammo > 0; black sweep cooldown while reloading
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 193, 7, 0.55)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(ammoIconX, ammoIconY, ammoArcR, 0, Math.PI * 2);
    ctx.stroke();
    if (isReloading) {
        const fraction = heli.reloadMs / BALANCE.heli.reloadMs;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.beginPath();
        ctx.moveTo(ammoIconX, ammoIconY);
        ctx.arc(ammoIconX, ammoIconY, ammoArcR,
                -Math.PI / 2,
                -Math.PI / 2 + fraction * Math.PI * 2);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#ff9800';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(ammoIconX, ammoIconY, ammoArcR, 0, Math.PI * 2);
        ctx.stroke();
    }
    ctx.restore();

    // Label + count
    ctx.fillStyle = isReloading ? '#ff9800' : '#ffd54f';
    ctx.font = 'bold 11px "Lilita One", sans-serif';
    ctx.fillText(isReloading ? 'RELOADING' : 'AMMO', leftX + 195, leftY + 22);
    ctx.font = 'bold 18px "Lilita One", sans-serif';
    ctx.fillStyle = isReloading ? '#ef5350' : (ammoLow ? '#ff9800' : '#fff');
    ctx.fillText(`${heli.ammo} / ${heli.maxAmmo}`, leftX + 195, leftY + 41);
    // Countdown to the right when reloading
    if (isReloading) {
        ctx.fillStyle = '#ff9800';
        ctx.font = 'bold 14px "Lilita One", sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(`${(heli.reloadMs / 1000).toFixed(1)}s`, leftX + 282, leftY + 41);
        ctx.textAlign = 'left';
    }
    ctx.shadowBlur = 0;

    // === CENTER — battlefield minimap (much wider now) ===
    drawWaveBar();

    // === Pause button (top right) ===
    const pauseSize = 48;
    const pauseX = W - pauseSize - 14;
    const pauseY = 18;
    bevelButton(pauseX, pauseY, pauseSize, pauseSize, { radius: 12 });
    iconPause(pauseX + pauseSize / 2, pauseY + pauseSize / 2, 11);
    pauseHitRect = { x: pauseX, y: pauseY, w: pauseSize, h: pauseSize };
}

function drawWaveBar() {
    // Battlefield minimap — fills the space between the compact heli/ammo
    // panel on the left (ends ~x=302) and the pause button on the right
    // (starts ~x=1138). Much wider now that base HP cells are gone.
    const mapH = 50;
    const mapX = 320;
    const mapW = 808;
    const mapY = 16;

    // Backing panel
    hudPanel(mapX - 12, mapY - 8, mapW + 24, mapH + 26, { radius: 14 });

    // Map content background — sky → ground → water gradient mimicking the world
    const grad = ctx.createLinearGradient(mapX, mapY, mapX, mapY + mapH);
    grad.addColorStop(0, '#4fc3f7');
    grad.addColorStop(0.6, '#a5d6a7');
    grad.addColorStop(0.8, '#ffe0b2');
    grad.addColorStop(1, '#0288d1');
    ctx.fillStyle = grad;
    roundRect(mapX, mapY, mapW, mapH, 8);
    ctx.fill();

    // Bases as little flags
    const playerMX = mapX + (playerBase.x / WORLD_WIDTH) * mapW;
    const enemyMX  = mapX + (enemyBase.x  / WORLD_WIDTH) * mapW;
    drawMiniBase(playerMX, mapY + mapH - 10, '#1565c0', '#42a5f5');
    drawMiniBase(enemyMX,  mapY + mapH - 10, '#c62828', '#e53935');

    // Units — distinct shape per type so it's easy to read at a glance.
    const groundLineY = mapY + mapH - 9;
    for (const u of units) {
        const ux = mapX + (u.x / WORLD_WIDTH) * mapW;
        if (ux < mapX - 6 || ux > mapX + mapW + 6) continue;
        drawMinimapUnit(ux, groundLineY, u);
    }
    // Air defence batteries — red triangle pointing up
    for (const aa of airDefences) {
        const ax = mapX + (aa.x / WORLD_WIDTH) * mapW;
        if (ax < mapX || ax > mapX + mapW) continue;
        ctx.fillStyle = '#ef5350';
        ctx.strokeStyle = '#7f0000';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(ax, groundLineY - 8);
        ctx.lineTo(ax + 4, groundLineY);
        ctx.lineTo(ax - 4, groundLineY);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        // Pulse dot if it's actively firing range of the heli
        const dx = heli.x - aa.x, dy = heli.y - aa.y;
        if (dx * dx + dy * dy < BALANCE.aa.range * BALANCE.aa.range) {
            const pulse = 0.4 + Math.abs(Math.sin(frameCount * 0.15)) * 0.6;
            ctx.fillStyle = `rgba(255, 100, 100, ${pulse})`;
            ctx.beginPath();
            ctx.arc(ax, groundLineY - 4, 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Helicopter — white dot with glow
    const heliMX = mapX + (heli.x / WORLD_WIDTH) * mapW;
    const heliMY = mapY + 4 + (heli.y / GROUND_Y) * (mapH - 14);
    ctx.save();
    ctx.shadowBlur = 6;
    ctx.shadowColor = '#fff';
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(heliMX, heliMY, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Camera viewport — outline of what the player currently sees
    const camLeft = mapX + (cameraX / WORLD_WIDTH) * mapW;
    const camWidth = (W / WORLD_WIDTH) * mapW;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(camLeft, mapY + 2, camWidth, mapH - 4);

    // Border
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.65)';
    ctx.lineWidth = 2;
    roundRect(mapX, mapY, mapW, mapH, 8);
    ctx.stroke();

    // Legend strip above the map so the shapes are readable at a glance
    drawMinimapLegend(mapX, mapY, mapW);

    // "WAVE 3 / 5" label below the minimap with state indicator
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px "Lilita One", sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowBlur = 4;
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    let stateText = `LEVEL ${currentLevel} / ${TOTAL_LEVELS}`;
    if (levelState === 'complete') stateText += '  •  CLEARED';
    if (levelState === 'active')   stateText += '  •  IN COMBAT';
    ctx.fillText(stateText, mapX + mapW / 2, mapY + mapH + 18);
    ctx.shadowBlur = 0;
}

// Per-type unit marker on the minimap
function drawMinimapUnit(x, y, u) {
    const fill = u.team === 'player' ? '#42a5f5' : '#ef5350';
    const stroke = u.team === 'player' ? '#0d47a1' : '#7f0000';

    ctx.save();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = stroke;
    ctx.fillStyle = fill;

    if (u.isBoss) {
        // Big diamond with pulsing star outline so the boss really pops
        const pulse = 1 + Math.sin(frameCount * 0.18) * 0.25;
        const r = 5 * pulse;
        ctx.fillStyle = '#ffd54f';
        ctx.strokeStyle = '#7f0000';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
            const a = (i * Math.PI) / 5 - Math.PI / 2;
            const rad = i % 2 === 0 ? r : r * 0.5;
            const px = x + Math.cos(a) * rad;
            const py = y - 3 + Math.sin(a) * rad;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill(); ctx.stroke();
    } else if (u.type === 'tank') {
        // Filled square + tiny turret line
        ctx.fillRect(x - 4, y - 5, 8, 6);
        ctx.strokeRect(x - 4, y - 5, 8, 6);
        // Turret bump on top
        ctx.fillRect(x - 1, y - 8, 2, 3);
        ctx.strokeRect(x - 1, y - 8, 2, 3);
    } else if (u.type === 'bazooka') {
        // Diamond
        ctx.beginPath();
        ctx.moveTo(x, y - 5);
        ctx.lineTo(x + 4, y - 1);
        ctx.lineTo(x, y + 3);
        ctx.lineTo(x - 4, y - 1);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
    } else {
        // Infantry — small upward triangle
        ctx.beginPath();
        ctx.moveTo(x, y - 5);
        ctx.lineTo(x + 3.5, y + 1);
        ctx.lineTo(x - 3.5, y + 1);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
    }
    ctx.restore();
}

// Compact legend overlaid in the top-left of the minimap
function drawMinimapLegend(mapX, mapY, mapW) {
    const items = [
        { label: 'INF',  shape: 'triangle' },
        { label: 'BZK',  shape: 'diamond' },
        { label: 'TANK', shape: 'square' },
        { label: 'BOSS', shape: 'star' },
    ];
    const itemW = 52;
    const stripW = items.length * itemW;
    const stripH = 14;
    const sx = mapX + 4;
    const sy = mapY + 3;

    ctx.save();
    // Dark backdrop for legibility
    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
    roundRect(sx - 2, sy - 1, stripW + 4, stripH + 2, 4); ctx.fill();

    ctx.font = 'bold 9px "Lilita One", sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';

    items.forEach((it, idx) => {
        it.x = sx + idx * itemW + 6;
    });
    const ly = sy + stripH / 2;
    for (const it of items) {
        // Draw shape neutrally (white) so it works as a key
        ctx.fillStyle = '#cfd8dc';
        ctx.strokeStyle = '#0a1628';
        ctx.lineWidth = 1.2;
        if (it.shape === 'triangle') {
            ctx.beginPath();
            ctx.moveTo(it.x, ly - 4);
            ctx.lineTo(it.x + 3.5, ly + 2);
            ctx.lineTo(it.x - 3.5, ly + 2);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
        } else if (it.shape === 'diamond') {
            ctx.beginPath();
            ctx.moveTo(it.x, ly - 4);
            ctx.lineTo(it.x + 4, ly);
            ctx.lineTo(it.x, ly + 4);
            ctx.lineTo(it.x - 4, ly);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
        } else if (it.shape === 'square') {
            ctx.fillRect(it.x - 4, ly - 4, 8, 8);
            ctx.strokeRect(it.x - 4, ly - 4, 8, 8);
        } else if (it.shape === 'star') {
            ctx.fillStyle = '#ffd54f';
            const r = 5;
            ctx.beginPath();
            for (let i = 0; i < 10; i++) {
                const a = (i * Math.PI) / 5 - Math.PI / 2;
                const rad = i % 2 === 0 ? r : r * 0.5;
                const px = it.x + Math.cos(a) * rad;
                const py = ly + Math.sin(a) * rad;
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill(); ctx.stroke();
        }
        ctx.fillStyle = '#fff';
        ctx.fillText(it.label, it.x + 8, ly);
    }
    ctx.restore();
}

        ctx.textBaseline = 'middle';

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowBlur = 4; ctx.shadowColor = 'rgba(0,0,0,0.6)';
        // Lightning bolt
        ctx.fillStyle = canAfford ? '#42a5f5' : '#666';

        const by = cardY + cardH - 14;

        ctx.lineTo(bx + 5, by - 1);
        ctx.lineTo(bx + 2, by - 1);

        hudHitRects.push({ x: cx, y: cardY, w: cardW, h: cardH, action: card.action });
    }

    // CP bar at the top of the deploy panel
    const cpBarY = panelY + 8;
    const cpBarX = panelX + 78;
    const cpBarW = panelW - 86;

    ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
    roundRect(cpBarX, cpBarY, cpBarW, cpBarH, 6); ctx.fill();
    // Fill
    const cpRatio = Math.min(1, commandPoints / cpCap);
    if (cpRatio > 0) {
        const grad = ctx.createLinearGradient(cpBarX, cpBarY, cpBarX, cpBarY + cpBarH);
        grad.addColorStop(0, '#42a5f5'); grad.addColorStop(1, '#1565c0');
        ctx.fillStyle = grad;
        roundRect(cpBarX, cpBarY, cpBarW * cpRatio, cpBarH, 6); ctx.fill();
    }
    // Tick marks per CP
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.lineWidth = 1;
    for (let t = 1; t < cpCap; t++) {
        const tx = cpBarX + (cpBarW * t) / cpCap;
        ctx.beginPath(); ctx.moveTo(tx, cpBarY + 1); ctx.lineTo(tx, cpBarY + cpBarH - 1); ctx.stroke();
    }
    // Border
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.lineWidth = 1.5;
    roundRect(cpBarX, cpBarY, cpBarW, cpBarH, 6); ctx.stroke();
    // Number
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px "Lilita One", sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.shadowBlur = 3; ctx.shadowColor = 'rgba(0,0,0,0.7)';
    ctx.fillText(`${Math.floor(commandPoints)} / ${cpCap} CP`, cpBarX + cpBarW - 4, cpBarY + cpBarH / 2);
    ctx.shadowBlur = 0;
}
