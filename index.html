<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a1628">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/logo.png">
<title>Frontline Extraction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --headline-font: 'Lilita One', 'Impact', sans-serif;
    --body-font: 'Fredoka', 'Segoe UI', sans-serif;
    --gold: #ffc107;
    --gold-deep: #ff8f00;
    --wood: #6d4c41;
    --wood-light: #8d6e63;
    --wood-dark: #3e2723;
    --jungle: #2e7d32;
    --jungle-dark: #1b5e20;
    --crimson: #c62828;
    --crimson-deep: #8e0000;
    --ocean: #0277bd;
    --sky: #29b6f6;
}

body {
    background: radial-gradient(circle at 50% 30%, #1e3c5a 0%, #0a1628 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: var(--body-font);
    color: #fff;
    /* Stop touch gestures from scrolling/zooming the page */
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

/* Holder wraps the canvas + touch overlay so they scale as a unit */
#game-stage {
    position: relative;
    width: 1200px;
    height: 700px;
    transform-origin: center center;
    flex-shrink: 0;
}
canvas {
    border: 4px solid var(--wood-dark);
    border-radius: 10px;
    box-shadow:
        inset 0 0 0 2px var(--wood-light),
        0 8px 40px rgba(0, 0, 0, 0.7),
        0 0 80px rgba(255, 193, 7, 0.08);
    display: block;
}

/* ---- Touch overlay ---- */
/* Sits on top of the canvas at the same scaled size. Only visible on
   touch-capable devices, so desktop play is unchanged. */
#touch-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: none;
    z-index: 5;
}
body.touch #touch-overlay { display: block; }
#touch-overlay .control {
    position: absolute;
    pointer-events: auto;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
}
/* Joystick — right thumb. Transparent ring with a transparent inner knob,
   keeps the playfield visible underneath. */
#joystick {
    right: 60px;
    bottom: 320px;        /* lifted to clear the beach + match FIRE height */
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: rgba(0, 30, 60, 0.18);
    border: 2px solid rgba(132, 232, 255, 0.55);
    box-shadow: 0 0 18px rgba(132, 232, 255, 0.35);
}
#joystick-knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 70px;
    height: 70px;
    margin-left: -35px;
    margin-top: -35px;
    border-radius: 50%;
    background: rgba(0, 30, 60, 0.45);
    border: 2px solid rgba(132, 232, 255, 0.85);
    box-shadow: 0 0 14px rgba(132, 232, 255, 0.55);
    transition: transform 0.05s ease-out;
}
/* ---- Touch buttons — monochrome cyan transparent HUD style ---- */
/* Inspired by sci-fi controller overlay HUDs: thin cyan outline + soft
   outer glow, transparent interior so the playfield breathes through.
   Icons inside become cyan silhouettes via mask-image so the whole
   control surface reads as a single colour.                          */
:root {
    --hud-cyan:      rgba(132, 232, 255, 0.95);
    --hud-cyan-soft: rgba(132, 232, 255, 0.55);
    --hud-cyan-glow: rgba(132, 232, 255, 0.45);
    --hud-back:      rgba(0, 30, 60, 0.18);

    /* Ring colours — red while recharging / not affordable, green when ready */
    --ring-red:        rgba(255,  78,  78, 0.95);
    --ring-red-soft:   rgba(255,  78,  78, 0.18);
    --ring-red-glow:   rgba(255,  78,  78, 0.55);
    --ring-green:      rgba( 80, 240, 130, 0.95);
    --ring-green-glow: rgba( 80, 240, 130, 0.55);
}

.touch-btn {
    border-radius: 50%;
    color: var(--hud-cyan);
    font-family: var(--headline-font);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--hud-back);
    border: 2px solid var(--hud-cyan-soft);
    box-shadow:
        0 0 14px var(--hud-cyan-glow),
        inset 0 0 14px rgba(0, 200, 255, 0.12);
    transition: filter 0.1s, transform 0.05s;
}
.touch-btn:active {
    transform: translateY(1px);
    filter: brightness(1.25) drop-shadow(0 0 8px var(--hud-cyan));
    border-color: var(--hud-cyan);
}

/* Icon layer inside each button. Sits above the conic fill rings. */
.touch-btn .icon {
    position: absolute;
    inset: 18%;
    color: var(--hud-cyan);
    pointer-events: none;
    z-index: 1;
}
/* PNG-backed icons render the full image, then a CSS filter chain
   converts the source to a 2-tone cyan duotone — light areas become
   bright cyan, dark areas become deep teal, preserving the shading
   detail in the original sprite. JS sets --icon-src to the asset url. */
.touch-btn .icon[data-icon] {
    background-image: var(--icon-src, none);
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    filter:
        grayscale(1)
        brightness(1.05)
        sepia(1)
        hue-rotate(160deg)
        saturate(3)
        drop-shadow(0 0 4px var(--hud-cyan-glow));
}
/* PICK arrow — SVG drawn with a cyan fill and a darker teal stroke so
   it picks up the same 2-tone look as the PNG icons. */
.touch-btn .icon svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 4px var(--hud-cyan-glow));
}
.touch-btn .icon svg path {
    fill: var(--hud-cyan);
    stroke: rgba(20, 70, 95, 0.9);
    stroke-width: 0.9;
    stroke-linejoin: round;
}

/* ---- FIRE button ---- */
#btn-fire {
    left: 60px;
    bottom: 350px;
    width: 140px;
    height: 140px;
}
#btn-fire .icon { inset: 14%; }
#btn-fire::before {
    /* Ammo recharge ring. Red fill draws up while reloading
       (--ammo-fill 0..100). When .ready is set, the ring switches
       to a solid green band — magazine is loaded, free to fire. */
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    background: conic-gradient(
        from -90deg,
        var(--ring-red) 0deg,
        var(--ring-red) calc(var(--ammo-fill, 0) * 3.6deg),
        var(--ring-red-soft) calc(var(--ammo-fill, 0) * 3.6deg)
    );
    -webkit-mask: radial-gradient(circle,
        transparent 0, transparent 65px,
        black 65px, black 79px,
        transparent 79px);
            mask: radial-gradient(circle,
        transparent 0, transparent 65px,
        black 65px, black 79px,
        transparent 79px);
    filter: drop-shadow(0 0 6px var(--ring-red-glow));
    pointer-events: none;
    transition: filter 0.15s;
}
#btn-fire.ready::before {
    background: var(--ring-green);
    filter: drop-shadow(0 0 8px var(--ring-green-glow));
}

/* ---- Deploy orbit (5 buttons evenly spaced) ---- */
/* FIRE centre = (130, 280) in the 1200x700 stage. Orbit radius 130.
   5 buttons spread over 180° from 12 o'clock to 6 o'clock (4 gaps of 45°):

       angle    cx   cy   left  bottom
     1  270°   130  150     87     507
     2  315°   222  188    179     469
     3    0°   260  280    217     377
     4   45°   222  372    179     285
     P   90°   130  410     87     247
   Button 86×86 (centre offset 43); CSS bottom = 700 - cy - 43. */
.deploy-orbit {
    width: 86px;
    height: 86px;
}
.deploy-orbit::before {
    /* CP / cost fill ring. Red fill grows as resource accumulates,
       then .ready flips it to a solid green band. */
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    background: conic-gradient(
        from -90deg,
        var(--ring-red) 0deg,
        var(--ring-red) calc(var(--cp-fill, 0) * 3.6deg),
        var(--ring-red-soft) calc(var(--cp-fill, 0) * 3.6deg)
    );
    -webkit-mask: radial-gradient(circle,
        transparent 0, transparent 38px,
        black 38px, black 52px,
        transparent 52px);
            mask: radial-gradient(circle,
        transparent 0, transparent 38px,
        black 38px, black 52px,
        transparent 52px);
    filter: drop-shadow(0 0 5px var(--ring-red-glow));
    pointer-events: none;
    transition: filter 0.15s;
}
.deploy-orbit.ready::before {
    background: var(--ring-green);
    filter: drop-shadow(0 0 6px var(--ring-green-glow));
}

#btn-deploy-1 { left:  87px; bottom: 507px; }
#btn-deploy-2 { left: 179px; bottom: 469px; }
#btn-deploy-3 { left: 217px; bottom: 377px; }
#btn-deploy-4 { left: 179px; bottom: 285px; }
#btn-pickup   { left:  87px; bottom: 247px; }

/* Portrait warning overlay */
#rotate-warning {
    position: fixed;
    inset: 0;
    background: #0a1628;
    z-index: 200;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #ffd54f;
    font-family: var(--headline-font);
    text-align: center;
    padding: 40px;
}
#rotate-warning .icon {
    font-size: 96px;
    margin-bottom: 20px;
    animation: rotate-hint 2s ease-in-out infinite;
}
@keyframes rotate-hint {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
}
body.touch.portrait #rotate-warning { display: flex; }

/* ---- Start screen ---- */
#start-screen, #game-over-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at 50% 40%, rgba(255, 193, 7, 0.12) 0%, transparent 60%),
        rgba(10, 22, 40, 0.78);
    z-index: 10;
    backdrop-filter: blur(2px);
}
#game-over-screen { display: none; }

#logo-img {
    max-width: 75%;
    max-height: 45%;
    filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.6));
    margin-bottom: 8px;
    user-select: none;
    -webkit-user-drag: none;
}
/* Fallback wordmark if logo image hasn't loaded */
#logo-text {
    font-family: var(--headline-font);
    font-size: 64px;
    color: var(--gold);
    text-shadow:
        2px 2px 0 var(--crimson-deep),
        4px 4px 0 #4e0000,
        6px 6px 12px rgba(0, 0, 0, 0.7);
    letter-spacing: 2px;
    line-height: 0.95;
    text-align: center;
    margin-bottom: 8px;
}
#logo-text .top { display: block; }
#logo-text .bottom { display: block; font-size: 0.85em; color: #ff7043; }

#tagline {
    font-family: var(--body-font);
    font-weight: 600;
    font-size: 18px;
    color: #b3e5fc;
    margin-bottom: 24px;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
}

#start-screen .controls {
    background:
        linear-gradient(180deg, rgba(141, 110, 99, 0.95), rgba(62, 39, 35, 0.95));
    border: 3px solid var(--wood-dark);
    border-radius: 12px;
    box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.15),
        inset 0 -2px 0 rgba(0, 0, 0, 0.3),
        0 6px 20px rgba(0, 0, 0, 0.5);
    color: #ffe0b2;
    font-family: var(--body-font);
    font-weight: 500;
    font-size: 15px;
    padding: 18px 28px;
    line-height: 1.9;
    margin-bottom: 26px;
    min-width: 320px;
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
}
#start-screen .controls .key {
    display: inline-block;
    font-family: var(--headline-font);
    background: linear-gradient(180deg, #fff8e1, #ffc107);
    color: var(--wood-dark);
    border: 2px solid var(--wood-dark);
    border-radius: 6px;
    padding: 1px 9px;
    margin-right: 8px;
    font-size: 13px;
    text-shadow: none;
    box-shadow: 0 2px 0 var(--wood-dark);
    min-width: 28px;
    text-align: center;
}

/* ---- Big chunky game button ---- */
.game-btn {
    font-family: var(--headline-font);
    font-size: 26px;
    letter-spacing: 2px;
    padding: 14px 56px;
    color: #fff;
    text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.4);
    border: 3px solid var(--wood-dark);
    border-radius: 14px;
    cursor: pointer;
    pointer-events: all;
    transition: transform 0.08s, filter 0.08s;
    box-shadow:
        inset 0 3px 0 rgba(255, 255, 255, 0.3),
        inset 0 -4px 0 rgba(0, 0, 0, 0.25),
        0 6px 0 var(--wood-dark),
        0 8px 18px rgba(0, 0, 0, 0.5);
    background: linear-gradient(180deg, #66bb6a 0%, #2e7d32 50%, #1b5e20 100%);
}
.game-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
.game-btn:disabled {
    filter: grayscale(0.6) brightness(0.7);
    cursor: progress;
    pointer-events: none;
}
.game-btn:active {
    transform: translateY(4px);
    box-shadow:
        inset 0 3px 0 rgba(255, 255, 255, 0.2),
        inset 0 -2px 0 rgba(0, 0, 0, 0.25),
        0 2px 0 var(--wood-dark),
        0 4px 10px rgba(0, 0, 0, 0.5);
}
.game-btn.danger {
    background: linear-gradient(180deg, #ff7043 0%, #d84315 50%, #8e0000 100%);
}

/* ---- Game over ---- */
#game-over-screen h1 {
    font-family: var(--headline-font);
    font-size: 78px;
    letter-spacing: 4px;
    margin-bottom: 28px;
    text-shadow:
        3px 3px 0 var(--wood-dark),
        6px 6px 12px rgba(0, 0, 0, 0.7);
}

/* ============================================================
   DEBUG BALANCE OVERLAY — press ` to toggle.
   Designed to sit out of the way; tighter typography than the
   gameplay HUD so we can fit a lot of values on screen.
   ============================================================ */
#debug-panel {
    position: fixed;
    top: 0; right: 0;
    height: 100vh;
    width: 380px;
    background: rgba(8, 18, 32, 0.96);
    color: #cfeaff;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    box-shadow: -4px 0 24px rgba(0, 0, 0, 0.45);
    border-left: 1px solid rgba(132, 232, 255, 0.4);
    transform: translateX(100%);
    transition: transform 0.18s ease-out;
    z-index: 9999;
    display: flex;
    flex-direction: column;
}
#debug-panel.open { transform: translateX(0); }

#debug-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid rgba(132, 232, 255, 0.2);
    background: rgba(0, 0, 0, 0.3);
}
#debug-header strong {
    font-family: "Lilita One", sans-serif;
    color: rgba(132, 232, 255, 0.95);
    font-size: 16px;
    letter-spacing: 1px;
}
#debug-hint {
    flex: 1;
    opacity: 0.55;
    font-size: 11px;
}
#debug-header button {
    background: rgba(132, 232, 255, 0.12);
    color: #cfeaff;
    border: 1px solid rgba(132, 232, 255, 0.4);
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
}
#debug-header button:hover {
    background: rgba(132, 232, 255, 0.25);
}
#debug-header #debug-close {
    width: 28px;
    padding: 4px 0;
    font-size: 16px;
    line-height: 1;
}

#debug-body {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px 16px;
}
.debug-section {
    margin-bottom: 14px;
}
.debug-section h4 {
    margin: 8px 0 4px;
    font-size: 12px;
    letter-spacing: 1px;
    color: rgba(132, 232, 255, 0.95);
    text-transform: uppercase;
    font-family: "Lilita One", sans-serif;
    font-weight: normal;
}
.debug-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 2px 0;
}
.debug-row label {
    flex: 1;
    opacity: 0.85;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.debug-row input {
    width: 110px;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(132, 232, 255, 0.3);
    color: #fff;
    padding: 3px 6px;
    font-family: inherit;
    font-size: 12px;
    border-radius: 3px;
}
.debug-row input:focus {
    outline: none;
    border-color: rgba(132, 232, 255, 0.9);
    background: rgba(0, 30, 60, 0.6);
}
#debug-toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: rgba(0, 0, 0, 0.8);
    color: rgba(132, 232, 255, 0.95);
    padding: 10px 16px;
    border: 1px solid rgba(132, 232, 255, 0.4);
    border-radius: 6px;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    z-index: 10000;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
}
#debug-toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="game-stage">
<canvas id="game" width="1200" height="700"></canvas>

<!-- Touch controls overlay — only visible on touch devices -->
<div id="touch-overlay">
    <div id="joystick" class="control"><div id="joystick-knob"></div></div>
    <!-- FIRE in the centre; 5 buttons orbit around it on a radius-130 circle -->
    <div id="btn-fire"   class="control touch-btn"><div class="icon" data-icon="hud_flame"></div></div>
    <div id="btn-deploy-1" class="control touch-btn deploy-orbit" data-keynum="1"><div class="icon" data-icon="hud_infantry"></div></div>
    <div id="btn-deploy-2" class="control touch-btn deploy-orbit" data-keynum="2"><div class="icon" data-icon="hud_bazooka"></div></div>
    <div id="btn-deploy-3" class="control touch-btn deploy-orbit" data-keynum="3"><div class="icon" data-icon="hud_tank"></div></div>
    <div id="btn-deploy-4" class="control touch-btn deploy-orbit" data-keynum="4"><div class="icon" data-icon="hud_missile"></div></div>
    <!-- PICK joins the orbit at 6 o'clock with an SVG up-arrow icon -->
    <div id="btn-pickup" class="control touch-btn deploy-orbit" data-keynum="P">
        <div class="icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3 L20.5 13 H15.5 V21 H8.5 V13 H3.5 Z"/>
            </svg>
        </div>
    </div>
</div>
</div>

<!-- Rotate-to-landscape hint -->
<div id="rotate-warning">
    <div class="icon">📱</div>
    <div style="font-size: 28px;">ROTATE YOUR DEVICE</div>
    <div style="font-size: 18px; margin-top: 8px; color: #fff;">Frontline Extraction is played in landscape.</div>
</div>

<div id="start-screen">
    <img id="logo-img" src="assets/logo.png" alt="Frontline Extraction" onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block';">
    <div id="logo-text" style="display:none">
        <span class="top">FRONTLINE</span>
        <span class="bottom">EXTRACTION</span>
    </div>
    <div id="tagline">Air Cavalry · Ground Assault</div>
    <button id="start-btn" class="game-btn">START GAME</button>
</div>

<div id="game-over-screen">
    <h1 id="game-over-text">VICTORY!</h1>
    <button id="restart-btn" class="game-btn danger">PLAY AGAIN</button>
</div>

<div id="debug-toast"></div>

<!-- Debug balance overlay. Press ` (backtick) to toggle. Walks BALANCE
     and emits a live input per leaf — edits mutate BALANCE.path.to.val
     so object-keyed reads (units, damageMatrix, bosses, upgrades, level
     compositions) update on the next frame. Primitive reads that took
     a value at script load (e.g. heli.maxAmmo in resetHeli) only apply
     to the NEXT level/restart, since the heli object captured the value. -->
<div id="debug-panel" aria-hidden="true">
    <div id="debug-header">
        <strong>BALANCE</strong>
        <span id="debug-hint">live tuning</span>
        <button id="debug-copy">Copy JSON</button>
        <button id="debug-reload">Reload</button>
        <button id="debug-close">×</button>
    </div>
    <div id="debug-body"></div>
</div>

<script>
// ============================================================
// BEACH RAIDERS — Rescue Raiders clone with Boom Beach aesthetics
// ============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// ============================================================
// BALANCE — single source of truth for tunable gameplay numbers.
//
// Defaults live here. On startup the game tries to fetch
// `balance.json` and deep-merges it over these defaults, so a
// designer can tweak values without touching this file. The
// debug overlay (press the backtick / ` key) lets you edit the
// live values in-game; the "Copy JSON" button on the overlay
// exports the current state for pasting back into balance.json.
//
// Rule of thumb: if you might ever want to retune this in soft
// launch without an app store release, it lives here.
//
// Visual / geometry constants (world size, ground line, walk
// cycle timing) stay as plain `const`s further down — they're
// not for live tuning.
// ============================================================
const BALANCE = {
    heli: {
        maxAmmo:     50,
        reloadMs:    7500,
        startHp:     100,
        maxCarry:    4,
    },
    missiles: {
        pairCost:    100,
        perPurchase: 2,
        damage:      80,    // vs units / heli / bases
        damageVsAA:  25,    // 4 hits to destroy a 100-HP AA
    },
    crates: {
        hp:          3,     // heli bullets to "open"
        respawnMs:   20000, // 20s respawn from same slot
        parachuteMs: 4000,  // parachute descent duration
    },
    aa: {
        hp:          90,
        bounty:      80,
        fireInterval: 240,  // frames between launches (~4s @ 60fps)
        range:       800,
    },
    bases: {
        hp:          500,
    },
    economy: {
        startMoney:        30,
        cpRegenPerFrame:   1 / 90,   // 1 CP per 1.5s @ 60fps
        cpCapDefault:      10,

// Deep-merge a plain-object source into target (mutates target).
// Used by loadBalance() to overlay balance.json values on top of defaults.
function deepMerge(target, source) {
    for (const k of Object.keys(source)) {
        if (source[k] && typeof source[k] === 'object' && !Array.isArray(source[k])) {
            if (!target[k] || typeof target[k] !== 'object') target[k] = {};
            deepMerge(target[k], source[k]);
        } else {
            target[k] = source[k];
        }
    }
}

// Attempt to fetch balance.json and merge over BALANCE defaults.
// Silent failure (no file, malformed) — the game runs identically
// with just the defaults, which is correct for a freshly-cloned repo.
async function loadBalance() {
    try {
        const resp = await fetch('balance.json', { cache: 'no-cache' });
        if (!resp.ok) {
            console.log('[balance] no balance.json — using inline defaults');
            return;
        }
        const override = await resp.json();
        deepMerge(BALANCE, override);
        console.log('[balance] balance.json overrides applied');
    } catch (e) {
        console.log('[balance] using inline defaults (', e.message, ')');
    }
}

// 8-frame walk cycle with VARIABLE per-frame timing (ms).
// Total cycle ≈ 520ms. Contact and push-off frames hold longer than recoil/midstance.
const WALK_FRAME_MS = [80, 55, 55, 70, 80, 55, 55, 70];
const WALK_CYCLE_MS = WALK_FRAME_MS.reduce((a, b) => a + b, 0);
const WALK_FRAME_ENDS = WALK_FRAME_MS.reduce((acc, d) => {
    acc.push((acc[acc.length - 1] || 0) + d);
    return acc;
}, []);

// Vertical body offset PER KEYFRAME (positive = lower on screen).
// These are anchored to the START of each frame; we interpolate between
// them smoothly so the body bobs continuously rather than teleporting at
// each frame swap. Spec: lowest at F3/F7 (midstance), highest at F4/F8.
const WALK_FRAME_Y_KEY = [0, 2, 5, -3, 0, 2, 5, -3];

// Cumulative start times for each frame (i.e. WALK_FRAME_ENDS shifted right).
const WALK_FRAME_STARTS = [0, ...WALK_FRAME_ENDS.slice(0, -1)];

// Given a time in ms within the cycle, return frame number (1..8).
function walkFrameAt(ms) {
    const t = ((ms % WALK_CYCLE_MS) + WALK_CYCLE_MS) % WALK_CYCLE_MS;
    for (let i = 0; i < 8; i++) {
        if (t < WALK_FRAME_ENDS[i]) return i + 1;
    }
    return 8;
}

// Smooth-interpolated vertical bob in pixels at time `ms` within the cycle.
// Uses a smoothstep curve between adjacent keyframes for natural motion.
function walkYAt(ms) {
    const t = ((ms % WALK_CYCLE_MS) + WALK_CYCLE_MS) % WALK_CYCLE_MS;
    for (let i = 0; i < 8; i++) {
        if (t < WALK_FRAME_ENDS[i]) {
            const segStart = WALK_FRAME_STARTS[i];
            const segEnd = WALK_FRAME_ENDS[i];
            const a = WALK_FRAME_Y_KEY[i];
            const b = WALK_FRAME_Y_KEY[(i + 1) % 8];  // wrap so F8→F1 interpolates
            const u = (t - segStart) / (segEnd - segStart);
            // Smoothstep for ease-in/ease-out around the keyframe values
            const s = u * u * (3 - 2 * u);
            return a + (b - a) * s;
        }
    }
    return 0;
}
let spritesLoaded = 0;
let spritesTotal = Object.keys(SPRITE_FILES).length;
let allSpritesReady = false;

function loadSprites() {
    const startBtn = document.getElementById('start-btn');
    if (startBtn) {
        startBtn.disabled = true;
        startBtn.textContent = 'LOADING…';
    }
    const onReady = () => {
        allSpritesReady = true;
        if (startBtn) {
            startBtn.disabled = false;
            startBtn.textContent = 'START GAME';
        }
    };
    Object.entries(SPRITE_FILES).forEach(([key, src]) => {
        const img = new Image();
        img.onload = () => {
            spritesLoaded++;
            if (spritesLoaded === spritesTotal) onReady();
        };
        img.onerror = () => {
            console.warn('Failed to load sprite:', src);
            spritesLoaded++;
            if (spritesLoaded === spritesTotal) onReady();
        };
        img.src = src;
        SPRITES[key] = img;
    });
}

// Draw sprite centred at (x, y) with given height (preserves aspect ratio).
// flipH=true draws mirrored horizontally (for left-facing).
function drawSprite(key, x, y, height, flipH = false) {
    const img = SPRITES[key];
    if (!img || !img.complete || img.naturalWidth === 0) return false;
    const aspect = img.naturalWidth / img.naturalHeight;
    const w = height * aspect;
    const h = height;
    ctx.save();
    if (flipH) {
        ctx.translate(x, y);
        ctx.scale(-1, 1);
        ctx.drawImage(img, -w / 2, -h / 2, w, h);
    } else {
        ctx.drawImage(img, x - w / 2, y - h / 2, w, h);
    }
    ctx.restore();
    return true;
}

// Click on HUD buttons (pause, deploy cards, powerups)
canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const cy = (e.clientY - rect.top) * (canvas.height / rect.height);

    if (gameState === 'playing' || gameState === 'paused') {
        if (pauseHitRect &&
            cx >= pauseHitRect.x && cx <= pauseHitRect.x + pauseHitRect.w &&
            cy >= pauseHitRect.y && cy <= pauseHitRect.y + pauseHitRect.h) {
            gameState = gameState === 'playing' ? 'paused' : 'playing';
            return;
        }
    }
    if (gameState !== 'playing') return;
    for (const r of hudHitRects) {
        if (cx >= r.x && cx <= r.x + r.w && cy >= r.y && cy <= r.y + r.h) {
            if (r.action) r.action();
            return;
        }
    }
});

    bgTrees = [];
    for (let i = 0; i < 25; i++) {
        bgTrees.push({
            x: Math.random() * WORLD_WIDTH,
            h: 30 + Math.random() * 40,
            w: 20 + Math.random() * 25,
            shade: Math.random(),
        });
    }

    // Generate ambient birds
    birds = [];
    for (let i = 0; i < 6; i++) {
        birds.push({
            x: Math.random() * WORLD_WIDTH,
            y: 40 + Math.random() * 100,
            speed: 0.3 + Math.random() * 0.6,
            wingPhase: Math.random() * Math.PI * 2,
            size: 2 + Math.random() * 2,
        });
    }

    // Spawn initial enemy units
    for (let i = 0; i < 3; i++) {
        spawnEnemyUnit('infantry');
    }
}

// ---- UNIT DEFINITIONS ----
// Unit stats live in BALANCE.units (top of file). The const alias here
// shares the object by reference, so debug-overlay edits to BALANCE.units
// show up immediately at every read site.
const UNIT_DEFS = BALANCE.units;

// RPS damage matrix — lives in BALANCE.damageMatrix (top of file).
const DAMAGE_MATRIX = BALANCE.damageMatrix;
function applyDamageModifier(attackerType, targetType, base) {
    const row = DAMAGE_MATRIX[attackerType];
    const mult = row && row[targetType] != null ? row[targetType] : 1.0;
    return base * mult;
}

// Floating "+$N" / "+CP" text indicators that pop above the action
let floatingTexts = [];
function spawnFloatingText(x, y, text, color = '#ffd54f') {
    floatingTexts.push({ x, y, text, color, life: 60, maxLife: 60, vy: -1.2 });
}

// ---- BOSS UNITS (elite tanks for wave 3 mini-boss and wave 5 boss) ----
// These reuse the tank rendering but have inflated stats.
// Stats live in BALANCE.bosses (top of file).
const BOSS_DEFS = BALANCE.bosses;

function spawnBossUnit(bossKey) {
    const tank = UNIT_DEFS.tank;
    const boss = BOSS_DEFS[bossKey];
    units.push({
        type: 'tank',
        team: 'enemy',
        x: enemyBase.x - 80,
        y: GROUND_Y - tank.h / 2,
        hp: tank.hp * boss.hpMul,
        maxHp: tank.hp * boss.hpMul,
        speed: tank.speed * boss.speedMul,
        damage: tank.damage * boss.damageMul,
        range: tank.range,
        attackRate: tank.attackRate,
        attackCooldown: 0,
        w: tank.w * boss.scale,
        h: tank.h * boss.scale,
        state: 'march',
        walkFrame: Math.random() * Math.PI * 2,
        isBoss: true,
        bossScale: boss.scale,
        bossLabel: boss.label,
        bossBounty: boss.bounty,
    });
    spawnFloatingText(enemyBase.x - 80, GROUND_Y - 120, `${boss.label} INCOMING`, '#ef5350');
    triggerScreenShake(8, 30);
}

// ---- UPGRADE SYSTEM ----
// Persistent (within a level) upgrades the player buys between waves.
// Definitions live in BALANCE.upgrades (top of file).
const UPGRADES = BALANCE.upgrades;
// Inject id onto each entry for easy lookup
for (const k of Object.keys(UPGRADES)) UPGRADES[k].id = k;

let upgradeLevels = {};
function makeFreshUpgradeLevels() {
    const o = {};
    for (const k of Object.keys(UPGRADES)) o[k] = 0;
    return o;
}
upgradeLevels = makeFreshUpgradeLevels();

// Apply an upgrade's effect to a freshly-spawned unit (mutate the unit)
function applyUpgradesToUnit(unit) {
    if (unit.type === 'infantry' && upgradeLevels.infantryDamage > 0) {
        unit.damage *= UPGRADES.infantryDamage.tiers[upgradeLevels.infantryDamage - 1].mult;
    }
    if (unit.type === 'bazooka' && upgradeLevels.bazookaRange > 0) {
        unit.range *= UPGRADES.bazookaRange.tiers[upgradeLevels.bazookaRange - 1].mult;
    }
    if (unit.type === 'tank' && upgradeLevels.tankHp > 0) {
        const m = UPGRADES.tankHp.tiers[upgradeLevels.tankHp - 1].mult;
        unit.hp *= m; unit.maxHp *= m;
    }
}

// Apply heli HP and CP cap upgrades immediately when bought
function buyUpgrade(id) {
    const up = UPGRADES[id];
    if (!up) return;
    const lvl = upgradeLevels[id];
    if (lvl >= up.tiers.length) return;
    const tier = up.tiers[lvl];
    if (money < tier.cost) {
        // Shop is screen-space — spawn the warning at the heli so it follows the
        // camera (floatingTexts are world-space and drawn at t.x - cameraX).
        spawnFloatingText(heli.x, heli.y - 60, 'NOT ENOUGH GOLD', '#ef5350');
        return;
    }
    money -= tier.cost;
    upgradeLevels[id] = lvl + 1;
    if (id === 'heliHp') {
        heli.maxHp += tier.hp;
        heli.hp += tier.hp;
    }
    if (id === 'cpCap') {
        cpCap = tier.cap;
        commandPoints = cpCap;
    }
}

function spawnPlayerUnit(type) {
    const def = UNIT_DEFS[type];
    if (commandPoints < def.cpCost) {
        // Not enough CP — flash a hint above the heli
        spawnFloatingText(heli.x, heli.y - 40, 'NOT ENOUGH CP', '#ef5350');
        return;
    }
    commandPoints -= def.cpCost;
    const u = {
        type, team: 'player',
        x: playerBase.x + 80, y: GROUND_Y - def.h / 2,
        hp: def.hp, maxHp: def.hp,
        speed: def.speed, damage: def.damage,
        range: def.range, attackRate: def.attackRate,
        attackCooldown: 0,
        w: def.w, h: def.h,
        state: 'march',
        walkFrame: Math.random() * Math.PI * 2,
    };
    applyUpgradesToUnit(u);
    units.push(u);
    spawnFloatingText(playerBase.x + 80, GROUND_Y - 60, `-${def.cpCost} CP`, '#42a5f5');
}

function spawnEnemyUnit(type) {
    const def = UNIT_DEFS[type];
    units.push({
        type, team: 'enemy',
        x: enemyBase.x - 80, y: GROUND_Y - def.h / 2,
        hp: def.hp, maxHp: def.hp,
        speed: def.speed, damage: def.damage,
        range: def.range, attackRate: def.attackRate,
        attackCooldown: 0,
        w: def.w, h: def.h,
        state: 'march',
        walkFrame: Math.random() * Math.PI * 2,
    });
}

// ---- HELICOPTER PICKUP / DROP ----
// Split onto two keys (E and T) so picking up troops while already
// carrying others doesn't accidentally drop the squad mid-flight.

function helicopterPickup() {
    if (heli.carrying.length >= heli.maxCarry) {
        spawnFloatingText(heli.x, heli.y - 40, 'CARRY FULL', '#ffc107');
        return;
    }
    let lifted = 0;
    for (let i = units.length - 1; i >= 0; i--) {
        const u = units[i];
        const liftable = u.team === 'player' && (u.type === 'infantry' || u.type === 'bazooka');
        if (!liftable) continue;
        if (heli.carrying.length >= heli.maxCarry) break;
        const dx = u.x - heli.x;
        const dy = u.y - heli.y;
        if (Math.abs(dx) < 60 && Math.abs(dy) < 80) {
            u.state = 'carried';
            heli.carrying.push(u);
            units.splice(i, 1);
            lifted++;
        }
    }
    if (lifted === 0) {
        spawnFloatingText(heli.x, heli.y - 40, 'NO TROOPS NEARBY', '#90a4ae');
    }
}

function helicopterDrop() {
    if (heli.carrying.length === 0) {
        spawnFloatingText(heli.x, heli.y - 40, 'CARGO HOLD EMPTY', '#90a4ae');
        return;
    }
    // Must be at low altitude (essentially landed) to drop troops.
    if (heli.y < HELI_LANDING_Y) {
        spawnFloatingText(heli.x, heli.y - 40, 'MUST LAND TO DROP', '#ff9800');
        return;
    }
    for (let i = 0; i < heli.carrying.length; i++) {
        const s = heli.carrying[i];
        s.x = heli.x + (i - (heli.carrying.length - 1) / 2) * 24;
        s.y = GROUND_Y - s.h / 2;
        s.state = 'march';
        units.push(s);
    }
    heli.carrying = [];
}

// ---- SHOOTING ----
function heliShoot() {
    if (heli.shootCooldown > 0) return;

    // Missiles take priority — they replace the minigun trigger until used up.
    // Trajectory mirrors the minigun rounds exactly so the player aims the
    // same way: slower forward speed + strong downward + the same gravity.
    if (heli.missiles > 0) {
        heli.shootCooldown = 28;
        heli.missiles--;
        bullets.push({
            x: heli.x + heli.facing * 25,
            y: heli.y + 18,
            vx: 5 * heli.facing + heli.vx,
            vy: 10 + heli.vy,
            team: 'player',
            damage: BALANCE.missiles.damage,
            aaDamage: BALANCE.missiles.damageVsAA,
            life: 80,
            type: 'heliMissile',
        });
        // Launch flash + smoke
        spawnParticles(heli.x + heli.facing * 25, heli.y + 18, '#ffeb3b', 6, 1, 10);
        spawnParticles(heli.x + heli.facing * 15, heli.y + 18, '#9e9e9e', 8, 1, 16);
        triggerScreenShake(3, 8);
        return;
    }

    if (heli.ammo <= 0) {
        if (heli.emptyClickCooldown <= 0) {
            spawnParticles(heli.x + heli.facing * 25, heli.y + 18, '#9e9e9e', 2, 0.5, 6);
            heli.emptyClickCooldown = 30;
        }
        heli.shootCooldown = 6;
        return;
    }
    heli.shootCooldown = 8;
    heli.ammo--;
    if (heli.ammo === 0 && heli.reloadMs <= 0) {
        heli.reloadMs = BALANCE.heli.reloadMs;
    }
    const spreadX = (Math.random() - 0.5) * 1.5;
    const spreadY = (Math.random() - 0.5) * 1.5;
    bullets.push({
        x: heli.x + heli.facing * 25,
        y: heli.y + 18,
        vx: 5 * heli.facing + heli.vx + spreadX,
        vy: 10 + heli.vy + spreadY,
        team: 'player',
        damage: 10,
        life: 80,
        type: 'heli',
    });
    // Muzzle flash
    spawnParticles(heli.x + heli.facing * 25, heli.y + 18, C.explosion3, 3, 2, 8);
    // Shell casing
    particles.push({
        x: heli.x + heli.facing * 15, y: heli.y + 14,
        vx: -heli.facing * (1 + Math.random() * 2), vy: -2 - Math.random() * 2,
        life: 30, maxLife: 30,
        color: '#d4a017', size: 2, isCasing: true,
    });
}

function unitShoot(unit, target) {
    if (unit.attackCooldown > 0) return;
    unit.attackCooldown = unit.attackRate;

    if (unit.type === 'tank' || unit.type === 'bazooka') {
        const dx = target.x - unit.x;
        const dy = (target.y || GROUND_Y) - unit.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        bullets.push({
            x: unit.x + (unit.team === 'player' ? unit.w / 2 : -unit.w / 2),
            y: unit.y,
            vx: (dx / dist) * 6,
            vy: (dy / dist) * 6 - (unit.type === 'bazooka' ? 1 : 0),
            team: unit.team,
            damage: unit.damage,
            shooterType: unit.type,
            life: 60,
            type: unit.type === 'tank' ? 'shell' : 'rocket',
        });
        // Muzzle flash for tank/bazooka
        const dir = unit.team === 'player' ? 1 : -1;
        spawnParticles(unit.x + dir * unit.w / 2, unit.y, C.explosion3, 4, 2, 6);
    } else {
        // Infantry — instant hit, with RPS modifier if target is a unit
        let dmg = unit.damage;
        if (target && target.type) dmg = applyDamageModifier(unit.type, target.type, dmg);
        target.hp -= dmg;
        spawnParticles(target.x, target.y, C.explosion1, 2, 1, 5);
        // Muzzle flash for infantry
        const dir = unit.team === 'player' ? 1 : -1;
        spawnParticles(unit.x + dir * 14, unit.y - 3, '#ffeb3b', 2, 1, 4);
    }
}

// ---- PARTICLES ----
function spawnParticles(x, y, color, count, minSpeed, maxLife) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = minSpeed + Math.random() * 3;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1,
            life: maxLife + Math.random() * maxLife,
            maxLife: maxLife * 2,
            color,
            size: 2 + Math.random() * 4,
        });
    }
}

function spawnExplosion(x, y, size) {
    spawnParticles(x, y, C.explosion1, size * 3, 1, 15);
    spawnParticles(x, y, C.explosion2, size * 2, 2, 12);
    spawnParticles(x, y, C.explosion3, size, 1, 10);
    spawnParticles(x, y, '#444', size * 2, 1, 20);
    // Debris chunks
    for (let i = 0; i < size * 2; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 4;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 3,
            life: 20 + Math.random() * 20,
            maxLife: 40,
            color: ['#5d4037', '#795548', '#8d6e63', '#333'][Math.floor(Math.random() * 4)],
            size: 3 + Math.random() * 4,
            isDebris: true,
        });
    }
    // Shockwave ring
    particles.push({
        x, y,
        vx: 0, vy: 0,
        life: 12, maxLife: 12,
        color: 'rgba(255,255,255,0.5)',
        size: 5,
        isShockwave: true,
        radius: 5,
    });
    // Screen shake
    if (size >= 3) {
        screenShakeTimer = 10;
    }
}

function triggerScreenShake(intensity, frames) {
    screenShakeTimer = Math.max(screenShakeTimer, frames);
    // The render loop reads screenShakeTimer to compute X/Y jitter.
}

function spawnDustCloud(x, y) {
    for (let i = 0; i < 2; i++) {
        particles.push({
            x: x + (Math.random() - 0.5) * 8, y: y + 5,
            vx: (Math.random() - 0.5) * 0.5, vy: -0.3 - Math.random() * 0.5,
            life: 15 + Math.random() * 10,
            maxLife: 25,
            color: '#c8b08a',
            size: 3 + Math.random() * 3,
            isDust: true,
        });
    }
}

// ---- POWERUPS ----

// (Airstrike / shield / repair button-powerups removed — replaced by
//  collectible map crates and the missile purchase system.)

// ---- UPDATE ----
function update() {
    if (gameState !== 'playing') return;
    frameCount++;

    // Money is earned only from kills + wave clears now — no passive income.
    // (INCOME_RATE is 0 and the variable is preserved for HUD compatibility.)

    // Command Points regenerate up to the cap
    commandPoints = Math.min(cpCap, commandPoints + BALANCE.economy.cpRegenPerFrame);
    enemyCommandPoints = Math.min(cpCap, enemyCommandPoints + BALANCE.economy.cpRegenPerFrame * 1.1);

    // Update floating texts
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const t = floatingTexts[i];
        t.y += t.vy;
        t.life--;
        if (t.life <= 0) floatingTexts.splice(i, 1);
    }

    // Helicopter controls
    let ax = 0, ay = 0;
    if (keys['a'] || keys['arrowleft'])  { ax = -0.4; heli.facing = -1; }
    if (keys['d'] || keys['arrowright']) { ax = 0.4; heli.facing = 1; }
    if (keys['w'] || keys['arrowup'])    ay = -0.5;
    if (keys['s'] || keys['arrowdown'])  ay = 0.3;
    if (keys[' ']) heliShoot();

    heli.vx += ax;
    heli.vy += ay;
    heli.vx *= 0.92;
    heli.vy *= 0.92;
    heli.vy += GRAVITY * 0.3; // slight gravity pull

    heli.x += heli.vx;
    heli.y += heli.vy;

    // Clamp helicopter
    heli.x = Math.max(30, Math.min(WORLD_WIDTH - 30, heli.x));
    heli.y = Math.max(30, Math.min(GROUND_Y - 40, heli.y));
    heli.bladeAngle += 0.4;
    heli.bobTimer += 0.05;
    heli.shootCooldown = Math.max(0, heli.shootCooldown - 1);

    // Auto-drop troops on landing — fires on the airborne -> landed transition
    // so a heli that just lands with cargo immediately disembarks. The state
    // resets when the heli leaves the ground, so picking up + flying away +
    // landing again drops the new batch.
    const isLanded = heli.y >= HELI_LANDING_Y;
    if (isLanded && !heli._wasLanded && heli.carrying.length > 0) {
        helicopterDrop();
    }
    heli._wasLanded = isLanded;
    heli.emptyClickCooldown = Math.max(0, heli.emptyClickCooldown - 1);

    // Camera follow
    const screenX = heli.x - cameraX;
    if (screenX > W - SCROLL_MARGIN) cameraX = heli.x - (W - SCROLL_MARGIN);
    if (screenX < SCROLL_MARGIN) cameraX = heli.x - SCROLL_MARGIN;
    cameraX = Math.max(0, Math.min(WORLD_WIDTH - W, cameraX));

    // Screen shake
    if (screenShakeTimer > 0) {
        screenShakeTimer--;
        screenShakeX = (Math.random() - 0.5) * screenShakeTimer * 0.8;
        screenShakeY = (Math.random() - 0.5) * screenShakeTimer * 0.8;
    } else {
        screenShakeX = 0;
        screenShakeY = 0;
    }

    // Update units
    for (let i = units.length - 1; i >= 0; i--) {
        const u = units[i];
        if (u.hp <= 0) {
            spawnExplosion(u.x, u.y, u.type === 'tank' ? 4 : 2);
            // Bounty: player gains gold for killing enemy units
            if (u.team === 'enemy') {
                const bounty = u.isBoss ? u.bossBounty : (UNIT_DEFS[u.type]?.bounty || 0);
                if (bounty > 0) {
                    money += bounty;
                    spawnFloatingText(u.x, u.y - 30, `+$${bounty}`, '#69f0ae');
                }
                if (u.isBoss) {
                    spawnExplosion(u.x, u.y, 8);
                    triggerScreenShake(12, 30);
                    spawnFloatingText(u.x, u.y - 60, `${u.bossLabel} DOWN`, '#ffd54f');
                }
            }
            units.splice(i, 1);
            continue;
        }
        u.attackCooldown = Math.max(0, u.attackCooldown - 1);
        if (u.walkFrame !== undefined) u.walkFrame += 0.12;

        // Dust when walking
        if (u.state === 'march' && frameCount % 12 === 0) {
            spawnDustCloud(u.x, u.y + u.h / 2);
        }

        // Find nearest enemy
        let nearestEnemy = null;
        let nearestDist = Infinity;

        // Check enemy units
        for (const other of units) {
            if (other.team === u.team || other.hp <= 0) continue;
            const d = Math.abs(other.x - u.x);
            if (d < nearestDist) { nearestDist = d; nearestEnemy = other; }
        }

        // Player ground troops also target enemy AA structures
        if (u.team === 'player') {
            for (const aa of airDefences) {
                if (aa.hp <= 0) continue;
                const d = Math.abs(aa.x - u.x);
                if (d < nearestDist) {
                    nearestDist = d;
                    nearestEnemy = aa;
                }
            }
        }

        // Check enemy base
        const targetBase = u.team === 'player' ? enemyBase : playerBase;
        const baseDist = Math.abs(targetBase.x - u.x);
        if (baseDist < nearestDist) {
            nearestDist = baseDist;
            nearestEnemy = targetBase;
        }

        // Check helicopter (for enemy units)
        if (u.team === 'enemy') {
            const heliDist = Math.sqrt((heli.x - u.x) ** 2 + (heli.y - u.y) ** 2);
            if (heliDist < nearestDist && u.type === 'bazooka') {
                nearestDist = heliDist;
                nearestEnemy = heli;
            }
        }

        // Combat AI: a unit fires whenever it has an in-range target, AND
        // keeps marching forward until it reaches its preferred engagement
        // distance. That way a queue of friendly troops bunches close
        // enough to the front line for everyone in range to fire — not
        // just the leader.
        const inRange = !!nearestEnemy && nearestDist <= u.range;
        const def = UNIT_DEFS[u.type];
        const engageDist = (def && def.engageDist) || 40;
        const shouldHold = inRange && nearestDist <= engageDist;

        if (inRange) {
            u.state = 'fight';
            unitShoot(u, nearestEnemy);
        }

        if (!shouldHold) {
            if (!inRange) u.state = 'march';
            const dir = u.team === 'player' ? 1 : -1;

            // Friendly spacing — line up behind the unit in front.
            let blocked = false;
            for (const other of units) {
                if (other === u || other.team !== u.team) continue;
                const aheadDx = (other.x - u.x) * dir;
                if (aheadDx > 0 && aheadDx < FRIENDLY_SPACING) {
                    blocked = true;
                    u.x = other.x - dir * FRIENDLY_SPACING;
                    break;
                }
            }
            if (!blocked) {
                u.x += u.speed * dir;
            }
        }
    }

    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        // Homing for AA missiles — gentle steering toward heli each frame
        if (b.homing && b.type === 'aamissile') {
            const tx = heli.x - b.x;
            const ty = heli.y - 14 - b.y;
            const td = Math.sqrt(tx * tx + ty * ty) || 1;
            const desiredVx = (tx / td) * 5;
            const desiredVy = (ty / td) * 5;
            // Lerp current velocity toward desired (smooth turn)
            b.vx += (desiredVx - b.vx) * 0.06;
            b.vy += (desiredVy - b.vy) * 0.06;
            // Smoke trail
            if (frameCount % 2 === 0) {
                spawnParticles(b.x, b.y, '#9e9e9e', 1, 0.3, 14);
                spawnParticles(b.x, b.y, '#ff9800', 1, 0.3, 8);
            }
        }
        b.x += b.vx;
        b.y += b.vy;
        if (b.type === 'shell') b.vy += 0.05;
        if (b.type === 'rocket') {
            b.vy += 0.03;
            if (frameCount % 2 === 0) {
                spawnParticles(b.x, b.y, '#aaa', 1, 0.3, 8);
                spawnParticles(b.x - b.vx, b.y - b.vy, '#ff9800', 1, 0.5, 5);
            }
        }
        if (b.type === 'heli') b.vy += 0.35;        // arc into ground troops
        if (b.type === 'heliMissile') {
            b.vy += 0.35;                           // identical arc to bullets
            // Thick smoke + fire trail every frame
            spawnParticles(b.x - b.vx * 0.2, b.y - b.vy * 0.2, '#ff9800', 1, 0.3, 12);
            spawnParticles(b.x - b.vx * 0.4, b.y - b.vy * 0.4, '#9e9e9e', 1, 0.3, 18);
        }
        b.life--;

        if (b.life <= 0) { bullets.splice(i, 1); continue; }

        // Hit detection — units. Hitbox tuned to the VISIBLE sprite, not u.w/h
        // (which is just the logical size used for combat ranges and formation).
        let hit = false;
        for (const u of units) {
            if (u.team === b.team || u.hp <= 0) continue;
            const isTank = u.type === 'tank';
            const scale = u.bossScale || 1;            // boss tanks render bigger, hitbox should too
            const hbHalfW = (isTank ? 28 : 16) * scale;
            const hbHalfH = (isTank ? 18 : 28) * scale;
            const hbCenterY = isTank ? u.y : u.y - 14;
            if (Math.abs(b.x - u.x) < hbHalfW && Math.abs(b.y - hbCenterY) < hbHalfH) {
                // Apply RPS damage modifier when the bullet originates from a unit
                let dmg = b.damage;
                if (b.shooterType) dmg = applyDamageModifier(b.shooterType, u.type, dmg);
                u.hp -= dmg;
                if (b.type === 'heliMissile') {
                    spawnExplosion(b.x, b.y, 4);
                    triggerScreenShake(4, 10);
                }
                // Tank shells splash — small AoE damage to nearby same-side enemies
                if (b.type === 'shell') {
                    for (const other of units) {
                        if (other === u || other.team === b.team) continue;
                        const dx = other.x - b.x, dy = other.y - b.y;
                        if (dx * dx + dy * dy < 50 * 50) {
                            let sd = b.damage * 0.5;
                            if (b.shooterType) sd = applyDamageModifier(b.shooterType, other.type, sd);
                            other.hp -= sd;
                        }
                    }
                    spawnExplosion(b.x, b.y, 2);
                }
                spawnParticles(b.x, b.y, C.explosion1, 3, 1, 8);
                hit = true;
                break;
            }
        }

        // Hit detection — crates. Only player heli rounds (minigun + missile)
        // can damage crates; ground troops can't reach them mechanically.
        if (!hit && b.team === 'player' && (b.type === 'heli' || b.type === 'heliMissile')) {
            for (const c of crates) {
                if (c.state !== 'landed') continue;
                if (Math.abs(b.x - c.x) < CRATE_HIT_X && Math.abs(b.y - (c.y + CRATE_HIT_CY)) < CRATE_HIT_Y) {
                    c.hp--;
                    spawnParticles(b.x, b.y, c.type === 'medi' ? '#ef5350' : '#42a5f5',
                                   4, 1, 8);
                    if (c.hp <= 0) {
                        // Crate consumed — apply effect + start respawn
                        if (c.type === 'medi') {
                            heli.hp = Math.min(heli.maxHp, heli.hp + heli.maxHp * 0.3);
                            spawnFloatingText(c.x, c.y - 30, '+30% HELI HP', '#69f0ae');
                            for (let i = 0; i < 14; i++) {
                                spawnParticles(c.x + (Math.random() - 0.5) * 30,
                                               c.y + (Math.random() - 0.5) * 20,
                                               '#69f0ae', 1, 1, 18);
                            }
                        } else if (c.type === 'shield') {
                            powerupShieldMs = 8000;
                            spawnFloatingText(c.x, c.y - 30, 'BASE SHIELD 8s', '#42a5f5');
                            for (let i = 0; i < 18; i++) {
                                spawnParticles(c.x + (Math.random() - 0.5) * 40,
                                               c.y + (Math.random() - 0.5) * 30,
                                               '#42a5f5', 1, 1, 18);
                            }
                        }
                        spawnExplosion(c.x, c.y, 2);
                        c.state = 'respawning';
                        c.respawnTimer = BALANCE.crates.respawnMs;
                    }
                    hit = true;
                    break;
                }
            }
        }

        // Hit detection — air defence batteries (player projectiles).
        // Ground troop bullets damage AA (RPS modifier applies).
        // Heli MISSILES damage AA at a fixed rate (4 hits to kill).
        // Heli MINIGUN sparks off harmlessly.
        if (!hit && b.team === 'player') {
            for (const aa of airDefences) {
                if (aa.hp <= 0) continue;
                if (Math.abs(b.x - aa.x) < 22 && Math.abs(b.y - (aa.y - 16)) < 24) {
                    const fromGroundUnit = b.shooterType === 'infantry'
                                         || b.shooterType === 'bazooka'
                                         || b.shooterType === 'tank';
                    if (fromGroundUnit) {
                        let dmg = applyDamageModifier(b.shooterType, 'tank', b.damage);
                        aa.hp -= dmg;
                        spawnParticles(b.x, b.y, C.explosion1, 4, 1, 8);
                        if (b.type === 'shell') spawnExplosion(b.x, b.y, 2);
                    } else if (b.type === 'heliMissile') {
                        aa.hp -= b.aaDamage || BALANCE.missiles.damageVsAA;
                        spawnExplosion(b.x, b.y, 4);
                        triggerScreenShake(4, 10);
                    } else {
                        // Spark off — heli minigun harmless to AA
                        spawnParticles(b.x, b.y, '#9e9e9e', 3, 1, 6);
                        spawnParticles(b.x, b.y, '#fff', 2, 1, 4);
                    }
                    hit = true;
                    break;
                }
            }
        }

        // Hit detection — helicopter (enemy bullets, including AA missiles)
        if (!hit && b.team === 'enemy') {
            if (Math.abs(b.x - heli.x) < 25 && Math.abs(b.y - heli.y) < 15) {
                heli.hp -= b.damage;
                spawnParticles(b.x, b.y, C.explosion2, 6, 1, 10);
                if (b.type === 'aamissile') spawnExplosion(b.x, b.y, 3);
                hit = true;
            }
        }

        // Hit detection — bases
        if (!hit) {
            if (b.team === 'player' && Math.abs(b.x - enemyBase.x) < 50 && b.y > GROUND_Y - 80) {
                enemyBase.hp -= b.damage;
                spawnParticles(b.x, b.y, C.explosion1, 3, 1, 6);
                hit = true;
            }
            if (b.team === 'enemy' && Math.abs(b.x - playerBase.x) < 50 && b.y > GROUND_Y - 80) {
                if (powerupShieldMs > 0) {
                    // Absorb the hit — shield sparks
                    spawnParticles(b.x, b.y, '#42a5f5', 6, 1, 10);
                } else {
                    playerBase.hp -= b.damage;
                    spawnParticles(b.x, b.y, C.explosion1, 3, 1, 6);
                }
                hit = true;
            }
        }

        if (hit) { bullets.splice(i, 1); continue; }

        // Off-screen
        if (b.y > GROUND_Y + 20) {
            spawnParticles(b.x, GROUND_Y, C.sand2, 4, 1, 10);
            bullets.splice(i, 1);
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.isShockwave) {
            p.radius += 4;
        } else if (p.isCasing) {
            p.vy += 0.15;
            p.vx *= 0.97;
        } else if (p.isDebris) {
            p.vy += 0.12;
            p.vx *= 0.98;
        } else if (p.isDust) {
            p.vx *= 0.95;
        } else {
            p.vy += 0.05;
            p.vx *= 0.98;
        }
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Clouds drift
    for (const c of clouds) {
        c.x += c.speed;
        if (c.x > WORLD_WIDTH + 100) c.x = -c.w;
    }

    // Birds drift
    for (const bird of birds) {
        bird.x += bird.speed;
        bird.wingPhase += 0.08;
        if (bird.x > WORLD_WIDTH + 50) bird.x = -50;
    }

    // Ambient leaf particles
    if (frameCount % 60 === 0 && ambientParticles.length < 15) {
        ambientParticles.push({
            x: cameraX + Math.random() * W,
            y: -10,
            vx: 0.3 + Math.random() * 0.5,
            vy: 0.5 + Math.random() * 0.8,
            rot: Math.random() * Math.PI * 2,
            rotSpeed: 0.02 + Math.random() * 0.04,
            size: 3 + Math.random() * 3,
            color: ['#66bb6a', '#81c784', '#a5d6a7', '#c8e6c9'][Math.floor(Math.random() * 4)],
        });
    }
    for (let i = ambientParticles.length - 1; i >= 0; i--) {
        const l = ambientParticles[i];
        l.x += l.vx + Math.sin(frameCount * 0.02 + l.rot) * 0.3;
        l.y += l.vy;
        l.rot += l.rotSpeed;
        if (l.y > GROUND_Y) ambientParticles.splice(i, 1);
    }

    // Crates — tick respawn timers and parachute descents
    for (const c of crates) {
        if (c.state === 'respawning') {
            c.respawnTimer -= 16.67;
            if (c.respawnTimer <= 0) {
                c.state = 'parachuting';
                c.parachuteMs = BALANCE.crates.parachuteMs;
                c.y = 40;  // start near top of screen
            }
        } else if (c.state === 'parachuting') {
            c.parachuteMs -= 16.67;
            const fall = (1 - c.parachuteMs / BALANCE.crates.parachuteMs);
            c.y = 40 + fall * (CRATE_LANDED_Y - 40);
            if (c.parachuteMs <= 0) {
                c.state = 'landed';
                c.y = CRATE_LANDED_Y;
                c.hp = BALANCE.crates.hp;
                spawnParticles(c.x, c.y + 8, '#9e9e9e', 6, 1, 14);  // dust on landing
            }
        }
    }

    // Air defence batteries — fire homing missiles at the heli when in range
    for (let i = airDefences.length - 1; i >= 0; i--) {
        const aa = airDefences[i];
        if (aa.hp <= 0) {
            // Big death explosion + bounty
            spawnExplosion(aa.x, aa.y - 10, 5);
            triggerScreenShake(8, 18);
            money += BALANCE.aa.bounty;
            spawnFloatingText(aa.x, aa.y - 50, `+$${BALANCE.aa.bounty}`, '#69f0ae');
            spawnFloatingText(aa.x, aa.y - 30, 'AA DESTROYED', '#ffd54f');
            airDefences.splice(i, 1);
            continue;
        }
        aa.fireTimer++;
        const dxh = heli.x - aa.x;
        const dyh = heli.y - aa.y;
        const distH = Math.sqrt(dxh * dxh + dyh * dyh);
        if (distH < BALANCE.aa.range && aa.fireTimer > BALANCE.aa.fireInterval) {
            aa.fireTimer = 0;
            // Lead the target slightly using heli velocity
            const leadFrames = 30;
            const targetX = heli.x + heli.vx * leadFrames;
            const targetY = heli.y + heli.vy * leadFrames;
            const ldx = targetX - aa.x;
            const ldy = (targetY - 14) - aa.y;
            const ld = Math.sqrt(ldx * ldx + ldy * ldy) || 1;
            const speed = 5;
            bullets.push({
                x: aa.x, y: aa.y - 18,
                vx: (ldx / ld) * speed,
                vy: (ldy / ld) * speed,
                team: 'enemy',
                damage: 18,
                life: 120,
                type: 'aamissile',
                homing: true,
            });
            // Launch flash + smoke
            spawnParticles(aa.x, aa.y - 20, '#ffeb3b', 5, 1, 12);
            spawnParticles(aa.x, aa.y - 10, '#9e9e9e', 8, 1, 18);
        }
    }

    // Level update — single continuous fight, ends when enemy base destroyed.
    const level = LEVEL_COMPOSITIONS[Math.min(currentLevel - 1, TOTAL_LEVELS - 1)];
    if (levelState === 'active') {
        enemySpawnTimer++;
        if (enemySpawnTimer > level.spawnEvery) {
            enemySpawnTimer = 0;
            const type = level.types[Math.floor(Math.random() * level.types.length)];
            const cpCost = UNIT_DEFS[type].cpCost;
            if (enemyCommandPoints >= cpCost) {
                spawnEnemyUnit(type);
                enemyCommandPoints -= cpCost;
            }
        }
        // Boss appears once per level on elite levels, after a short delay so
        // the player has a moment to scout the regular enemies first.
        if (level.boss && !bossSpawnedThisLevel) {
            bossSpawnTimer = (bossSpawnTimer || 0) + 16.67;
            if (bossSpawnTimer > 8000) {
                spawnBossUnit(level.boss);
                bossSpawnedThisLevel = true;
            }
        }
    }
    // 'complete' state is purely UI-driven — shop overlay advances to the
    // next level via the READY button.
    // Decay shield powerup
    if (powerupShieldMs > 0) powerupShieldMs = Math.max(0, powerupShieldMs - 16.67);
    // Helicopter reload: empty magazine → wait BALANCE.heli.reloadMs → full refill.
    if (heli.reloadMs > 0) {
        heli.reloadMs = Math.max(0, heli.reloadMs - 16.67);
        if (heli.reloadMs === 0 && heli.ammo === 0) {
            heli.ammo = heli.maxAmmo;
            spawnFloatingText(heli.x, heli.y - 40, 'RELOADED', '#ffd54f');
            for (let i = 0; i < 14; i++) {
                spawnParticles(heli.x + (Math.random() - 0.5) * 50,
                               heli.y + (Math.random() - 0.5) * 30,
                               '#ffeb3b', 1, 1, 14);
            }
        }
    }

    // Win/Lose conditions
    if (enemyBase.hp <= 0 && levelState === 'active') {
        // Level complete — bonus, refill CP, then open the shop overlay.
        money += 100 + currentLevel * 50;   // bigger bonus on higher levels
        commandPoints = cpCap;
        spawnFloatingText(enemyBase.x, GROUND_Y - 100,
                          `LEVEL ${currentLevel} COMPLETE`, '#69f0ae');
        triggerScreenShake(10, 30);
        spawnExplosion(enemyBase.x, GROUND_Y - 40, 8);
        if (currentLevel >= TOTAL_LEVELS) {
            // Cleared the final level = full victory
            gameState = 'gameover';
            gameOverResult = 'win';
            document.getElementById('game-over-text').textContent = 'VICTORY!';
            document.getElementById('game-over-text').style.color = '#4caf50';
            document.getElementById('game-over-screen').style.display = 'flex';
        } else {
            levelState = 'complete';
        }
    }
    if (playerBase.hp <= 0 || heli.hp <= 0) {
        gameState = 'gameover';
        gameOverResult = 'lose';
        document.getElementById('game-over-text').textContent = 'DEFEATED!';
        document.getElementById('game-over-text').style.color = '#f44336';
        document.getElementById('game-over-screen').style.display = 'flex';
    }
}

// ============================================================
// RENDERING
// ============================================================

// Helper: rounded rect
function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
}

function drawSky() {
    const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    grad.addColorStop(0, '#1e88e5');
    grad.addColorStop(0.3, '#42a5f5');
    grad.addColorStop(0.6, '#81d4fa');
    grad.addColorStop(1, '#e1f5fe');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Sun glow
    const sunX = W * 0.8;
    const sunY = 60;
    const sunGrad = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 150);
    sunGrad.addColorStop(0, 'rgba(255,245,157,0.9)');
    sunGrad.addColorStop(0.2, 'rgba(255,238,88,0.4)');
    sunGrad.addColorStop(0.5, 'rgba(255,183,77,0.1)');
    sunGrad.addColorStop(1, 'rgba(255,183,77,0)');
    ctx.fillStyle = sunGrad;
    ctx.fillRect(0, 0, W, 300);

    // Sun disc
    ctx.fillStyle = '#fff9c4';
    ctx.shadowBlur = 30;
    ctx.shadowColor = '#ffee58';
    ctx.beginPath();
    ctx.arc(sunX, sunY, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
}

function drawBackgroundMountains() {
    // Sprite version: tile the mountain_bg image across the world at slow parallax.
    const img = SPRITES.mountain_bg;
    if (img && img.complete && img.naturalWidth > 0) {
        const tileH = 220;
        const aspect = img.naturalWidth / img.naturalHeight;
        const tileW = tileH * aspect;
        const baseY = GROUND_Y - tileH + 40; // mountains sit just above the beach
        const parallax = 0.15;
        // Compute starting tile so the pattern wraps relative to camera
        const offset = -((cameraX * parallax) % tileW);
        for (let x = offset - tileW; x < W + tileW; x += tileW) {
            ctx.drawImage(img, x, baseY, tileW, tileH);
        }
        return;
    }
    // Fallback: procedural blobs
    for (const m of bgMountains) {
        const sx = m.x - cameraX * 0.15;
        if (sx < -m.w || sx > W + m.w) continue;
        const grad = ctx.createLinearGradient(sx, GROUND_Y - m.h - 100, sx, GROUND_Y - 100);
        grad.addColorStop(0, m.color2);
        grad.addColorStop(1, m.color1);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(sx - m.w / 2, GROUND_Y - 100);
        ctx.quadraticCurveTo(sx - m.w * 0.2, GROUND_Y - m.h - 100, sx, GROUND_Y - m.h - 80);
        ctx.quadraticCurveTo(sx + m.w * 0.3, GROUND_Y - m.h - 90, sx + m.w / 2, GROUND_Y - 100);
        ctx.closePath();
        ctx.fill();
    }
}

function drawBackgroundTrees() {
    for (const t of bgTrees) {
        const sx = t.x - cameraX * 0.3;
        if (sx < -t.w - 20 || sx > W + 20) continue;
        // Simplified distant tree
        const green = t.shade > 0.5 ? '#388e3c' : '#2e7d32';
        ctx.fillStyle = green;
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.ellipse(sx, GROUND_Y - 40 - t.h * 0.4, t.w * 0.6, t.h * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#4e342e';
        ctx.fillRect(sx - 2, GROUND_Y - 40 - t.h * 0.1, 4, t.h * 0.3);
        ctx.globalAlpha = 1;
    }
}

function drawClouds() {
    const img = SPRITES.cloud_1;
    const useSprite = img && img.complete && img.naturalWidth > 0;
    for (const c of clouds) {
        const sx = c.x - cameraX * 0.3; // parallax
        if (sx < -c.w - 50 || sx > W + 50) continue;
        if (useSprite) {
            const aspect = img.naturalWidth / img.naturalHeight;
            const cw = c.w * 1.2;
            const ch = cw / aspect;
            ctx.globalAlpha = 0.92;
            ctx.drawImage(img, sx - cw / 2, c.y - ch / 2, cw, ch);
            ctx.globalAlpha = 1;
        } else {
            drawCloud(sx, c.y, c.w);
        }
    }
}

function drawCloud(x, y, w) {
    const h = w * 0.4;
    ctx.save();
    ctx.shadowBlur = 8;
    ctx.shadowColor = 'rgba(0,0,0,0.05)';
    ctx.shadowOffsetY = 4;
    // Cloud body with gradient
    const cGrad = ctx.createRadialGradient(x, y - h * 0.1, w * 0.1, x, y + h * 0.1, w * 0.6);
    cGrad.addColorStop(0, 'rgba(255,255,255,0.95)');
    cGrad.addColorStop(1, 'rgba(230,240,255,0.6)');
    ctx.fillStyle = cGrad;
    ctx.beginPath();
    ctx.ellipse(x, y, w * 0.5, h * 0.4, 0, 0, Math.PI * 2);
    ctx.ellipse(x - w * 0.25, y + h * 0.1, w * 0.3, h * 0.3, 0, 0, Math.PI * 2);
    ctx.ellipse(x + w * 0.25, y + h * 0.05, w * 0.35, h * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawBirds() {
    ctx.strokeStyle = '#37474f';
    ctx.lineWidth = 1.5;
    for (const bird of birds) {
        const sx = bird.x - cameraX * 0.2;
        if (sx < -20 || sx > W + 20) continue;
        const wing = Math.sin(bird.wingPhase) * bird.size;
        ctx.beginPath();
        ctx.moveTo(sx - bird.size * 2, bird.y + wing);
        ctx.quadraticCurveTo(sx - bird.size * 0.5, bird.y - wing * 0.5, sx, bird.y);
        ctx.quadraticCurveTo(sx + bird.size * 0.5, bird.y - wing * 0.5, sx + bird.size * 2, bird.y + wing);
        ctx.stroke();
    }
}

function drawOcean() {
    // Beach/sand area with texture
    const sandGrad = ctx.createLinearGradient(0, GROUND_Y - 20, 0, GROUND_Y + 15);
    sandGrad.addColorStop(0, '#ffe0b2');
    sandGrad.addColorStop(0.5, '#ffcc80');
    sandGrad.addColorStop(1, '#ffb74d');
    ctx.fillStyle = sandGrad;
    ctx.fillRect(0, GROUND_Y - 5, W, 30);

    // Sand texture dots
    ctx.fillStyle = 'rgba(210,170,110,0.4)';
    for (let i = 0; i < 80; i++) {
        const sx = ((i * 37 + Math.floor(cameraX * 0.5)) % W);
        const sy = GROUND_Y - 2 + (i * 7 % 25);
        ctx.fillRect(sx, sy, 1, 1);
    }

    // Water with multi-layer gradient
    const waterGrad = ctx.createLinearGradient(0, WATER_Y, 0, H);
    waterGrad.addColorStop(0, '#00acc1');
    waterGrad.addColorStop(0.3, '#0288d1');
    waterGrad.addColorStop(0.6, '#0277bd');
    waterGrad.addColorStop(1, '#01579b');
    ctx.fillStyle = waterGrad;
    ctx.fillRect(0, WATER_Y, W, H - WATER_Y);

    // Multiple wave layers
    for (let layer = 0; layer < 3; layer++) {
        const wAlpha = [0.3, 0.25, 0.2][layer];
        const wOffset = [0, 15, 30][layer];
        const wSpeed = [2, 1.5, 1][layer];
        const wAmp = [4, 3, 2][layer];
        ctx.strokeStyle = `rgba(255,255,255,${wAlpha})`;
        ctx.lineWidth = 2 - layer * 0.5;
        ctx.beginPath();
        for (let x = 0; x < W; x += 3) {
            const wy = WATER_Y + wOffset + Math.sin((x + frameCount * wSpeed + cameraX) * 0.02) * wAmp;
            if (x === 0) ctx.moveTo(x, wy); else ctx.lineTo(x, wy);
        }
        ctx.stroke();
    }

    // Foam near shore
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    for (let x = 0; x < W; x += 8) {
        const foamY = WATER_Y - 2 + Math.sin((x + frameCount * 1.5 + cameraX * 0.8) * 0.04) * 2;
        ctx.beginPath();
        ctx.ellipse(x, foamY, 4 + Math.sin(x * 0.1) * 2, 2, 0, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawGround() {
    // Main ground with richer gradient
    const groundGrad = ctx.createLinearGradient(0, GROUND_Y - 25, 0, WATER_Y);
    groundGrad.addColorStop(0, '#7cb342');
    groundGrad.addColorStop(0.15, '#66bb6a');
    groundGrad.addColorStop(0.4, '#4caf50');
    groundGrad.addColorStop(0.7, '#43a047');
    groundGrad.addColorStop(1, '#d4a056');
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, GROUND_Y - 5, W, WATER_Y - GROUND_Y + 5);

    // Grass tufts with varied height
    for (let x = 0; x < W; x += 8) {
        const wx = x + cameraX;
        const h = 3 + Math.sin(wx * 0.5) * 3 + Math.sin(wx * 0.17) * 2;
        const sway = Math.sin(frameCount * 0.03 + wx * 0.1) * 1.5;
        const shade = Math.sin(wx * 0.3) > 0 ? '#4caf50' : '#388e3c';
        ctx.strokeStyle = shade;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x, GROUND_Y - 5);
        ctx.quadraticCurveTo(x + sway * 0.5, GROUND_Y - 5 - h * 0.6, x + sway, GROUND_Y - 5 - h);
        ctx.stroke();
    }

    // Rocks scattered
    for (const r of rocks) {
        const sx = r.x - cameraX;
        if (sx < -10 || sx > W + 10) continue;
        const rGrad = ctx.createRadialGradient(sx - 1, GROUND_Y - 2 - r.yOff - r.size * 0.3, 1, sx, GROUND_Y - r.yOff, r.size * 1.2);
        rGrad.addColorStop(0, `rgba(180,170,160,${r.shade + 0.2})`);
        rGrad.addColorStop(1, `rgba(120,110,100,${r.shade})`);
        ctx.fillStyle = rGrad;
        ctx.beginPath();
        ctx.ellipse(sx, GROUND_Y - 2 - r.yOff, r.size * 1.2, r.size * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();
        // Rock outline
        ctx.strokeStyle = `rgba(80,70,60,${r.shade * 0.5})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
    }
}

function drawFlowers() {
    for (const f of flowers) {
        const sx = f.x - cameraX;
        if (sx < -10 || sx > W + 10) continue;
        const fy = GROUND_Y - 5 - f.size;

        // Stem
        ctx.strokeStyle = '#388e3c';
        ctx.lineWidth = 1.5;
        const sway = Math.sin(frameCount * 0.03 + f.x * 0.1) * 1;
        ctx.beginPath();
        ctx.moveTo(sx, GROUND_Y - 5);
        ctx.quadraticCurveTo(sx + sway * 0.5, fy + f.size * 0.5, sx + sway, fy);
        ctx.stroke();

        if (f.type < 2) {
            // Multi-petal flower
            ctx.fillStyle = f.color;
            for (let p = 0; p < f.petalCount; p++) {
                const angle = (p / f.petalCount) * Math.PI * 2;
                ctx.beginPath();
                ctx.ellipse(
                    sx + sway + Math.cos(angle) * f.size * 0.4,
                    fy + Math.sin(angle) * f.size * 0.4,
                    f.size * 0.4, f.size * 0.25,
                    angle, 0, Math.PI * 2
                );
                ctx.fill();
            }
            // Center
            ctx.fillStyle = '#ffeb3b';
            ctx.beginPath();
            ctx.arc(sx + sway, fy, f.size * 0.25, 0, Math.PI * 2);
            ctx.fill();
        } else if (f.type < 4) {
            // Bush
            const bGrad = ctx.createRadialGradient(sx + sway, fy, 1, sx + sway, fy + 2, f.size * 1.5);
            bGrad.addColorStop(0, '#66bb6a');
            bGrad.addColorStop(0.5, '#43a047');
            bGrad.addColorStop(1, '#2e7d32');
            ctx.fillStyle = bGrad;
            ctx.beginPath();
            ctx.ellipse(sx + sway, fy + f.size * 0.3, f.size * 1.2, f.size * 0.8, 0, 0, Math.PI * 2);
            ctx.fill();
            // Bush highlight
            ctx.fillStyle = 'rgba(129,199,132,0.4)';
            ctx.beginPath();
            ctx.ellipse(sx + sway - f.size * 0.3, fy, f.size * 0.5, f.size * 0.4, 0, 0, Math.PI * 2);
            ctx.fill();
        } else {
            // Tropical flower with bigger petals
            ctx.fillStyle = f.color;
            ctx.beginPath();
            ctx.arc(sx + sway, fy, f.size * 0.6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.globalAlpha = 0.3;
            ctx.beginPath();
            ctx.arc(sx + sway - f.size * 0.15, fy - f.size * 0.15, f.size * 0.25, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }
}

function drawScenery() {
    // Draw sprite-based bushes and rocks scattered along the beach.
    for (const s of scenery) {
        const sx = s.x - cameraX;
        if (sx < -80 || sx > W + 80) continue;
        const img = SPRITES[s.type];
        if (!img || !img.complete || img.naturalWidth === 0) continue;
        const baseH = s.type === 'bush_1' ? 38 : 22;
        const h = baseH * s.scale;
        const aspect = img.naturalWidth / img.naturalHeight;
        const w = h * aspect;
        // Plant slightly into the sand for consistency with trees and bases
        const anchorY = GROUND_Y + 12;
        ctx.save();
        ctx.translate(sx, anchorY);
        if (s.flip) ctx.scale(-1, 1);
        ctx.drawImage(img, -w / 2, -h, w, h);
        ctx.restore();
    }
}

function drawPalmTree(tree) {
    const sx = tree.x - cameraX;
    if (sx < -80 || sx > W + 80) return;

    // Sprite version: use one of two palm tree variants, deterministic per tree.
    const variant = (tree.swayOffset > Math.PI) ? 'palm_tree_2' : 'palm_tree_1';
    const img = SPRITES[variant];
    if (img && img.complete && img.naturalWidth > 0) {
        const sway = Math.sin(frameCount * 0.012 + tree.swayOffset) * 0.04;
        const aspect = img.naturalWidth / img.naturalHeight;
        const drawH = tree.height + 50;
        const drawW = drawH * aspect;
        // Anchor the trunk base into the SAND, not the grass line.
        // The grass strip runs y=555..590; sand starts ~y=575.
        const anchorY = GROUND_Y + 16;  // ~y=576 — base of trunk planted in sand
        ctx.save();
        ctx.translate(sx, anchorY);
        ctx.rotate(sway);
        ctx.drawImage(img, -drawW / 2, -drawH, drawW, drawH);
        ctx.restore();
        return;
    }

    // ---- Fallback: procedural drawing ----
    const sway = Math.sin(frameCount * 0.01 + tree.swayOffset) * 3;
    const topX = sx + tree.lean * 20 + sway;
    const topY = GROUND_Y - tree.height;
    const tw = tree.trunkWidth;

    // Trunk with cross-hatch bark
    ctx.save();
    // Trunk gradient
    const trunkGrad = ctx.createLinearGradient(sx - tw, GROUND_Y, topX - tw / 2, topY);
    trunkGrad.addColorStop(0, '#5d4037');
    trunkGrad.addColorStop(0.3, '#795548');
    trunkGrad.addColorStop(0.7, '#6d4c41');
    trunkGrad.addColorStop(1, '#8d6e63');

    // Draw trunk as thick path
    ctx.strokeStyle = trunkGrad;
    ctx.lineWidth = tw;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sx, GROUND_Y - 5);
    ctx.quadraticCurveTo(sx + tree.lean * 40 + sway * 0.5, GROUND_Y - tree.height * 0.5,
                         topX, topY);
    ctx.stroke();

    // Cross-hatch bark pattern
    ctx.strokeStyle = 'rgba(62,39,25,0.4)';
    ctx.lineWidth = 1;
    const segments = Math.floor(tree.height / 8);
    for (let s = 0; s < segments; s++) {
        const t = s / segments;
        const bx = sx + (topX - sx) * t + (tree.lean * 40 + sway * 0.5) * t * (1 - t) * 2 * (1 - t);
        const by = GROUND_Y - 5 - tree.height * t;
        const bw = tw * (1 - t * 0.3) * 0.5;
        ctx.beginPath();
        ctx.moveTo(bx - bw, by);
        ctx.lineTo(bx + bw, by);
        ctx.stroke();
    }
    ctx.restore();

    // Coconuts
    ctx.fillStyle = '#5d4037';
    ctx.strokeStyle = '#4e342e';
    ctx.lineWidth = 1;
    for (let ci = 0; ci < 3; ci++) {
        const cx = topX - 5 + ci * 5;
        const cy = topY + 3 + (ci === 1 ? -2 : 0);
        ctx.beginPath();
        ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    }

    // Fronds with individual leaf shapes
    for (let j = 0; j < tree.fronds; j++) {
        const angle = (j / tree.fronds) * Math.PI * 2 + sway * 0.02;
        const fLen = 35 + Math.random() * 5;

        // Main frond stem
        const fColor = j % 2 === 0 ? '#33691e' : '#558b2f';
        const fLight = j % 2 === 0 ? '#4caf50' : '#66bb6a';

        ctx.strokeStyle = fColor;
        ctx.lineWidth = 2.5;

        const endX = topX + Math.cos(angle) * fLen;
        const endY = topY + Math.sin(angle) * fLen * 0.5 - 8;
        const ctrlX = topX + Math.cos(angle) * fLen * 0.6;
        const ctrlY = topY - 18 + Math.sin(angle) * fLen * 0.2;

        ctx.beginPath();
        ctx.moveTo(topX, topY - 3);
        ctx.quadraticCurveTo(ctrlX, ctrlY, endX, endY);
        ctx.stroke();

        // Individual leaves along the frond
        const leafCount = 7;
        for (let l = 0; l < leafCount; l++) {
            const lt = (l + 1) / (leafCount + 1);
            const lx = topX + (ctrlX - topX) * lt * 2 * (1 - lt) + (endX - topX) * lt * lt + (topX - topX) * (1 - lt) * (1 - lt);
            const ly = (topY - 3) + (ctrlY - topY + 3) * lt * 2 * (1 - lt) + (endY - topY + 3) * lt * lt;
            const leafAngle = angle + (l % 2 === 0 ? 0.5 : -0.5);
            const leafLen = 6 + (1 - lt) * 6;

            ctx.fillStyle = l % 2 === 0 ? fColor : fLight;
            ctx.beginPath();
            ctx.ellipse(
                lx + Math.cos(leafAngle) * leafLen * 0.5,
                ly + Math.sin(leafAngle) * leafLen * 0.3,
                leafLen * 0.5, 2.5,
                leafAngle, 0, Math.PI * 2
            );
            ctx.fill();
        }
    }
}

function drawBase(base, team) {
    const sx = base.x - cameraX;
    if (sx < -120 || sx > W + 120) return;
    const by = GROUND_Y - 5;
