            ctx.arc(sx - b.vx * 3, b.y - b.vy * 3, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(80,80,80,0.15)';
            ctx.beginPath();
            ctx.arc(sx - b.vx * 6, b.y - b.vy * 6, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#444';
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(sx, b.y, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        } else if (b.type === 'rocket') {
            // Rocket with smoke trail
            ctx.fillStyle = '#ef5350';
            ctx.shadowBlur = 6;
            ctx.shadowColor = '#ff5722';
            ctx.beginPath();
            ctx.arc(sx, b.y, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            // Rocket tip
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(sx + b.vx * 0.3, b.y + b.vy * 0.3, 1.5, 0, Math.PI * 2);
            ctx.fill();
            // Smoke trail
            spawnParticles(b.x, b.y, '#aaa', 1, 0.3, 8);
            spawnParticles(b.x - b.vx, b.y - b.vy, '#ff9800', 1, 0.5, 5);
        }
    }
}

function drawParticles() {
    for (const p of particles) {
        const sx = p.x - cameraX;
        if (sx < -20 || sx > W + 20) continue;
        const alpha = p.life / p.maxLife;

        if (p.isShockwave) {
            ctx.globalAlpha = alpha * 0.5;
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(sx, p.y, p.radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 1;
            continue;
        }

        if (p.isCasing) {
            ctx.globalAlpha = alpha;
            ctx.fillStyle = '#d4a017';
            ctx.fillRect(sx - 1, p.y - 1.5, 2, 3);
            ctx.globalAlpha = 1;
            continue;
        }

        if (p.isDust) {
            ctx.globalAlpha = alpha * 0.4;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(sx, p.y, p.size * (1.5 - alpha * 0.5), 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
            continue;
        }

        if (p.isDebris) {
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color;
            ctx.save();
            ctx.translate(sx, p.y);
            ctx.rotate(p.life * 0.3);
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
            ctx.restore();
            ctx.globalAlpha = 1;
            continue;
        }

        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.shadowBlur = p.size * alpha * 2;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(sx, p.y, p.size * alpha, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
}

function drawAmbientParticles() {
    for (const l of ambientParticles) {
        const sx = l.x - cameraX;
        if (sx < -10 || sx > W + 10) continue;
        ctx.save();
        ctx.translate(sx, l.y);
        ctx.rotate(l.rot);
        ctx.fillStyle = l.color;
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.ellipse(0, 0, l.size, l.size * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.restore();
    }
}

function drawHUD() {
    // === BOOM BEACH STYLE HUD ===

    // Top bar — wooden/metal panel
    ctx.save();
    const hudGrad = ctx.createLinearGradient(0, 0, 0, 56);
    hudGrad.addColorStop(0, 'rgba(62,39,25,0.9)');
    hudGrad.addColorStop(0.5, 'rgba(78,52,46,0.85)');
    hudGrad.addColorStop(1, 'rgba(50,30,20,0.9)');
    ctx.fillStyle = hudGrad;
    roundRect(0, 0, W, 54, 0);
    ctx.fill();
    // Metal border bottom
    ctx.fillStyle = '#5d4037';
    ctx.fillRect(0, 52, W, 3);
    ctx.fillStyle = 'rgba(141,110,99,0.5)';
    ctx.fillRect(0, 52, W, 1);
    // Wood grain texture
    ctx.strokeStyle = 'rgba(93,64,55,0.2)';
    ctx.lineWidth = 1;
    for (let gy = 5; gy < 50; gy += 12) {
        ctx.beginPath();
        ctx.moveTo(0, gy);
        for (let gx = 0; gx < W; gx += 20) {
            ctx.lineTo(gx, gy + Math.sin(gx * 0.01) * 2);
        }
        ctx.stroke();
    }

    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'left';

    // Money panel
    drawHUDPanel(8, 6, 105, 24);
    ctx.fillStyle = '#ffd54f';
    ctx.shadowBlur = 2;
    ctx.shadowColor = 'rgba(255,193,7,0.5)';
    ctx.fillText(`$ ${Math.floor(money)}`, 36, 24);
    ctx.shadowBlur = 0;
    // Coin icon
    ctx.fillStyle = '#ffc107';
    ctx.beginPath();
    ctx.arc(23, 18, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#f57f17';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#f57f17';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('$', 23, 22);

    // Player base HP panel
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'left';
    drawHUDPanel(120, 6, 170, 24);
    ctx.fillStyle = '#81d4fa';
    ctx.fillText(`Base: ${Math.max(0, Math.ceil(playerBase.hp))}/${playerBase.maxHp}`, 132, 23);

    // Heli HP panel
    drawHUDPanel(298, 6, 160, 24);
    ctx.fillStyle = heli.hp > 50 ? '#a5d6a7' : '#ef9a9a';
    ctx.fillText(`Heli HP: ${Math.max(0, Math.ceil(heli.hp))}/${heli.maxHp}`, 308, 23);

    // Carrying panel
    if (heli.carrying.length > 0) {
        drawHUDPanel(466, 6, 130, 24);
        ctx.fillStyle = '#fff';
        ctx.fillText(`Carry: ${heli.carrying.length}/${heli.maxCarry}`, 476, 23);
    }

    // Enemy base HP panel
    ctx.textAlign = 'right';
    drawHUDPanel(W - 215, 6, 205, 24);
    ctx.fillStyle = '#ef9a9a';
    ctx.fillText(`Enemy Base: ${Math.max(0, Math.ceil(enemyBase.hp))}/${enemyBase.maxHp}`, W - 18, 23);

    // Spawn buttons — Boom Beach deploy style
    ctx.textAlign = 'center';
    ctx.font = 'bold 11px sans-serif';
    const btnY = 36;
    const btnDefs = [
        { key: '1', label: 'Infantry', cost: 10, x: W / 2 - 100 },
        { key: '2', label: 'Tank', cost: 40, x: W / 2 },
        { key: '3', label: 'Bazooka', cost: 25, x: W / 2 + 100 },
    ];
    for (const btn of btnDefs) {
        const canAfford = money >= btn.cost;
        const bx = btn.x - 42;
        // Button background
        const btnGrad = ctx.createLinearGradient(bx, btnY, bx, btnY + 16);
        if (canAfford) {
            btnGrad.addColorStop(0, '#43a047');
            btnGrad.addColorStop(1, '#2e7d32');
        } else {
            btnGrad.addColorStop(0, '#616161');
            btnGrad.addColorStop(1, '#424242');
        }
        ctx.fillStyle = btnGrad;
        roundRect(bx, btnY, 84, 16, 4);
        ctx.fill();
        ctx.strokeStyle = canAfford ? '#1b5e20' : '#333';
        ctx.lineWidth = 1;
        roundRect(bx, btnY, 84, 16, 4);
        ctx.stroke();
        // Button shine
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.fillRect(bx + 2, btnY + 1, 80, 6);
        // Button text
        ctx.fillStyle = canAfford ? '#fff' : '#999';
        ctx.fillText(`[${btn.key}] ${btn.label} $${btn.cost}`, btn.x, btnY + 12);
    }

    // E key hint
    ctx.font = '10px sans-serif';
    ctx.fillStyle = '#aaa';
    ctx.fillText('[E] Pick/Drop', W / 2 + 220, btnY + 12);

    // Minimap — Boom Beach style with terrain
    const mmW = 200;
    const mmH = 24;
    const mmX = W / 2 - mmW / 2;
    const mmY = 4;
    // Minimap border (wooden frame)
    ctx.fillStyle = '#5d4037';
    roundRect(mmX - 3, mmY - 3, mmW + 6, mmH + 6, 4);
    ctx.fill();
    ctx.fillStyle = '#8d6e63';
    roundRect(mmX - 2, mmY - 2, mmW + 4, mmH + 4, 3);
    ctx.fill();
    // Minimap background with terrain colors
    const mmTerrain = ctx.createLinearGradient(mmX, mmY, mmX, mmY + mmH);
    mmTerrain.addColorStop(0, '#81d4fa');
    mmTerrain.addColorStop(0.5, '#66bb6a');
    mmTerrain.addColorStop(0.8, '#ffcc80');
    mmTerrain.addColorStop(1, '#0288d1');
    ctx.fillStyle = mmTerrain;
    roundRect(mmX, mmY, mmW, mmH, 2);
    ctx.fill();

    // Units on minimap
    for (const u of units) {
        const mx = mmX + (u.x / WORLD_WIDTH) * mmW;
        ctx.fillStyle = u.team === 'player' ? '#1565c0' : '#c62828';
        const mh = u.type === 'tank' ? 10 : 6;
        const mw = u.type === 'tank' ? 3 : 2;
        ctx.fillRect(mx - mw / 2, mmY + (mmH - mh) / 2, mw, mh);
    }

    // Heli on minimap
    const heliMX = mmX + (heli.x / WORLD_WIDTH) * mmW;
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 3;
    ctx.shadowColor = '#fff';
    ctx.fillRect(heliMX - 2, mmY + 3, 4, 4);
    ctx.shadowBlur = 0;

    // Bases on minimap
    ctx.fillStyle = '#1e88e5';
    ctx.fillRect(mmX + (playerBase.x / WORLD_WIDTH) * mmW - 3, mmY + 2, 6, mmH - 4);
    ctx.fillStyle = '#c62828';
    ctx.fillRect(mmX + (enemyBase.x / WORLD_WIDTH) * mmW - 3, mmY + 2, 6, mmH - 4);

    // Camera viewport on minimap
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 1;
    ctx.strokeRect(mmX + (cameraX / WORLD_WIDTH) * mmW, mmY, (W / WORLD_WIDTH) * mmW, mmH);

    ctx.restore();
}

function drawHUDPanel(x, y, w, h) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    roundRect(x, y, w, h, 4);
    ctx.fill();
    ctx.strokeStyle = 'rgba(141,110,99,0.3)';
    ctx.lineWidth = 1;
    roundRect(x, y, w, h, 4);
    ctx.stroke();
}

// ---- MAIN RENDER ----
function render() {
    ctx.clearRect(0, 0, W, H);

    // Apply screen shake
    ctx.save();
    ctx.translate(screenShakeX, screenShakeY);

    drawSky();
    drawBackgroundMountains();
    drawBirds();
    drawClouds();
    drawBackgroundTrees();

    // Background palm trees (behind ground)
    for (const tree of palmTrees) {
        drawPalmTree(tree);
    }

    drawGround();
    drawFlowers();
    drawOcean();

    // Bases
    drawBase(playerBase, 'player');
    drawBase(enemyBase, 'enemy');

    // Units
    for (const u of units) {
        drawUnit(u);
    }

    // Bullets
    drawBullets();

    // Helicopter
    drawHelicopter();

    // Particles (on top)
    drawParticles();
    drawAmbientParticles();

    ctx.restore(); // End screen shake

    // HUD (not affected by shake)
    drawHUD();
}

// ---- GAME LOOP ----
function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

// Start the loop (rendering menu background)
loadSprites();
initGame();
gameState = 'menu';
gameLoop();

</script>
</body>
</html>
