// ---- MAIN RENDER ----
function render() {
    ctx.clearRect(0, 0, W, H);

    // Apply screen shake
    ctx.save();
    ctx.translate(screenShakeX, screenShakeY);

    drawSky();
    drawBackgroundMountains();
    drawBirds();
    drawClouds();
    drawBackgroundTrees();

    // Background palm trees (behind ground)
    for (const tree of palmTrees) {
        drawPalmTree(tree);
    }

    drawGround();
    drawFlowers();
    drawScenery();
    drawOcean();

    // Bases
    drawBase(playerBase, 'player');
    drawBase(enemyBase, 'enemy');

    // Air defence batteries
    for (const aa of airDefences) drawAirDefence(aa);

    // Crates (drawn after structures so they sit on top of the beach)
    for (const c of crates) drawCrate(c);

    // Units
    for (const u of units) {
        drawUnit(u);
    }

    // Bullets
    drawBullets();

    // Helicopter
    drawHelicopter();

    // Particles (on top)
    drawParticles();
    drawAmbientParticles();
    drawFloatingTexts();

    ctx.restore(); // End screen shake

    // HUD (not affected by shake)
    drawHUD();
}

// ---- GAME LOOP ----
function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

// =====================================================================
// MOBILE / TOUCH SUPPORT
// =====================================================================

// Detect touch capability
const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
if (IS_TOUCH) document.body.classList.add('touch');

// Fit the canvas-sized stage to the viewport while preserving aspect.
function fitStage() {
    const stage = document.getElementById('game-stage');
    if (!stage) return;
    const sw = window.innerWidth;
    const sh = window.innerHeight;
    const scale = Math.min(sw / 1200, sh / 700);
    stage.style.transform = `scale(${scale})`;
    // Update portrait warning class
    const portrait = sh > sw;
    document.body.classList.toggle('portrait', portrait);
}
window.addEventListener('resize', fitStage);
window.addEventListener('orientationchange', fitStage);
fitStage();

// Try to enter fullscreen + lock to landscape on touch devices. The lock
// only works inside fullscreen on most browsers, and even then iOS Safari
// refuses, so failures are silently swallowed.
async function tryLockLandscape() {
    if (!IS_TOUCH) return;
    try {
        const el = document.documentElement;
        if (el.requestFullscreen && !document.fullscreenElement) {
            await el.requestFullscreen().catch(() => {});
        }
        if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock('landscape').catch(() => {});
        }
    } catch (e) { /* silent */ }
}

// ---- Virtual joystick ----
// Translates touch position on the joystick into WASD key state.
(function initJoystick() {
    const stick = document.getElementById('joystick');
    const knob  = document.getElementById('joystick-knob');
    if (!stick || !knob) return;

    const maxRadius = 60;            // knob travel limit
    const deadZone  = 0.18;          // joystick neutral zone fraction
    let activeId = null;
    let centerX = 0, centerY = 0;
    // Track keys the joystick has set so release only clears its own state —
    // hybrid devices with both touch and a physical keyboard keep their other keys.
    const jsKeys = new Set();

    function jsSet(key) {
        if (!keys[key]) { keys[key] = true; jsKeys.add(key); }
    }
    function clearKeys() {
        for (const k of jsKeys) keys[k] = false;
        jsKeys.clear();
    }

    function applyVector(nx, ny) {
        clearKeys();
        const mag = Math.sqrt(nx * nx + ny * ny);
        if (mag < deadZone) return;
        const ang = Math.atan2(ny, nx);
        const deg = ang * 180 / Math.PI;
        if (deg >= -112.5 && deg < -67.5)  jsSet('w');
        if (deg >= 67.5   && deg < 112.5)  jsSet('s');
        if (deg >= -22.5  && deg < 22.5)   jsSet('d');
        if (deg >= 157.5  || deg < -157.5) jsSet('a');
        if (deg >= -157.5 && deg < -112.5) { jsSet('w'); jsSet('a'); }
        if (deg >= -67.5  && deg < -22.5)  { jsSet('w'); jsSet('d'); }
        if (deg >= 22.5   && deg < 67.5)   { jsSet('s'); jsSet('d'); }
        if (deg >= 112.5  && deg < 157.5)  { jsSet('s'); jsSet('a'); }
    }

    function update(touch) {
        const dx = touch.clientX - centerX;
        const dy = touch.clientY - centerY;
        const dist = Math.min(maxRadius, Math.sqrt(dx * dx + dy * dy));
        const ang = Math.atan2(dy, dx);
        const kx = Math.cos(ang) * dist;
        const ky = Math.sin(ang) * dist;
        knob.style.transform = `translate(${kx}px, ${ky}px)`;
        applyVector(kx / maxRadius, ky / maxRadius);
    }

    // Multi-touch-robust: drive everything from targetTouches (touches
    // currently on the joystick element) rather than tracking a single
    // touch ID. iOS / Android can fire spurious touchcancel events on an
    // active touch when a second finger lands elsewhere — the old code
    // would then "stick" because activeId no longer matched anything.
    function recenter() {
        const rect = stick.getBoundingClientRect();
        centerX = rect.left + rect.width / 2;
        centerY = rect.top + rect.height / 2;
    }
    function track(touch) {
        if (touch.identifier !== activeId) {
            activeId = touch.identifier;
            recenter();
        }
        update(touch);
    }

    stick.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const t = e.targetTouches[0];
        if (t) track(t);
    }, { passive: false });

    stick.addEventListener('touchmove', (e) => {
        e.preventDefault();
        // Prefer the touch matching activeId; fall back to any touch on
        // the joystick element so a recovered finger keeps control.
        let touch = null;
        for (const t of e.targetTouches) {
            if (t.identifier === activeId) { touch = t; break; }
        }
        if (!touch && e.targetTouches.length > 0) touch = e.targetTouches[0];
        if (touch) track(touch);
    }, { passive: false });

    function endTouch(e) {
        e.preventDefault();
        if (e.targetTouches.length === 0) {
            // Last finger lifted from the joystick — reset state.
            activeId = null;
            knob.style.transform = '';
            clearKeys();
        } else {
            // Another finger is still on the joystick — adopt it.
            track(e.targetTouches[0]);
        }
    }
    stick.addEventListener('touchend',    endTouch, { passive: false });
    stick.addEventListener('touchcancel', endTouch, { passive: false });
})();

// ---- Action buttons: FIRE held = space, PICKUP = tap once ----
// Drop is automatic — see auto-drop on landing in the update loop.
(function initActionButtons() {
    const fire   = document.getElementById('btn-fire');
    const pickup = document.getElementById('btn-pickup');

    function hold(elem, keyName) {
        if (!elem) return;
        elem.addEventListener('touchstart', (e) => {
            e.preventDefault();
            keys[keyName] = true;
        }, { passive: false });
        // Release only when no touches remain on the element — a single
        // finger lifting while another is still pressed shouldn't disarm
        // the key.
        const release = (e) => {
            e.preventDefault();
            if (e.targetTouches.length === 0) keys[keyName] = false;
        };
        elem.addEventListener('touchend',    release, { passive: false });
        elem.addEventListener('touchcancel', release, { passive: false });
    }
    function tap(elem, fn) {
        if (!elem) return;
        elem.addEventListener('touchstart', (e) => { e.preventDefault(); fn(); }, { passive: false });
    }

    hold(fire, ' ');
    tap(pickup, () => helicopterPickup());

    // Deploy orbit — taps fire the same actions as the canvas deploy cards.
    const deployAction = {
        '1': () => spawnPlayerUnit('infantry'),
        '2': () => spawnPlayerUnit('bazooka'),
        '3': () => spawnPlayerUnit('tank'),
        '4': () => buyMissiles(),
    };
    document.querySelectorAll('.deploy-orbit').forEach((el) => {
        const k = el.dataset.keynum;
        const fn = deployAction[k];
        if (fn) tap(el, fn);
    });
})();

// Wire each [data-icon] node to its PNG via background-image. The CSS
// filter chain (grayscale → sepia → hue-rotate → saturate) turns the
// full-colour sprite into a 2-tone cyan icon that still has internal
// shading, so it reads as a detailed icon rather than a flat silhouette.
function applyHudIconsToButtons() {
    const iconMap = {
        hud_flame:    'assets/hud_flame.png',
        hud_infantry: 'assets/hud_infantry.png',
        hud_bazooka:  'assets/hud_bazooka.png',
        hud_tank:     'assets/hud_tank.png',
        hud_missile:  'assets/hud_missile.png',
    };
    document.querySelectorAll('.icon[data-icon]').forEach((el) => {
        const src = iconMap[el.dataset.icon];
        if (!src) return;
        el.style.setProperty('--icon-src', `url(${src})`);
    });
}
applyHudIconsToButtons();

// Live state update for each touch button — runs every animation frame.
//
// Each ring is RED while filling toward affordability/reload, then flips
// to a solid GREEN ring when ready. The .ready class drives the colour
// swap; --cp-fill / --ammo-fill drive the red fill arc.
//
//   Deploy 1/2/3 → red fill = CP / cost,        green = affordable
//   Deploy 4     → red fill = gold / cost,      green = affordable OR already loaded
//   FIRE         → red fill = reload progress,  green = ammo > 0
//   PICK         → always green (no resource gate)
function updateButtonFills() {
    const costs = {
        '1': UNIT_DEFS.infantry.cpCost,
        '2': UNIT_DEFS.bazooka.cpCost,
        '3': UNIT_DEFS.tank.cpCost,
    };
    document.querySelectorAll('.deploy-orbit').forEach((el) => {
        const k = el.dataset.keynum;
        let pct = 0;
        let ready = false;
        if (k === '4') {
            ready = money >= BALANCE.missiles.pairCost || heli.missiles > 0;
            pct = ready ? 100 : Math.min(100, (money / BALANCE.missiles.pairCost) * 100);
        } else if (k === 'P') {
            ready = true;
            pct = 100;
        } else {
            const cost = costs[k];
            ready = commandPoints >= cost;
            pct = ready ? 100 : Math.min(100, (commandPoints / cost) * 100);
        }
        el.style.setProperty('--cp-fill', pct.toFixed(1));
        el.classList.toggle('ready', ready);
    });

    // FIRE button — red ring filling during reload, solid green when armed
    const fire = document.getElementById('btn-fire');
    if (fire) {
        const ready = heli.ammo > 0;
        const pct = ready ? 100 : (1 - heli.reloadMs / BALANCE.heli.reloadMs) * 100;
        fire.style.setProperty('--ammo-fill', pct.toFixed(1));
        fire.classList.toggle('ready', ready);
    }

    requestAnimationFrame(updateButtonFills);
}
requestAnimationFrame(updateButtonFills);

// Translate touch taps on the canvas into the same click event the
// existing canvas click handler already handles (deploy cards,
// missile button, pause, READY etc).
canvas.addEventListener('touchstart', (e) => {
    if (e.target !== canvas) return;
    e.preventDefault();
    const t = e.changedTouches[0];
    // Dispatch a synthetic click so the existing handler fires
    canvas.dispatchEvent(new MouseEvent('click', {
        bubbles: true, clientX: t.clientX, clientY: t.clientY,
    }));
}, { passive: false });

// Request landscape lock when the player taps DEPLOY
document.getElementById('start-btn').addEventListener('click', tryLockLandscape, { once: false });

// Register service worker for PWA install-to-home-screen
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
    });
}

// =====================================================================

// =====================================================================
// DEBUG BALANCE OVERLAY
//
// Walks the BALANCE object and emits a live <input> per numeric/string
// leaf. Edits write straight back into BALANCE, so any read site that
// references BALANCE.foo.bar (or holds a reference to a BALANCE sub-
// object — UNIT_DEFS, DAMAGE_MATRIX, etc.) sees the change on the next
// frame. Reads that captured a primitive at script load (heli.hp once
// inside resetHeli, etc.) only update on the next reset/restart.
// =====================================================================
function showToast(msg) {
    const t = document.getElementById('debug-toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 1400);
}

function setPath(root, path, val) {
    let cur = root;
    for (let i = 0; i < path.length - 1; i++) cur = cur[path[i]];
    cur[path[path.length - 1]] = val;
}

function renderDebugPanel() {
    const body = document.getElementById('debug-body');
    body.innerHTML = '';
    for (const section of Object.keys(BALANCE)) {
        if (section.startsWith('_')) continue;     // skip _doc fields
        const block = document.createElement('div');
        block.className = 'debug-section';
        const h = document.createElement('h4');
        h.textContent = section;
        block.appendChild(h);
        renderDebugObject(BALANCE[section], [section], block);
        body.appendChild(block);
    }
}

function renderDebugObject(obj, basePath, container) {
    // Emit one row per leaf. For nested objects, recurse and let the
    // label show the full dotted path so the designer can read context.
    for (const k of Object.keys(obj)) {
        const v = obj[k];
        const path = [...basePath, k];
        const labelText = path.slice(1).join('.');
        if (typeof v === 'number') {
            container.appendChild(makeRow(labelText, 'number', v, (n) => setPath(BALANCE, path, n)));
        } else if (typeof v === 'string') {
            container.appendChild(makeRow(labelText, 'text', v, (s) => setPath(BALANCE, path, s)));
        } else if (Array.isArray(v)) {
            v.forEach((item, i) => {
                if (item && typeof item === 'object' && !Array.isArray(item)) {
                    renderDebugObject(item, [...path, i], container);
                } else if (typeof item === 'number') {
                    container.appendChild(makeRow(`${labelText}[${i}]`, 'number', item, (n) => { v[i] = n; }));
                } else if (typeof item === 'string') {
                    container.appendChild(makeRow(`${labelText}[${i}]`, 'text', item, (s) => { v[i] = s; }));
                }
            });
        } else if (v && typeof v === 'object') {
            renderDebugObject(v, path, container);
        }
    }
}

function makeRow(labelText, inputType, value, onChange) {
    const row = document.createElement('div');
    row.className = 'debug-row';
    const label = document.createElement('label');
    label.textContent = labelText;
    label.title = labelText;   // hover shows the full path when truncated
    row.appendChild(label);
    const input = document.createElement('input');
    input.type = inputType;
    input.value = value;
    if (inputType === 'number') input.step = 'any';
    input.addEventListener('input', () => {
        if (inputType === 'number') {
            const n = parseFloat(input.value);
            if (!isNaN(n)) onChange(n);
        } else {
            onChange(input.value);
        }
    });
    row.appendChild(input);
    return row;
}

function copyBalanceToClipboard() {
    // Strip _doc-style keys (anything starting with _) before copying
    const clean = JSON.parse(JSON.stringify(BALANCE, (k, v) => k.startsWith('_') ? undefined : v));
    const json = JSON.stringify(clean, null, 4);
    navigator.clipboard.writeText(json).then(
        () => showToast('balance JSON copied'),
        () => {
            // Clipboard API blocked (e.g. file://) — fall back to prompt
            window.prompt('Copy the JSON below into balance.json:', json);
        }
    );
}

function setupDebugPanel() {
    const panel = document.getElementById('debug-panel');
    document.getElementById('debug-close').addEventListener('click', () => panel.classList.remove('open'));
    document.getElementById('debug-copy').addEventListener('click', copyBalanceToClipboard);
    document.getElementById('debug-reload').addEventListener('click', () => location.reload());
    // Backtick toggles the panel. Use code rather than key so the same
    // physical key works on layouts where ` lives elsewhere.
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Backquote') {
            // Don't hijack if the user is typing inside the panel itself
            const target = e.target;
            if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA') &&
                panel.contains(target)) return;
            panel.classList.toggle('open');
            if (panel.classList.contains('open')) renderDebugPanel();
            e.preventDefault();
        }
    });
}

// Boot: load any balance.json overrides BEFORE the first initGame() so
// the world spins up with the correct (possibly tuned) values. Sprite
// preload + game loop can fire in parallel — they don't depend on
// balance values. Then enter the menu state and start rendering.
(async () => {
    await loadBalance();
    setupDebugPanel();
    loadSprites();
    initGame();
    gameState = 'menu';
    gameLoop();
})();

</script>
