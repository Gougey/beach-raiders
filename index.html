    ctx.shadowBlur = 14; ctx.shadowColor = 'rgba(0,0,0,0.7)';
    ctx.fillText('— BETWEEN WAVES —', W / 2, 80);

    ctx.font = 'bold 18px "Lilita One", sans-serif';
    ctx.fillStyle = '#90caf9';
    ctx.shadowBlur = 4;
    ctx.fillText(`Wave ${currentWave} cleared. Spend gold on upgrades, then deploy.`, W / 2, 116);
    ctx.shadowBlur = 0;

    // Money display
    ctx.fillStyle = '#69f0ae';
    ctx.font = 'bold 28px "Lilita One", sans-serif';
    ctx.fillText(`$${Math.floor(money)}`, W / 2, 150);

    // 5 upgrade cards in a row
    const upgradeIds = ['infantryDamage', 'bazookaRange', 'tankHp', 'heliHp', 'cpCap'];
    const cardW = 170, cardH = 220;
    const totalW = upgradeIds.length * cardW + (upgradeIds.length - 1) * 14;
    let cx = W / 2 - totalW / 2;
    const cardY = H / 2 - cardH / 2 + 20;

    for (const id of upgradeIds) {
        const up = UPGRADES[id];
        const lvl = upgradeLevels[id];
        const maxed = lvl >= up.tiers.length;
        const tier = maxed ? up.tiers[up.tiers.length - 1] : up.tiers[lvl];
        const canAfford = !maxed && money >= tier.cost;

        // Card frame
        bevelButton(cx, cardY, cardW, cardH, {
            radius: 14,
            top:    canAfford ? 'rgba(35, 80, 50, 0.95)' : (maxed ? 'rgba(120, 90, 30, 0.95)' : 'rgba(40, 50, 70, 0.95)'),
            bottom: canAfford ? 'rgba(15, 50, 30, 0.95)' : (maxed ? 'rgba(70, 50, 15, 0.95)' : 'rgba(20, 30, 50, 0.95)'),
        });

        // Icon (use unit sprite if specified)
        const iconImg = up.icon ? SPRITES[up.icon] : null;
        if (iconImg && iconImg.complete && iconImg.naturalWidth > 0) {
            const aspect = iconImg.naturalWidth / iconImg.naturalHeight;
            const ih = 70, iw = ih * aspect;
            ctx.drawImage(iconImg, cx + cardW / 2 - iw / 2, cardY + 16, iw, ih);
        } else {
            // CP icon — lightning bolt
            ctx.fillStyle = '#42a5f5';
            const ix = cx + cardW / 2, iy = cardY + 50;
            ctx.beginPath();
            ctx.moveTo(ix - 6, iy - 26);
            ctx.lineTo(ix - 18, iy + 4);
            ctx.lineTo(ix - 4, iy + 4);
            ctx.lineTo(ix - 8, iy + 32);
            ctx.lineTo(ix + 18, iy - 6);
            ctx.lineTo(ix + 4, iy - 6);
            ctx.lineTo(ix + 8, iy - 26);
            ctx.closePath();
            ctx.fill();
        }

        // Name
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px "Lilita One", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowBlur = 4; ctx.shadowColor = 'rgba(0,0,0,0.7)';
        ctx.fillText(up.name, cx + cardW / 2, cardY + 105);

        // Tier dots
        for (let t = 0; t < up.tiers.length; t++) {
            const dotX = cx + cardW / 2 - (up.tiers.length - 1) * 10 + t * 20;
            ctx.fillStyle = t < lvl ? '#69f0ae' : 'rgba(255,255,255,0.2)';
            ctx.beginPath();
            ctx.arc(dotX, cardY + 130, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        // Cost / status
        if (maxed) {
            ctx.fillStyle = '#ffc107';
            ctx.font = 'bold 18px "Lilita One", sans-serif';
            ctx.fillText('MAX', cx + cardW / 2, cardY + 170);
        } else {
            ctx.fillStyle = canAfford ? '#69f0ae' : '#888';
            ctx.font = 'bold 22px "Lilita One", sans-serif';
            ctx.fillText(`$${tier.cost}`, cx + cardW / 2, cardY + 170);
            // Action hint
            ctx.fillStyle = canAfford ? '#fff' : '#666';
            ctx.font = 'bold 12px "Lilita One", sans-serif';
            ctx.fillText('CLICK TO BUY', cx + cardW / 2, cardY + 195);
        }
        ctx.shadowBlur = 0;

        if (!maxed) {
            hudHitRects.push({ x: cx, y: cardY, w: cardW, h: cardH, action: () => buyUpgrade(id) });
        }

        cx += cardW + 14;
    }

    // Ready button
    const readyW = 240, readyH = 60;
    const readyX = W / 2 - readyW / 2;
    const readyY = cardY + cardH + 20;
    const pulse = 1 + Math.sin(frameCount * 0.1) * 0.04;
    ctx.save();
    ctx.translate(readyX + readyW / 2, readyY + readyH / 2);
    ctx.scale(pulse, pulse);
    bevelButton(-readyW / 2, -readyH / 2, readyW, readyH, {
        radius: 14,
        top: 'rgba(80, 200, 100, 0.95)',
        bottom: 'rgba(30, 100, 50, 0.95)',
    });
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 26px "Lilita One", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowBlur = 6; ctx.shadowColor = 'rgba(0,0,0,0.7)';
    ctx.fillText('READY ▶', 0, 0);
    ctx.restore();
    hudHitRects.push({
        x: readyX, y: readyY, w: readyW, h: readyH,
        action: () => {
            waveState = 'warning';
            waveTimer = 0;
            currentWave = Math.min(TOTAL_WAVES, currentWave + 1);
        },
    });

    ctx.restore();
}

// ---- MAIN RENDER ----
function render() {
    ctx.clearRect(0, 0, W, H);

    // Apply screen shake
    ctx.save();
    ctx.translate(screenShakeX, screenShakeY);

    drawSky();
    drawBackgroundMountains();
    drawBirds();
    drawClouds();
    drawBackgroundTrees();

    // Background palm trees (behind ground)
    for (const tree of palmTrees) {
        drawPalmTree(tree);
    }

    drawGround();
    drawFlowers();
    drawScenery();
    drawOcean();

    // Bases
    drawBase(playerBase, 'player');
    drawBase(enemyBase, 'enemy');

    // Air defence batteries
    for (const aa of airDefences) drawAirDefence(aa);

    // Crates (drawn after structures so they sit on top of the beach)
    for (const c of crates) drawCrate(c);

    // Units
    for (const u of units) {
        drawUnit(u);
    }

    // Bullets
    drawBullets();

    // Helicopter
    drawHelicopter();

    // Particles (on top)
    drawParticles();
    drawAmbientParticles();
    drawFloatingTexts();

    ctx.restore(); // End screen shake

    // HUD (not affected by shake)
    drawHUD();
}

// ---- GAME LOOP ----
function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

// Start the loop (rendering menu background)
loadSprites();
initGame();
gameState = 'menu';
gameLoop();

</script>
