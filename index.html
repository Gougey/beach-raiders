<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rescue Raiders - Beach Assault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --headline-font: 'Lilita One', 'Impact', sans-serif;
    --body-font: 'Fredoka', 'Segoe UI', sans-serif;
    --gold: #ffc107;
    --gold-deep: #ff8f00;
    --wood: #6d4c41;
    --wood-light: #8d6e63;
    --wood-dark: #3e2723;
    --jungle: #2e7d32;
    --jungle-dark: #1b5e20;
    --crimson: #c62828;
    --crimson-deep: #8e0000;
    --ocean: #0277bd;
    --sky: #29b6f6;
}

body {
    background: radial-gradient(circle at 50% 30%, #1e3c5a 0%, #0a1628 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: var(--body-font);
    color: #fff;
}
canvas {
    border: 4px solid var(--wood-dark);
    border-radius: 10px;
    box-shadow:
        inset 0 0 0 2px var(--wood-light),
        0 8px 40px rgba(0, 0, 0, 0.7),
        0 0 80px rgba(255, 193, 7, 0.08);
}

/* ---- Start screen ---- */
#start-screen, #game-over-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at 50% 40%, rgba(255, 193, 7, 0.12) 0%, transparent 60%),
        rgba(10, 22, 40, 0.78);
    z-index: 10;
    backdrop-filter: blur(2px);
}
#game-over-screen { display: none; }

#logo-img {
    max-width: 75%;
    max-height: 45%;
    filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.6));
    margin-bottom: 8px;
    user-select: none;
    -webkit-user-drag: none;
}
/* Fallback wordmark if logo image hasn't loaded */
#logo-text {
    font-family: var(--headline-font);
    font-size: 64px;
    color: var(--gold);
    text-shadow:
        2px 2px 0 var(--crimson-deep),
        4px 4px 0 #4e0000,
        6px 6px 12px rgba(0, 0, 0, 0.7);
    letter-spacing: 2px;
    line-height: 0.95;
    text-align: center;
    margin-bottom: 8px;
}
#logo-text .top { display: block; }
#logo-text .bottom { display: block; font-size: 0.85em; color: #ff7043; }

#tagline {
    font-family: var(--body-font);
    font-weight: 600;
    font-size: 18px;
    color: #b3e5fc;
    margin-bottom: 24px;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
}

#start-screen .controls {
    background:
        linear-gradient(180deg, rgba(141, 110, 99, 0.95), rgba(62, 39, 35, 0.95));
    border: 3px solid var(--wood-dark);
    border-radius: 12px;
    box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.15),
        inset 0 -2px 0 rgba(0, 0, 0, 0.3),
        0 6px 20px rgba(0, 0, 0, 0.5);
    color: #ffe0b2;
    font-family: var(--body-font);
    font-weight: 500;
    font-size: 15px;
    padding: 18px 28px;
    line-height: 1.9;
    margin-bottom: 26px;
    min-width: 320px;
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
}
#start-screen .controls .key {
    display: inline-block;
    font-family: var(--headline-font);
    background: linear-gradient(180deg, #fff8e1, #ffc107);
    color: var(--wood-dark);
    border: 2px solid var(--wood-dark);
    border-radius: 6px;
    padding: 1px 9px;
    margin-right: 8px;
    font-size: 13px;
    text-shadow: none;
    box-shadow: 0 2px 0 var(--wood-dark);
    min-width: 28px;
    text-align: center;
}

/* ---- Big chunky game button ---- */
.game-btn {
    font-family: var(--headline-font);
    font-size: 26px;
    letter-spacing: 2px;
    padding: 14px 56px;
    color: #fff;
    text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.4);
    border: 3px solid var(--wood-dark);
    border-radius: 14px;
    cursor: pointer;
    pointer-events: all;
    transition: transform 0.08s, filter 0.08s;
    box-shadow:
        inset 0 3px 0 rgba(255, 255, 255, 0.3),
        inset 0 -4px 0 rgba(0, 0, 0, 0.25),
        0 6px 0 var(--wood-dark),
        0 8px 18px rgba(0, 0, 0, 0.5);
    background: linear-gradient(180deg, #66bb6a 0%, #2e7d32 50%, #1b5e20 100%);
}
.game-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
.game-btn:active {
    transform: translateY(4px);
    box-shadow:
        inset 0 3px 0 rgba(255, 255, 255, 0.2),
        inset 0 -2px 0 rgba(0, 0, 0, 0.25),
        0 2px 0 var(--wood-dark),
        0 4px 10px rgba(0, 0, 0, 0.5);
}
.game-btn.danger {
    background: linear-gradient(180deg, #ff7043 0%, #d84315 50%, #8e0000 100%);
}

/* ---- Game over ---- */
#game-over-screen h1 {
    font-family: var(--headline-font);
    font-size: 78px;
    letter-spacing: 4px;
    margin-bottom: 28px;
    text-shadow:
        3px 3px 0 var(--wood-dark),
        6px 6px 12px rgba(0, 0, 0, 0.7);
}
</style>
</head>
<body>

<canvas id="game" width="1200" height="700"></canvas>

<div id="start-screen">
    <img id="logo-img" src="assets/logo.png" alt="Frontline Extraction" onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block';">
    <div id="logo-text" style="display:none">
        <span class="top">FRONTLINE</span>
        <span class="bottom">EXTRACTION</span>
    </div>
    <div id="tagline">Air Cavalry · Ground Assault</div>
    <div class="controls">
        <span class="key">WASD</span> Fly Helicopter<br>
        <span class="key">SPACE</span> Fire Minigun<br>
        <span class="key">E</span> Pick up / Drop soldiers<br>
        <span class="key">1</span> Deploy Infantry ($10)<br>
        <span class="key">2</span> Deploy Tank ($40)<br>
        <span class="key">3</span> Deploy Bazooka ($25)
    </div>
    <button id="start-btn" class="game-btn">DEPLOY</button>
</div>

<div id="game-over-screen">
    <h1 id="game-over-text">VICTORY!</h1>
    <button id="restart-btn" class="game-btn danger">PLAY AGAIN</button>
</div>

<script>
// ============================================================
// BEACH RAIDERS — Rescue Raiders clone with Boom Beach aesthetics
// ============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// ---- GAME CONFIG ----
const WORLD_WIDTH = 4000;
const GROUND_Y = 560;
const WATER_Y = 590;
const GRAVITY = 0.15;
const HELI_SPEED = 4;
const BULLET_SPEED = 10;
const SCROLL_MARGIN = 350;
const INCOME_RATE = 0.15; // money per frame

// ---- COLORS (Boom Beach palette) ----
const C = {
    sky1: '#4fc3f7',
    sky2: '#81d4fa',
    sky3: '#b3e5fc',
    ocean1: '#0288d1',
    ocean2: '#0277bd',
    ocean3: '#01579b',
    sand1: '#ffe0b2',
    sand2: '#ffcc80',
    sand3: '#ffb74d',
    grass1: '#66bb6a',
    grass2: '#43a047',
    grass3: '#2e7d32',
    palm1: '#33691e',
    palm2: '#558b2f',
    wood: '#5d4037',
    heliBody: '#1565c0',
    heliLight: '#42a5f5',
    heliDark: '#0d47a1',
    enemyBody: '#c62828',
    enemyLight: '#ef5350',
    enemyDark: '#8e0000',
    infantry: '#1b5e20',
    infantryEnemy: '#b71c1c',
    tank: '#37474f',
    tankEnemy: '#4e342e',
    bazooka: '#004d40',
    bazookaEnemy: '#bf360c',
    building: '#78909c',
    buildingLight: '#b0bec5',
    buildingDark: '#546e7a',
    gold: '#ffc107',
    hud: 'rgba(0,0,0,0.6)',
    explosion1: '#ff9800',
    explosion2: '#ff5722',
    explosion3: '#ffeb3b',
    white: '#ffffff',
    healthGreen: '#4caf50',
    healthRed: '#f44336',
};

// ---- SPRITE LOADER ----
const SPRITES = {};
const SPRITE_FILES = (() => {
    const files = {
        heli: 'assets/heli.png',
        tank_blue: 'assets/tank_blue.png',
        tank_red: 'assets/tank_red.png',
        base_blue: 'assets/base_blue.png',
        base_red: 'assets/base_red.png',
        // Environment / scenery
        palm_tree_1: 'assets/palm_tree_1.png',
        palm_tree_2: 'assets/palm_tree_2.png',
        bush_1: 'assets/bush_1.png',
        rock_1: 'assets/rock_1.png',
        cloud_1: 'assets/cloud_1.png',
        mountain_bg: 'assets/mountain_bg.png',
    };
    // 8-frame walk cycles per soldier type
    for (const soldier of ['infantry_blue', 'infantry_red', 'bazooka_blue', 'bazooka_red']) {
        for (let i = 1; i <= 8; i++) {
            files[`${soldier}_${i}`] = `assets/${soldier}_${i}.png`;
        }
    }
    return files;
})();

// 8-frame walk cycle with VARIABLE per-frame timing (ms).
// Total cycle ≈ 520ms. Contact and push-off frames hold longer than recoil/midstance.
const WALK_FRAME_MS = [80, 55, 55, 70, 80, 55, 55, 70];
const WALK_CYCLE_MS = WALK_FRAME_MS.reduce((a, b) => a + b, 0);
const WALK_FRAME_ENDS = WALK_FRAME_MS.reduce((acc, d) => {
    acc.push((acc[acc.length - 1] || 0) + d);
    return acc;
}, []);

// Vertical body offset PER KEYFRAME (positive = lower on screen).
// These are anchored to the START of each frame; we interpolate between
// them smoothly so the body bobs continuously rather than teleporting at
// each frame swap. Spec: lowest at F3/F7 (midstance), highest at F4/F8.
const WALK_FRAME_Y_KEY = [0, 2, 5, -3, 0, 2, 5, -3];

// Cumulative start times for each frame (i.e. WALK_FRAME_ENDS shifted right).
const WALK_FRAME_STARTS = [0, ...WALK_FRAME_ENDS.slice(0, -1)];

// Given a time in ms within the cycle, return frame number (1..8).
function walkFrameAt(ms) {
    const t = ((ms % WALK_CYCLE_MS) + WALK_CYCLE_MS) % WALK_CYCLE_MS;
    for (let i = 0; i < 8; i++) {
        if (t < WALK_FRAME_ENDS[i]) return i + 1;
    }
    return 8;
}

// Smooth-interpolated vertical bob in pixels at time `ms` within the cycle.
// Uses a smoothstep curve between adjacent keyframes for natural motion.
function walkYAt(ms) {
    const t = ((ms % WALK_CYCLE_MS) + WALK_CYCLE_MS) % WALK_CYCLE_MS;
    for (let i = 0; i < 8; i++) {
        if (t < WALK_FRAME_ENDS[i]) {
            const segStart = WALK_FRAME_STARTS[i];
            const segEnd = WALK_FRAME_ENDS[i];
            const a = WALK_FRAME_Y_KEY[i];
            const b = WALK_FRAME_Y_KEY[(i + 1) % 8];  // wrap so F8→F1 interpolates
            const u = (t - segStart) / (segEnd - segStart);
            // Smoothstep for ease-in/ease-out around the keyframe values
            const s = u * u * (3 - 2 * u);
            return a + (b - a) * s;
        }
    }
    return 0;
}
let spritesLoaded = 0;
let spritesTotal = Object.keys(SPRITE_FILES).length;
let allSpritesReady = false;

function loadSprites() {
    Object.entries(SPRITE_FILES).forEach(([key, src]) => {
        const img = new Image();
        img.onload = () => {
            spritesLoaded++;
            if (spritesLoaded === spritesTotal) {
                allSpritesReady = true;
                console.log('All sprites loaded');
            }
        };
        img.onerror = () => {
            console.warn('Failed to load sprite:', src);
            spritesLoaded++;
            if (spritesLoaded === spritesTotal) allSpritesReady = true;
        };
        img.src = src;
        SPRITES[key] = img;
    });
}

// Draw sprite centred at (x, y) with given height (preserves aspect ratio).
// flipH=true draws mirrored horizontally (for left-facing).
function drawSprite(key, x, y, height, flipH = false) {
    const img = SPRITES[key];
    if (!img || !img.complete || img.naturalWidth === 0) return false;
    const aspect = img.naturalWidth / img.naturalHeight;
    const w = height * aspect;
    const h = height;
    ctx.save();
    if (flipH) {
        ctx.translate(x, y);
        ctx.scale(-1, 1);
        ctx.drawImage(img, -w / 2, -h / 2, w, h);
    } else {
        ctx.drawImage(img, x - w / 2, y - h / 2, w, h);
    }
    ctx.restore();
    return true;
}

// ---- GAME STATE ----
let gameState = 'menu'; // menu, playing, paused, gameover
let cameraX = 0;
let money = 50;
let enemyMoney = 50;
let enemySpawnTimer = 0;

// ---- WAVE SYSTEM ----
const TOTAL_WAVES = 5;
let currentWave = 1;
let waveTimer = 0;          // ms within current wave
const WAVE_DURATION_MS = 35000;
// Composition per wave: which unit types the enemy spawns and how often
const WAVE_COMPOSITIONS = [
    { types: ['infantry', 'infantry', 'bazooka'],          spawnEvery: 140 },
    { types: ['infantry', 'bazooka', 'tank'],              spawnEvery: 130 },
    { types: ['infantry', 'bazooka', 'bazooka', 'tank'],   spawnEvery: 120 },
    { types: ['bazooka', 'bazooka', 'tank', 'tank'],       spawnEvery: 110 },
    { types: ['tank', 'tank', 'bazooka', 'infantry'],      spawnEvery: 90 },
];

// ---- POWERUPS ----
// Active effect timers (ms remaining)
let powerupShieldMs = 0;
const POWERUPS = {
    airstrike: { cost: 60, key: 'q' },
    shield:    { cost: 50, key: 'w' },  // overlaps with W movement key — handled via click only
    repair:    { cost: 30, key: 'r' },
};

// Buttons hit-rects (filled in during draw, used by click handler)
let hudHitRects = [];
let pauseHitRect = null;
let frameCount = 0;
let particles = [];
let bullets = [];
let units = [];
let keys = {};
let gameOverResult = '';
let screenShakeX = 0;
let screenShakeY = 0;
let screenShakeTimer = 0;
let ambientParticles = [];

// ---- INPUT ----
document.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    // Pause toggle works whenever a game is in progress
    if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') &&
        (gameState === 'playing' || gameState === 'paused')) {
        gameState = gameState === 'playing' ? 'paused' : 'playing';
    }
    if (gameState === 'playing') {
        if (e.key === '1') spawnPlayerUnit('infantry');
        if (e.key === '2') spawnPlayerUnit('tank');
        if (e.key === '3') spawnPlayerUnit('bazooka');
        if (e.key === 'e' || e.key === 'E') helicopterPickupDrop();
        // Powerups
        if (e.key === 'q' || e.key === 'Q') activateAirstrike();
        if (e.key === 'r' || e.key === 'R') activateRepair();
        if (e.key === 'f' || e.key === 'F') activateShield();
    }
    if (e.key === ' ') e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// Click on HUD buttons (pause, deploy cards, powerups)
canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const cy = (e.clientY - rect.top) * (canvas.height / rect.height);

    if (gameState === 'playing' || gameState === 'paused') {
        if (pauseHitRect &&
            cx >= pauseHitRect.x && cx <= pauseHitRect.x + pauseHitRect.w &&
            cy >= pauseHitRect.y && cy <= pauseHitRect.y + pauseHitRect.h) {
            gameState = gameState === 'playing' ? 'paused' : 'playing';
            return;
        }
    }
    if (gameState !== 'playing') return;
    for (const r of hudHitRects) {
        if (cx >= r.x && cx <= r.x + r.w && cy >= r.y && cy <= r.y + r.h) {
            if (r.action) r.action();
            return;
        }
    }
});

document.getElementById('start-btn').addEventListener('click', () => {
    document.getElementById('start-screen').style.display = 'none';
    gameState = 'playing';
    initGame();
});
document.getElementById('restart-btn').addEventListener('click', () => {
    document.getElementById('game-over-screen').style.display = 'none';
    gameState = 'playing';
    initGame();
});

// ---- HELICOPTER ----
let heli = {};
function resetHeli() {
    heli = {
        x: 200, y: 300,
        vx: 0, vy: 0,
        hp: 100, maxHp: 100,
        facing: 1, // 1=right, -1=left
        bladeAngle: 0,
        shootCooldown: 0,
        carrying: [], // soldiers being carried
        maxCarry: 4,
        bobTimer: 0,
    };
}

// ---- BASES ----
let playerBase = {};
let enemyBase = {};
function resetBases() {
    playerBase = { x: 100, hp: 500, maxHp: 500, team: 'player' };
    enemyBase = { x: WORLD_WIDTH - 200, hp: 500, maxHp: 500, team: 'enemy' };
}

// ---- INIT ----
// Pre-generate terrain features
let palmTrees = [];
let clouds = [];
let flowers = [];
let rocks = [];
let scenery = [];      // sprite-based bushes/rocks
let bgMountains = [];
let bgTrees = [];
let birds = [];

function initGame() {
    resetHeli();
    resetBases();
    money = 50;
    enemyMoney = 50;
    enemySpawnTimer = 0;
    currentWave = 1;
    waveTimer = 0;
    powerupShieldMs = 0;
    frameCount = 0;
    particles = [];
    bullets = [];
    units = [];
    cameraX = 0;
    screenShakeX = 0;
    screenShakeY = 0;
    screenShakeTimer = 0;
    ambientParticles = [];

    // Generate palm trees
    palmTrees = [];
    for (let i = 0; i < 30; i++) {
        palmTrees.push({
            x: 300 + Math.random() * (WORLD_WIDTH - 600),
            height: 60 + Math.random() * 40,
            lean: (Math.random() - 0.5) * 0.3,
            fronds: 5 + Math.floor(Math.random() * 3),
            swayOffset: Math.random() * Math.PI * 2,
            trunkWidth: 6 + Math.random() * 4,
        });
    }

    // Generate clouds
    clouds = [];
    for (let i = 0; i < 15; i++) {
        clouds.push({
            x: Math.random() * WORLD_WIDTH,
            y: 30 + Math.random() * 120,
            w: 80 + Math.random() * 120,
            speed: 0.1 + Math.random() * 0.3,
        });
    }

    // Generate flowers/bushes
    flowers = [];
    for (let i = 0; i < 50; i++) {
        flowers.push({
            x: Math.random() * WORLD_WIDTH,
            type: Math.floor(Math.random() * 5),
            size: 3 + Math.random() * 5,
            color: ['#e91e63', '#ff9800', '#ffeb3b', '#ab47bc', '#ff5252', '#69f0ae'][Math.floor(Math.random() * 6)],
            petalCount: 4 + Math.floor(Math.random() * 4),
        });
    }

    // Generate rocks
    rocks = [];
    for (let i = 0; i < 40; i++) {
        rocks.push({
            x: Math.random() * WORLD_WIDTH,
            size: 2 + Math.random() * 6,
            shade: 0.3 + Math.random() * 0.3,
            yOff: Math.random() * 3,
        });
    }

    // Sprite-based ambient scenery: bushes and big rocks
    scenery = [];
    for (let i = 0; i < 18; i++) {
        scenery.push({
            x: 200 + Math.random() * (WORLD_WIDTH - 400),
            type: Math.random() < 0.65 ? 'bush_1' : 'rock_1',
            scale: 0.7 + Math.random() * 0.5,
            flip: Math.random() < 0.5,
        });
    }

    // Generate background mountains/islands
    bgMountains = [];
    for (let i = 0; i < 8; i++) {
        bgMountains.push({
            x: i * (WORLD_WIDTH / 7) + Math.random() * 200,
            w: 200 + Math.random() * 300,
            h: 80 + Math.random() * 120,
            color1: `hsl(${200 + Math.random() * 30}, ${30 + Math.random() * 20}%, ${60 + Math.random() * 15}%)`,
            color2: `hsl(${200 + Math.random() * 30}, ${30 + Math.random() * 20}%, ${75 + Math.random() * 10}%)`,
        });
    }

    // Generate mid-ground trees
    bgTrees = [];
    for (let i = 0; i < 25; i++) {
        bgTrees.push({
            x: Math.random() * WORLD_WIDTH,
            h: 30 + Math.random() * 40,
            w: 20 + Math.random() * 25,
            shade: Math.random(),
        });
    }

    // Generate ambient birds
    birds = [];
    for (let i = 0; i < 6; i++) {
        birds.push({
            x: Math.random() * WORLD_WIDTH,
            y: 40 + Math.random() * 100,
            speed: 0.3 + Math.random() * 0.6,
            wingPhase: Math.random() * Math.PI * 2,
            size: 2 + Math.random() * 2,
        });
    }

    // Spawn initial enemy units
    for (let i = 0; i < 3; i++) {
        spawnEnemyUnit('infantry');
    }
}

// ---- UNIT DEFINITIONS ----
const UNIT_DEFS = {
    infantry: { hp: 30, speed: 0.8, damage: 5, range: 80, attackRate: 40, cost: 10, w: 14, h: 22 },
    tank:     { hp: 120, speed: 0.5, damage: 15, range: 150, attackRate: 60, cost: 40, w: 36, h: 20 },
    bazooka:  { hp: 25, speed: 0.7, damage: 25, range: 130, attackRate: 70, cost: 25, w: 14, h: 22 },
};

function spawnPlayerUnit(type) {
    const def = UNIT_DEFS[type];
    if (money < def.cost) return;
    money -= def.cost;
    units.push({
        type, team: 'player',
        x: playerBase.x + 80, y: GROUND_Y - def.h / 2,
        hp: def.hp, maxHp: def.hp,
        speed: def.speed, damage: def.damage,
        range: def.range, attackRate: def.attackRate,
        attackCooldown: 0,
        w: def.w, h: def.h,
        state: 'march', // march, fight, dead
        walkFrame: Math.random() * Math.PI * 2,
    });
}

function spawnEnemyUnit(type) {
    const def = UNIT_DEFS[type];
    units.push({
        type, team: 'enemy',
        x: enemyBase.x - 80, y: GROUND_Y - def.h / 2,
        hp: def.hp, maxHp: def.hp,
        speed: def.speed, damage: def.damage,
        range: def.range, attackRate: def.attackRate,
        attackCooldown: 0,
        w: def.w, h: def.h,
        state: 'march',
        walkFrame: Math.random() * Math.PI * 2,
    });
}

// ---- HELICOPTER PICKUP/DROP ----
function helicopterPickupDrop() {
    if (heli.carrying.length > 0) {
        // Drop soldiers at current position
        for (let i = 0; i < heli.carrying.length; i++) {
            const s = heli.carrying[i];
            s.x = heli.x + (i - 1.5) * 20;
            s.y = GROUND_Y - s.h / 2;
            s.state = 'march';
            units.push(s);
        }
        heli.carrying = [];
    } else {
        // Pick up nearby friendly infantry
        for (let i = units.length - 1; i >= 0; i--) {
            const u = units[i];
            if (u.team === 'player' && u.type === 'infantry' && heli.carrying.length < heli.maxCarry) {
                const dx = u.x - heli.x;
                const dy = u.y - heli.y;
                if (Math.abs(dx) < 60 && Math.abs(dy) < 80) {
                    u.state = 'carried';
                    heli.carrying.push(u);
                    units.splice(i, 1);
                }
            }
        }
    }
}

// ---- SHOOTING ----
function heliShoot() {
    if (heli.shootCooldown > 0) return;
    heli.shootCooldown = 8;
    // Underslung minigun fires forward AND DOWN — bullets arc into ground troops.
    // Slower forward speed + strong down velocity means rounds land close to the
    // heli's position, like a real strafing run. Heli's own velocity is added
    // so flying forward carries the rounds further.
    const spreadX = (Math.random() - 0.5) * 1.5;
    const spreadY = (Math.random() - 0.5) * 1.5;
    bullets.push({
        x: heli.x + heli.facing * 25,
        y: heli.y + 18,
        vx: 5 * heli.facing + heli.vx + spreadX,
        vy: 10 + heli.vy + spreadY,            // strong down — minigun strafe
        team: 'player',
        damage: 10,
        life: 80,
        type: 'heli',
    });
    // Muzzle flash
    spawnParticles(heli.x + heli.facing * 25, heli.y + 18, C.explosion3, 3, 2, 8);
    // Shell casing
    particles.push({
        x: heli.x + heli.facing * 15, y: heli.y + 14,
        vx: -heli.facing * (1 + Math.random() * 2), vy: -2 - Math.random() * 2,
        life: 30, maxLife: 30,
        color: '#d4a017', size: 2, isCasing: true,
    });
}

function unitShoot(unit, target) {
    if (unit.attackCooldown > 0) return;
    unit.attackCooldown = unit.attackRate;

    if (unit.type === 'tank' || unit.type === 'bazooka') {
        const dx = target.x - unit.x;
        const dy = (target.y || GROUND_Y) - unit.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        bullets.push({
            x: unit.x + (unit.team === 'player' ? unit.w / 2 : -unit.w / 2),
            y: unit.y,
            vx: (dx / dist) * 6,
            vy: (dy / dist) * 6 - (unit.type === 'bazooka' ? 1 : 0),
            team: unit.team,
            damage: unit.damage,
            life: 60,
            type: unit.type === 'tank' ? 'shell' : 'rocket',
        });
        // Muzzle flash for tank/bazooka
        const dir = unit.team === 'player' ? 1 : -1;
        spawnParticles(unit.x + dir * unit.w / 2, unit.y, C.explosion3, 4, 2, 6);
    } else {
        // Infantry — instant hit
        target.hp -= unit.damage;
        spawnParticles(target.x, target.y, C.explosion1, 2, 1, 5);
        // Muzzle flash for infantry
        const dir = unit.team === 'player' ? 1 : -1;
        spawnParticles(unit.x + dir * 14, unit.y - 3, '#ffeb3b', 2, 1, 4);
    }
}

// ---- PARTICLES ----
function spawnParticles(x, y, color, count, minSpeed, maxLife) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = minSpeed + Math.random() * 3;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1,
            life: maxLife + Math.random() * maxLife,
            maxLife: maxLife * 2,
            color,
            size: 2 + Math.random() * 4,
        });
    }
}

function spawnExplosion(x, y, size) {
    spawnParticles(x, y, C.explosion1, size * 3, 1, 15);
    spawnParticles(x, y, C.explosion2, size * 2, 2, 12);
    spawnParticles(x, y, C.explosion3, size, 1, 10);
    spawnParticles(x, y, '#444', size * 2, 1, 20);
    // Debris chunks
    for (let i = 0; i < size * 2; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 4;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 3,
            life: 20 + Math.random() * 20,
            maxLife: 40,
            color: ['#5d4037', '#795548', '#8d6e63', '#333'][Math.floor(Math.random() * 4)],
            size: 3 + Math.random() * 4,
            isDebris: true,
        });
    }
    // Shockwave ring
    particles.push({
        x, y,
        vx: 0, vy: 0,
        life: 12, maxLife: 12,
        color: 'rgba(255,255,255,0.5)',
        size: 5,
        isShockwave: true,
        radius: 5,
    });
    // Screen shake
    if (size >= 3) {
        screenShakeTimer = 10;
    }
}

function spawnDustCloud(x, y) {
    for (let i = 0; i < 2; i++) {
        particles.push({
            x: x + (Math.random() - 0.5) * 8, y: y + 5,
            vx: (Math.random() - 0.5) * 0.5, vy: -0.3 - Math.random() * 0.5,
            life: 15 + Math.random() * 10,
            maxLife: 25,
            color: '#c8b08a',
            size: 3 + Math.random() * 3,
            isDust: true,
        });
    }
}

// ---- POWERUPS ----

function activateAirstrike() {
    const cost = POWERUPS.airstrike.cost;
    if (money < cost) return;
    money -= cost;
    // Find the densest enemy cluster, drop 4 missiles on the area
    let targetX = enemyBase.x;  // default to enemy base
    if (units.some(u => u.team === 'enemy')) {
        const xs = units.filter(u => u.team === 'enemy').map(u => u.x);
        targetX = xs.reduce((a, b) => a + b, 0) / xs.length;
    }
    // Spawn 4 missiles falling from off-screen top, landing in a spread around targetX
    for (let i = 0; i < 4; i++) {
        const lx = targetX + (i - 1.5) * 60;
        bullets.push({
            x: lx, y: -50,
            vx: 0, vy: 8,
            team: 'player',
            damage: 60,
            life: 200,
            type: 'rocket',
            airstrike: true,
        });
    }
}

function activateShield() {
    const cost = POWERUPS.shield.cost;
    if (money < cost) return;
    money -= cost;
    powerupShieldMs = 8000;  // 8 seconds of base invulnerability
}

function activateRepair() {
    const cost = POWERUPS.repair.cost;
    if (money < cost) return;
    money -= cost;
    // Repair player base + heli for 30% of max
    playerBase.hp = Math.min(playerBase.maxHp, playerBase.hp + playerBase.maxHp * 0.3);
    heli.hp = Math.min(heli.maxHp, heli.hp + heli.maxHp * 0.3);
    // Visual: green sparkle particles
    for (let i = 0; i < 12; i++) {
        spawnParticles(playerBase.x + (Math.random() - 0.5) * 80,
                       GROUND_Y - 30 - Math.random() * 60,
                       '#69f0ae', 2, 1, 20);
    }
    spawnParticles(heli.x, heli.y, '#69f0ae', 8, 1, 18);
}

// ---- UPDATE ----
function update() {
    if (gameState !== 'playing') return;
    frameCount++;

    // Income
    money += INCOME_RATE;
    enemyMoney += INCOME_RATE * 1.1;

    // Helicopter controls
    let ax = 0, ay = 0;
    if (keys['a'] || keys['arrowleft'])  { ax = -0.4; heli.facing = -1; }
    if (keys['d'] || keys['arrowright']) { ax = 0.4; heli.facing = 1; }
    if (keys['w'] || keys['arrowup'])    ay = -0.5;
    if (keys['s'] || keys['arrowdown'])  ay = 0.3;
    if (keys[' ']) heliShoot();

    heli.vx += ax;
    heli.vy += ay;
    heli.vx *= 0.92;
    heli.vy *= 0.92;
    heli.vy += GRAVITY * 0.3; // slight gravity pull

    heli.x += heli.vx;
    heli.y += heli.vy;

    // Clamp helicopter
    heli.x = Math.max(30, Math.min(WORLD_WIDTH - 30, heli.x));
    heli.y = Math.max(30, Math.min(GROUND_Y - 40, heli.y));
    heli.bladeAngle += 0.4;
    heli.bobTimer += 0.05;
    heli.shootCooldown = Math.max(0, heli.shootCooldown - 1);

    // Camera follow
    const screenX = heli.x - cameraX;
    if (screenX > W - SCROLL_MARGIN) cameraX = heli.x - (W - SCROLL_MARGIN);
    if (screenX < SCROLL_MARGIN) cameraX = heli.x - SCROLL_MARGIN;
    cameraX = Math.max(0, Math.min(WORLD_WIDTH - W, cameraX));

    // Screen shake
    if (screenShakeTimer > 0) {
        screenShakeTimer--;
        screenShakeX = (Math.random() - 0.5) * screenShakeTimer * 0.8;
        screenShakeY = (Math.random() - 0.5) * screenShakeTimer * 0.8;
    } else {
        screenShakeX = 0;
        screenShakeY = 0;
    }

    // Update units
    for (let i = units.length - 1; i >= 0; i--) {
        const u = units[i];
        if (u.hp <= 0) {
            spawnExplosion(u.x, u.y, u.type === 'tank' ? 4 : 2);
            units.splice(i, 1);
            continue;
        }
        u.attackCooldown = Math.max(0, u.attackCooldown - 1);
        if (u.walkFrame !== undefined) u.walkFrame += 0.12;

        // Dust when walking
        if (u.state === 'march' && frameCount % 12 === 0) {
            spawnDustCloud(u.x, u.y + u.h / 2);
        }

        // Find nearest enemy
        let nearestEnemy = null;
        let nearestDist = Infinity;

        // Check enemy units
        for (const other of units) {
            if (other.team === u.team || other.hp <= 0) continue;
            const d = Math.abs(other.x - u.x);
            if (d < nearestDist) { nearestDist = d; nearestEnemy = other; }
        }

        // Check enemy base
        const targetBase = u.team === 'player' ? enemyBase : playerBase;
        const baseDist = Math.abs(targetBase.x - u.x);
        if (baseDist < nearestDist) {
            nearestDist = baseDist;
            nearestEnemy = targetBase;
        }

        // Check helicopter (for enemy units)
        if (u.team === 'enemy') {
            const heliDist = Math.sqrt((heli.x - u.x) ** 2 + (heli.y - u.y) ** 2);
            if (heliDist < nearestDist && u.type === 'bazooka') {
                nearestDist = heliDist;
                nearestEnemy = heli;
            }
        }

        if (nearestEnemy && nearestDist <= u.range) {
            u.state = 'fight';
            unitShoot(u, nearestEnemy);
        } else {
            u.state = 'march';
            const dir = u.team === 'player' ? 1 : -1;
            u.x += u.speed * dir;
        }
    }

    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.type === 'shell') b.vy += 0.05;
        if (b.type === 'rocket') b.vy += 0.03;
        if (b.type === 'heli') b.vy += 0.35;     // arc into ground troops
        b.life--;

        if (b.life <= 0) { bullets.splice(i, 1); continue; }

        // Hit detection — units. Hitbox tuned to the VISIBLE sprite, not u.w/h
        // (which is just the logical size used for combat ranges and formation).
        let hit = false;
        for (const u of units) {
            if (u.team === b.team) continue;
            const isTank = u.type === 'tank';
            const hbHalfW = isTank ? 28 : 16;     // body width
            const hbHalfH = isTank ? 18 : 28;     // body height
            const hbCenterY = isTank ? u.y : u.y - 14;  // soldiers anchor near feet, hitbox is above
            if (Math.abs(b.x - u.x) < hbHalfW && Math.abs(b.y - hbCenterY) < hbHalfH) {
                u.hp -= b.damage;
                spawnParticles(b.x, b.y, C.explosion1, 3, 1, 8);
                hit = true;
                break;
            }
        }

        // Hit detection — helicopter (enemy bullets)
        if (!hit && b.team === 'enemy') {
            if (Math.abs(b.x - heli.x) < 25 && Math.abs(b.y - heli.y) < 15) {
                heli.hp -= b.damage;
                spawnParticles(b.x, b.y, C.explosion2, 4, 1, 8);
                hit = true;
            }
        }

        // Hit detection — bases
        if (!hit) {
            if (b.team === 'player' && Math.abs(b.x - enemyBase.x) < 50 && b.y > GROUND_Y - 80) {
                enemyBase.hp -= b.damage;
                spawnParticles(b.x, b.y, C.explosion1, 3, 1, 6);
                hit = true;
            }
            if (b.team === 'enemy' && Math.abs(b.x - playerBase.x) < 50 && b.y > GROUND_Y - 80) {
                if (powerupShieldMs > 0) {
                    // Absorb the hit — shield sparks
                    spawnParticles(b.x, b.y, '#42a5f5', 6, 1, 10);
                } else {
                    playerBase.hp -= b.damage;
                    spawnParticles(b.x, b.y, C.explosion1, 3, 1, 6);
                }
                hit = true;
            }
        }

        if (hit) { bullets.splice(i, 1); continue; }

        // Off-screen
        if (b.y > GROUND_Y + 20) {
            spawnParticles(b.x, GROUND_Y, C.sand2, 4, 1, 10);
            bullets.splice(i, 1);
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.isShockwave) {
            p.radius += 4;
        } else if (p.isCasing) {
            p.vy += 0.15;
            p.vx *= 0.97;
        } else if (p.isDebris) {
            p.vy += 0.12;
            p.vx *= 0.98;
        } else if (p.isDust) {
            p.vx *= 0.95;
        } else {
            p.vy += 0.05;
            p.vx *= 0.98;
        }
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Clouds drift
    for (const c of clouds) {
        c.x += c.speed;
        if (c.x > WORLD_WIDTH + 100) c.x = -c.w;
    }

    // Birds drift
    for (const bird of birds) {
        bird.x += bird.speed;
        bird.wingPhase += 0.08;
        if (bird.x > WORLD_WIDTH + 50) bird.x = -50;
    }

    // Ambient leaf particles
    if (frameCount % 60 === 0 && ambientParticles.length < 15) {
        ambientParticles.push({
            x: cameraX + Math.random() * W,
            y: -10,
            vx: 0.3 + Math.random() * 0.5,
            vy: 0.5 + Math.random() * 0.8,
            rot: Math.random() * Math.PI * 2,
            rotSpeed: 0.02 + Math.random() * 0.04,
            size: 3 + Math.random() * 3,
            color: ['#66bb6a', '#81c784', '#a5d6a7', '#c8e6c9'][Math.floor(Math.random() * 4)],
        });
    }
    for (let i = ambientParticles.length - 1; i >= 0; i--) {
        const l = ambientParticles[i];
        l.x += l.vx + Math.sin(frameCount * 0.02 + l.rot) * 0.3;
        l.y += l.vy;
        l.rot += l.rotSpeed;
        if (l.y > GROUND_Y) ambientParticles.splice(i, 1);
    }

    // Wave-based enemy AI spawning
    waveTimer += 16.67;  // approx 60fps
    if (waveTimer > WAVE_DURATION_MS && currentWave < TOTAL_WAVES) {
        currentWave++;
        waveTimer = 0;
    }
    const wave = WAVE_COMPOSITIONS[Math.min(currentWave - 1, TOTAL_WAVES - 1)];
    enemySpawnTimer++;
    if (enemySpawnTimer > wave.spawnEvery) {
        enemySpawnTimer = 0;
        const type = wave.types[Math.floor(Math.random() * wave.types.length)];
        const cost = UNIT_DEFS[type].cost;
        if (enemyMoney >= cost) {
            spawnEnemyUnit(type);
            enemyMoney -= cost;
        }
    }
    // Decay shield powerup
    if (powerupShieldMs > 0) powerupShieldMs = Math.max(0, powerupShieldMs - 16.67);

    // Win/Lose conditions
    if (enemyBase.hp <= 0) {
        gameState = 'gameover';
        gameOverResult = 'win';
        document.getElementById('game-over-text').textContent = 'VICTORY!';
        document.getElementById('game-over-text').style.color = '#4caf50';
        document.getElementById('game-over-screen').style.display = 'flex';
    }
    if (playerBase.hp <= 0 || heli.hp <= 0) {
        gameState = 'gameover';
        gameOverResult = 'lose';
        document.getElementById('game-over-text').textContent = 'DEFEATED!';
        document.getElementById('game-over-text').style.color = '#f44336';
        document.getElementById('game-over-screen').style.display = 'flex';
    }
}

// ============================================================
// RENDERING
// ============================================================

// Helper: rounded rect
function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
}

function drawSky() {
    const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    grad.addColorStop(0, '#1e88e5');
    grad.addColorStop(0.3, '#42a5f5');
    grad.addColorStop(0.6, '#81d4fa');
    grad.addColorStop(1, '#e1f5fe');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Sun glow
    const sunX = W * 0.8;
    const sunY = 60;
    const sunGrad = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 150);
    sunGrad.addColorStop(0, 'rgba(255,245,157,0.9)');
    sunGrad.addColorStop(0.2, 'rgba(255,238,88,0.4)');
    sunGrad.addColorStop(0.5, 'rgba(255,183,77,0.1)');
    sunGrad.addColorStop(1, 'rgba(255,183,77,0)');
    ctx.fillStyle = sunGrad;
    ctx.fillRect(0, 0, W, 300);

    // Sun disc
    ctx.fillStyle = '#fff9c4';
    ctx.shadowBlur = 30;
    ctx.shadowColor = '#ffee58';
    ctx.beginPath();
    ctx.arc(sunX, sunY, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
}

function drawBackgroundMountains() {
    // Sprite version: tile the mountain_bg image across the world at slow parallax.
    const img = SPRITES.mountain_bg;
    if (img && img.complete && img.naturalWidth > 0) {
        const tileH = 220;
        const aspect = img.naturalWidth / img.naturalHeight;
        const tileW = tileH * aspect;
        const baseY = GROUND_Y - tileH + 40; // mountains sit just above the beach
        const parallax = 0.15;
        // Compute starting tile so the pattern wraps relative to camera
        const offset = -((cameraX * parallax) % tileW);
        for (let x = offset - tileW; x < W + tileW; x += tileW) {
            ctx.drawImage(img, x, baseY, tileW, tileH);
        }
        return;
    }
    // Fallback: procedural blobs
    for (const m of bgMountains) {
        const sx = m.x - cameraX * 0.15;
        if (sx < -m.w || sx > W + m.w) continue;
        const grad = ctx.createLinearGradient(sx, GROUND_Y - m.h - 100, sx, GROUND_Y - 100);
        grad.addColorStop(0, m.color2);
        grad.addColorStop(1, m.color1);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(sx - m.w / 2, GROUND_Y - 100);
        ctx.quadraticCurveTo(sx - m.w * 0.2, GROUND_Y - m.h - 100, sx, GROUND_Y - m.h - 80);
        ctx.quadraticCurveTo(sx + m.w * 0.3, GROUND_Y - m.h - 90, sx + m.w / 2, GROUND_Y - 100);
        ctx.closePath();
        ctx.fill();
    }
}

function drawBackgroundTrees() {
    for (const t of bgTrees) {
        const sx = t.x - cameraX * 0.3;
        if (sx < -t.w - 20 || sx > W + 20) continue;
        // Simplified distant tree
        const green = t.shade > 0.5 ? '#388e3c' : '#2e7d32';
        ctx.fillStyle = green;
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.ellipse(sx, GROUND_Y - 40 - t.h * 0.4, t.w * 0.6, t.h * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#4e342e';
        ctx.fillRect(sx - 2, GROUND_Y - 40 - t.h * 0.1, 4, t.h * 0.3);
        ctx.globalAlpha = 1;
    }
}

function drawClouds() {
    const img = SPRITES.cloud_1;
    const useSprite = img && img.complete && img.naturalWidth > 0;
    for (const c of clouds) {
        const sx = c.x - cameraX * 0.3; // parallax
        if (sx < -c.w - 50 || sx > W + 50) continue;
        if (useSprite) {
            const aspect = img.naturalWidth / img.naturalHeight;
            const cw = c.w * 1.2;
            const ch = cw / aspect;
            ctx.globalAlpha = 0.92;
            ctx.drawImage(img, sx - cw / 2, c.y - ch / 2, cw, ch);
            ctx.globalAlpha = 1;
        } else {
            drawCloud(sx, c.y, c.w);
        }
    }
}

function drawCloud(x, y, w) {
    const h = w * 0.4;
    ctx.save();
    ctx.shadowBlur = 8;
    ctx.shadowColor = 'rgba(0,0,0,0.05)';
    ctx.shadowOffsetY = 4;
    // Cloud body with gradient
    const cGrad = ctx.createRadialGradient(x, y - h * 0.1, w * 0.1, x, y + h * 0.1, w * 0.6);
    cGrad.addColorStop(0, 'rgba(255,255,255,0.95)');
    cGrad.addColorStop(1, 'rgba(230,240,255,0.6)');
    ctx.fillStyle = cGrad;
    ctx.beginPath();
    ctx.ellipse(x, y, w * 0.5, h * 0.4, 0, 0, Math.PI * 2);
    ctx.ellipse(x - w * 0.25, y + h * 0.1, w * 0.3, h * 0.3, 0, 0, Math.PI * 2);
    ctx.ellipse(x + w * 0.25, y + h * 0.05, w * 0.35, h * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawBirds() {
    ctx.strokeStyle = '#37474f';
    ctx.lineWidth = 1.5;
    for (const bird of birds) {
        const sx = bird.x - cameraX * 0.2;
        if (sx < -20 || sx > W + 20) continue;
        const wing = Math.sin(bird.wingPhase) * bird.size;
        ctx.beginPath();
        ctx.moveTo(sx - bird.size * 2, bird.y + wing);
        ctx.quadraticCurveTo(sx - bird.size * 0.5, bird.y - wing * 0.5, sx, bird.y);
        ctx.quadraticCurveTo(sx + bird.size * 0.5, bird.y - wing * 0.5, sx + bird.size * 2, bird.y + wing);
        ctx.stroke();
    }
}

function drawOcean() {
    // Beach/sand area with texture
    const sandGrad = ctx.createLinearGradient(0, GROUND_Y - 20, 0, GROUND_Y + 15);
    sandGrad.addColorStop(0, '#ffe0b2');
    sandGrad.addColorStop(0.5, '#ffcc80');
    sandGrad.addColorStop(1, '#ffb74d');
    ctx.fillStyle = sandGrad;
    ctx.fillRect(0, GROUND_Y - 5, W, 30);

    // Sand texture dots
    ctx.fillStyle = 'rgba(210,170,110,0.4)';
    for (let i = 0; i < 80; i++) {
        const sx = ((i * 37 + Math.floor(cameraX * 0.5)) % W);
        const sy = GROUND_Y - 2 + (i * 7 % 25);
        ctx.fillRect(sx, sy, 1, 1);
    }

    // Water with multi-layer gradient
    const waterGrad = ctx.createLinearGradient(0, WATER_Y, 0, H);
    waterGrad.addColorStop(0, '#00acc1');
    waterGrad.addColorStop(0.3, '#0288d1');
    waterGrad.addColorStop(0.6, '#0277bd');
    waterGrad.addColorStop(1, '#01579b');
    ctx.fillStyle = waterGrad;
    ctx.fillRect(0, WATER_Y, W, H - WATER_Y);

    // Multiple wave layers
    for (let layer = 0; layer < 3; layer++) {
        const wAlpha = [0.3, 0.25, 0.2][layer];
        const wOffset = [0, 15, 30][layer];
        const wSpeed = [2, 1.5, 1][layer];
        const wAmp = [4, 3, 2][layer];
        ctx.strokeStyle = `rgba(255,255,255,${wAlpha})`;
        ctx.lineWidth = 2 - layer * 0.5;
        ctx.beginPath();
        for (let x = 0; x < W; x += 3) {
            const wy = WATER_Y + wOffset + Math.sin((x + frameCount * wSpeed + cameraX) * 0.02) * wAmp;
            if (x === 0) ctx.moveTo(x, wy); else ctx.lineTo(x, wy);
        }
        ctx.stroke();
    }

    // Foam near shore
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    for (let x = 0; x < W; x += 8) {
        const foamY = WATER_Y - 2 + Math.sin((x + frameCount * 1.5 + cameraX * 0.8) * 0.04) * 2;
        ctx.beginPath();
        ctx.ellipse(x, foamY, 4 + Math.sin(x * 0.1) * 2, 2, 0, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawGround() {
    // Main ground with richer gradient
    const groundGrad = ctx.createLinearGradient(0, GROUND_Y - 25, 0, WATER_Y);
    groundGrad.addColorStop(0, '#7cb342');
    groundGrad.addColorStop(0.15, '#66bb6a');
    groundGrad.addColorStop(0.4, '#4caf50');
    groundGrad.addColorStop(0.7, '#43a047');
    groundGrad.addColorStop(1, '#d4a056');
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, GROUND_Y - 5, W, WATER_Y - GROUND_Y + 5);

    // Grass tufts with varied height
    for (let x = 0; x < W; x += 8) {
        const wx = x + cameraX;
        const h = 3 + Math.sin(wx * 0.5) * 3 + Math.sin(wx * 0.17) * 2;
        const sway = Math.sin(frameCount * 0.03 + wx * 0.1) * 1.5;
        const shade = Math.sin(wx * 0.3) > 0 ? '#4caf50' : '#388e3c';
        ctx.strokeStyle = shade;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x, GROUND_Y - 5);
        ctx.quadraticCurveTo(x + sway * 0.5, GROUND_Y - 5 - h * 0.6, x + sway, GROUND_Y - 5 - h);
        ctx.stroke();
    }

    // Rocks scattered
    for (const r of rocks) {
        const sx = r.x - cameraX;
        if (sx < -10 || sx > W + 10) continue;
        const rGrad = ctx.createRadialGradient(sx - 1, GROUND_Y - 2 - r.yOff - r.size * 0.3, 1, sx, GROUND_Y - r.yOff, r.size * 1.2);
        rGrad.addColorStop(0, `rgba(180,170,160,${r.shade + 0.2})`);
        rGrad.addColorStop(1, `rgba(120,110,100,${r.shade})`);
        ctx.fillStyle = rGrad;
        ctx.beginPath();
        ctx.ellipse(sx, GROUND_Y - 2 - r.yOff, r.size * 1.2, r.size * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();
        // Rock outline
        ctx.strokeStyle = `rgba(80,70,60,${r.shade * 0.5})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
    }
}

function drawFlowers() {
    for (const f of flowers) {
        const sx = f.x - cameraX;
        if (sx < -10 || sx > W + 10) continue;
        const fy = GROUND_Y - 5 - f.size;

        // Stem
        ctx.strokeStyle = '#388e3c';
        ctx.lineWidth = 1.5;
        const sway = Math.sin(frameCount * 0.03 + f.x * 0.1) * 1;
        ctx.beginPath();
        ctx.moveTo(sx, GROUND_Y - 5);
        ctx.quadraticCurveTo(sx + sway * 0.5, fy + f.size * 0.5, sx + sway, fy);
        ctx.stroke();

        if (f.type < 2) {
            // Multi-petal flower
            ctx.fillStyle = f.color;
            for (let p = 0; p < f.petalCount; p++) {
                const angle = (p / f.petalCount) * Math.PI * 2;
                ctx.beginPath();
                ctx.ellipse(
                    sx + sway + Math.cos(angle) * f.size * 0.4,
                    fy + Math.sin(angle) * f.size * 0.4,
                    f.size * 0.4, f.size * 0.25,
                    angle, 0, Math.PI * 2
                );
                ctx.fill();
            }
            // Center
            ctx.fillStyle = '#ffeb3b';
            ctx.beginPath();
            ctx.arc(sx + sway, fy, f.size * 0.25, 0, Math.PI * 2);
            ctx.fill();
        } else if (f.type < 4) {
            // Bush
            const bGrad = ctx.createRadialGradient(sx + sway, fy, 1, sx + sway, fy + 2, f.size * 1.5);
            bGrad.addColorStop(0, '#66bb6a');
            bGrad.addColorStop(0.5, '#43a047');
            bGrad.addColorStop(1, '#2e7d32');
            ctx.fillStyle = bGrad;
            ctx.beginPath();
            ctx.ellipse(sx + sway, fy + f.size * 0.3, f.size * 1.2, f.size * 0.8, 0, 0, Math.PI * 2);
            ctx.fill();
            // Bush highlight
            ctx.fillStyle = 'rgba(129,199,132,0.4)';
            ctx.beginPath();
            ctx.ellipse(sx + sway - f.size * 0.3, fy, f.size * 0.5, f.size * 0.4, 0, 0, Math.PI * 2);
            ctx.fill();
        } else {
            // Tropical flower with bigger petals
            ctx.fillStyle = f.color;
            ctx.beginPath();
            ctx.arc(sx + sway, fy, f.size * 0.6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.globalAlpha = 0.3;
            ctx.beginPath();
            ctx.arc(sx + sway - f.size * 0.15, fy - f.size * 0.15, f.size * 0.25, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }
}

function drawScenery() {
    // Draw sprite-based bushes and rocks scattered along the beach.
    for (const s of scenery) {
        const sx = s.x - cameraX;
        if (sx < -80 || sx > W + 80) continue;
        const img = SPRITES[s.type];
        if (!img || !img.complete || img.naturalWidth === 0) continue;
        const baseH = s.type === 'bush_1' ? 38 : 22;
        const h = baseH * s.scale;
        const aspect = img.naturalWidth / img.naturalHeight;
        const w = h * aspect;
        // Plant slightly into the sand for consistency with trees and bases
        const anchorY = GROUND_Y + 12;
        ctx.save();
        ctx.translate(sx, anchorY);
        if (s.flip) ctx.scale(-1, 1);
        ctx.drawImage(img, -w / 2, -h, w, h);
        ctx.restore();
    }
}

function drawPalmTree(tree) {
    const sx = tree.x - cameraX;
    if (sx < -80 || sx > W + 80) return;

    // Sprite version: use one of two palm tree variants, deterministic per tree.
    const variant = (tree.swayOffset > Math.PI) ? 'palm_tree_2' : 'palm_tree_1';
    const img = SPRITES[variant];
    if (img && img.complete && img.naturalWidth > 0) {
        const sway = Math.sin(frameCount * 0.012 + tree.swayOffset) * 0.04;
        const aspect = img.naturalWidth / img.naturalHeight;
        const drawH = tree.height + 50;
        const drawW = drawH * aspect;
        // Anchor the trunk base into the SAND, not the grass line.
        // The grass strip runs y=555..590; sand starts ~y=575.
        const anchorY = GROUND_Y + 16;  // ~y=576 — base of trunk planted in sand
        ctx.save();
        ctx.translate(sx, anchorY);
        ctx.rotate(sway);
        ctx.drawImage(img, -drawW / 2, -drawH, drawW, drawH);
        ctx.restore();
        return;
    }

    // ---- Fallback: procedural drawing ----
    const sway = Math.sin(frameCount * 0.01 + tree.swayOffset) * 3;
    const topX = sx + tree.lean * 20 + sway;
    const topY = GROUND_Y - tree.height;
    const tw = tree.trunkWidth;

    // Trunk with cross-hatch bark
    ctx.save();
    // Trunk gradient
    const trunkGrad = ctx.createLinearGradient(sx - tw, GROUND_Y, topX - tw / 2, topY);
    trunkGrad.addColorStop(0, '#5d4037');
    trunkGrad.addColorStop(0.3, '#795548');
    trunkGrad.addColorStop(0.7, '#6d4c41');
    trunkGrad.addColorStop(1, '#8d6e63');

    // Draw trunk as thick path
    ctx.strokeStyle = trunkGrad;
    ctx.lineWidth = tw;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sx, GROUND_Y - 5);
    ctx.quadraticCurveTo(sx + tree.lean * 40 + sway * 0.5, GROUND_Y - tree.height * 0.5,
                         topX, topY);
    ctx.stroke();

    // Cross-hatch bark pattern
    ctx.strokeStyle = 'rgba(62,39,25,0.4)';
    ctx.lineWidth = 1;
    const segments = Math.floor(tree.height / 8);
    for (let s = 0; s < segments; s++) {
        const t = s / segments;
        const bx = sx + (topX - sx) * t + (tree.lean * 40 + sway * 0.5) * t * (1 - t) * 2 * (1 - t);
        const by = GROUND_Y - 5 - tree.height * t;
        const bw = tw * (1 - t * 0.3) * 0.5;
        ctx.beginPath();
        ctx.moveTo(bx - bw, by);
        ctx.lineTo(bx + bw, by);
        ctx.stroke();
    }
    ctx.restore();

    // Coconuts
    ctx.fillStyle = '#5d4037';
    ctx.strokeStyle = '#4e342e';
    ctx.lineWidth = 1;
    for (let ci = 0; ci < 3; ci++) {
        const cx = topX - 5 + ci * 5;
        const cy = topY + 3 + (ci === 1 ? -2 : 0);
        ctx.beginPath();
        ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    }

    // Fronds with individual leaf shapes
    for (let j = 0; j < tree.fronds; j++) {
        const angle = (j / tree.fronds) * Math.PI * 2 + sway * 0.02;
        const fLen = 35 + Math.random() * 5;

        // Main frond stem
        const fColor = j % 2 === 0 ? '#33691e' : '#558b2f';
        const fLight = j % 2 === 0 ? '#4caf50' : '#66bb6a';

        ctx.strokeStyle = fColor;
        ctx.lineWidth = 2.5;

        const endX = topX + Math.cos(angle) * fLen;
        const endY = topY + Math.sin(angle) * fLen * 0.5 - 8;
        const ctrlX = topX + Math.cos(angle) * fLen * 0.6;
        const ctrlY = topY - 18 + Math.sin(angle) * fLen * 0.2;

        ctx.beginPath();
        ctx.moveTo(topX, topY - 3);
        ctx.quadraticCurveTo(ctrlX, ctrlY, endX, endY);
        ctx.stroke();

        // Individual leaves along the frond
        const leafCount = 7;
        for (let l = 0; l < leafCount; l++) {
            const lt = (l + 1) / (leafCount + 1);
            const lx = topX + (ctrlX - topX) * lt * 2 * (1 - lt) + (endX - topX) * lt * lt + (topX - topX) * (1 - lt) * (1 - lt);
            const ly = (topY - 3) + (ctrlY - topY + 3) * lt * 2 * (1 - lt) + (endY - topY + 3) * lt * lt;
            const leafAngle = angle + (l % 2 === 0 ? 0.5 : -0.5);
            const leafLen = 6 + (1 - lt) * 6;

            ctx.fillStyle = l % 2 === 0 ? fColor : fLight;
            ctx.beginPath();
            ctx.ellipse(
                lx + Math.cos(leafAngle) * leafLen * 0.5,
                ly + Math.sin(leafAngle) * leafLen * 0.3,
                leafLen * 0.5, 2.5,
                leafAngle, 0, Math.PI * 2
            );
            ctx.fill();
        }
    }
}

function drawBase(base, team) {
    const sx = base.x - cameraX;
    if (sx < -120 || sx > W + 120) return;
    const by = GROUND_Y - 5;

    // Try sprite rendering first
    const spriteKey = team === 'player' ? 'base_blue' : 'base_red';
    const img = SPRITES[spriteKey];
    if (img && img.complete && img.naturalWidth > 0) {
        const baseHeight = 150;
        // Plant the base into the sand — bottom of sprite sits ~16px below the
        // grass line (around y=576) so the sandbags settle into the sand.
        const baseAnchorY = GROUND_Y + 16;
        const drawY = baseAnchorY - baseHeight / 2;
        drawSprite(spriteKey, sx, drawY, baseHeight, false);

        // Health bar above sprite
        const hbWidth = 70;
        const hbX = sx - hbWidth / 2;
        const hbY = baseAnchorY - baseHeight - 12;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(hbX - 2, hbY - 2, hbWidth + 4, 10);
        const hpRatio = base.hp / base.maxHp;
        ctx.fillStyle = hpRatio > 0.5 ? C.healthGreen : hpRatio > 0.25 ? '#ff9800' : C.healthRed;
        ctx.fillRect(hbX, hbY, hbWidth * hpRatio, 6);
        return;
    }

    // ---- Fallback: procedural drawing ----
    ctx.save();
    if (team === 'player') {
        // === PLAYER BASE — Boom Beach HQ: Tropical military building ===

        // Sandbag wall
        ctx.fillStyle = '#c8b08a';
        for (let i = 0; i < 8; i++) {
            const sbx = sx - 55 + i * 14;
            const sby = by - 10;
            ctx.beginPath();
            ctx.ellipse(sbx, sby, 7, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#a0896a';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
        ctx.fillStyle = '#c8b08a';
        for (let i = 0; i < 7; i++) {
            const sbx = sx - 48 + i * 14;
            const sby = by - 18;
            ctx.beginPath();
            ctx.ellipse(sbx, sby, 7, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#a0896a';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        // Main building body (wooden/metal)
        const buildGrad = ctx.createLinearGradient(sx - 40, by - 70, sx + 40, by);
        buildGrad.addColorStop(0, '#8d6e63');
        buildGrad.addColorStop(0.3, '#795548');
        buildGrad.addColorStop(0.7, '#6d4c41');
        buildGrad.addColorStop(1, '#5d4037');
        ctx.fillStyle = buildGrad;
        ctx.fillRect(sx - 40, by - 60, 80, 42);

        // Building outline
        ctx.strokeStyle = '#4e342e';
        ctx.lineWidth = 2;
        ctx.strokeRect(sx - 40, by - 60, 80, 42);

        // Wood plank lines
        ctx.strokeStyle = 'rgba(78,52,46,0.3)';
        ctx.lineWidth = 1;
        for (let py = by - 55; py < by - 20; py += 8) {
            ctx.beginPath();
            ctx.moveTo(sx - 38, py);
            ctx.lineTo(sx + 38, py);
            ctx.stroke();
        }

        // Metal reinforcement strips
        ctx.fillStyle = '#78909c';
        ctx.fillRect(sx - 42, by - 62, 84, 4);
        ctx.fillRect(sx - 42, by - 20, 84, 4);
        // Metal sheen
        ctx.fillStyle = 'rgba(176,190,197,0.3)';
        ctx.fillRect(sx - 42, by - 62, 84, 2);
        ctx.fillRect(sx - 42, by - 20, 84, 2);

        // Roof - tropical metal roof
        ctx.fillStyle = '#546e7a';
        ctx.beginPath();
        ctx.moveTo(sx - 52, by - 60);
        ctx.lineTo(sx, by - 90);
        ctx.lineTo(sx + 52, by - 60);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#37474f';
        ctx.lineWidth = 2;
        ctx.stroke();
        // Roof highlight
        ctx.fillStyle = 'rgba(176,190,197,0.2)';
        ctx.beginPath();
        ctx.moveTo(sx - 48, by - 62);
        ctx.lineTo(sx - 5, by - 86);
        ctx.lineTo(sx, by - 85);
        ctx.lineTo(sx - 40, by - 62);
        ctx.closePath();
        ctx.fill();

        // Door
        const doorGrad = ctx.createLinearGradient(sx - 8, by - 36, sx + 8, by - 36);
        doorGrad.addColorStop(0, '#4e342e');
        doorGrad.addColorStop(0.5, '#3e2723');
        doorGrad.addColorStop(1, '#4e342e');
        ctx.fillStyle = doorGrad;
        roundRect(sx - 8, by - 36, 16, 18, 2);
        ctx.fill();
        // Door handle
        ctx.fillStyle = '#d4a017';
        ctx.beginPath();
        ctx.arc(sx + 4, by - 27, 1.5, 0, Math.PI * 2);
        ctx.fill();

        // Windows with glow
        for (const wx of [-25, 20]) {
            ctx.fillStyle = '#bbdefb';
            ctx.shadowBlur = 6;
            ctx.shadowColor = '#bbdefb';
            roundRect(sx + wx - 6, by - 52, 12, 10, 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            // Window cross
            ctx.strokeStyle = '#795548';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(sx + wx, by - 52);
            ctx.lineTo(sx + wx, by - 42);
            ctx.moveTo(sx + wx - 6, by - 47);
            ctx.lineTo(sx + wx + 6, by - 47);
            ctx.stroke();
        }

        // Antenna
        ctx.strokeStyle = '#78909c';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sx + 25, by - 60);
        ctx.lineTo(sx + 30, by - 100);
        ctx.stroke();
        // Antenna tip blink
        ctx.fillStyle = frameCount % 40 < 20 ? '#f44336' : '#b71c1c';
        ctx.beginPath();
        ctx.arc(sx + 30, by - 100, 2, 0, Math.PI * 2);
        ctx.fill();
        // Antenna cross pieces
        ctx.strokeStyle = '#90a4ae';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(sx + 26, by - 80);
        ctx.lineTo(sx + 34, by - 85);
        ctx.moveTo(sx + 26, by - 90);
        ctx.lineTo(sx + 34, by - 93);
        ctx.stroke();

        // Blue flag
        ctx.strokeStyle = '#546e7a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sx - 5, by - 90);
        ctx.lineTo(sx - 5, by - 115);
        ctx.stroke();
        // Flag cloth with wave
        const flagWave = Math.sin(frameCount * 0.08) * 3;
        ctx.fillStyle = '#1e88e5';
        ctx.beginPath();
        ctx.moveTo(sx - 5, by - 115);
        ctx.quadraticCurveTo(sx + 8, by - 112 + flagWave, sx + 18, by - 110 + flagWave * 0.5);
        ctx.quadraticCurveTo(sx + 8, by - 106 + flagWave * 0.3, sx - 5, by - 103);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#1565c0';
        ctx.lineWidth = 1;
        ctx.stroke();
        // Star on flag
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        const starX = sx + 6;
        const starY = by - 109 + flagWave * 0.5;
        for (let i = 0; i < 5; i++) {
            const a = (i * 4 * Math.PI / 5) - Math.PI / 2;
            const r = i === 0 ? 0 : 3;
            if (i === 0) ctx.moveTo(starX + 3 * Math.cos(a), starY + 3 * Math.sin(a));
            else {
                const innerA = a - 2 * Math.PI / 5;
                ctx.lineTo(starX + 1.5 * Math.cos(innerA), starY + 1.5 * Math.sin(innerA));
                ctx.lineTo(starX + 3 * Math.cos(a), starY + 3 * Math.sin(a));
            }
        }
        ctx.closePath();
        ctx.fill();

    } else {
        // === ENEMY BASE — Dark fortress with red accents ===

        // Base platform
        ctx.fillStyle = '#37474f';
        ctx.fillRect(sx - 55, by - 5, 110, 8);

        // Main fortress body
        const fortGrad = ctx.createLinearGradient(sx - 50, by - 70, sx + 50, by);
        fortGrad.addColorStop(0, '#424242');
        fortGrad.addColorStop(0.5, '#37474f');
        fortGrad.addColorStop(1, '#263238');
        ctx.fillStyle = fortGrad;
        ctx.fillRect(sx - 45, by - 65, 90, 60);
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 2;
        ctx.strokeRect(sx - 45, by - 65, 90, 60);

        // Dark stone texture
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.lineWidth = 1;
        for (let py = by - 60; py < by - 10; py += 10) {
            ctx.beginPath();
            ctx.moveTo(sx - 43, py);
            ctx.lineTo(sx + 43, py);
            ctx.stroke();
            for (let px = sx - 40; px < sx + 40; px += 18) {
                const offset = (py % 20 === 0) ? 9 : 0;
                ctx.beginPath();
                ctx.moveTo(px + offset, py);
                ctx.lineTo(px + offset, py + 10);
                ctx.stroke();
            }
        }

        // Red accent stripe
        ctx.fillStyle = '#c62828';
        ctx.fillRect(sx - 47, by - 67, 94, 5);
        ctx.fillStyle = '#ef5350';
        ctx.fillRect(sx - 47, by - 67, 94, 2);

        // Guard towers on sides
        for (const side of [-1, 1]) {
            const towerX = sx + side * 50;
            ctx.fillStyle = '#37474f';
            ctx.fillRect(towerX - 10, by - 80, 20, 75);
            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(towerX - 10, by - 80, 20, 75);
            // Tower top
            ctx.fillStyle = '#c62828';
            ctx.beginPath();
            ctx.moveTo(towerX - 12, by - 80);
            ctx.lineTo(towerX, by - 92);
            ctx.lineTo(towerX + 12, by - 80);
            ctx.closePath();
            ctx.fill();
            // Tower window (slit)
            ctx.fillStyle = '#ff8a65';
            ctx.shadowBlur = 4;
            ctx.shadowColor = '#ff5722';
            ctx.fillRect(towerX - 2, by - 55, 4, 10);
            ctx.shadowBlur = 0;
        }

        // Battlements
        ctx.fillStyle = '#37474f';
        for (let i = 0; i < 7; i++) {
            ctx.fillRect(sx - 45 + i * 14, by - 75, 10, 12);
        }

        // Skull emblem with glow
        ctx.shadowBlur = 8;
        ctx.shadowColor = 'rgba(244,67,54,0.5)';
        ctx.fillStyle = '#e0e0e0';
        ctx.beginPath();
        ctx.arc(sx, by - 42, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        // Skull details
        ctx.fillStyle = '#212121';
        ctx.beginPath();
        ctx.arc(sx - 4, by - 44, 3, 0, Math.PI * 2);
        ctx.arc(sx + 4, by - 44, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#e0e0e0';
        ctx.beginPath();
        ctx.arc(sx, by - 38, 5, 0, Math.PI, false);
        ctx.fill();
        ctx.fillStyle = '#212121';
        for (let t = -3; t <= 3; t += 2) {
            ctx.fillRect(sx + t, by - 38, 1, 5);
        }

        // Barbed wire effect
        ctx.strokeStyle = '#616161';
        ctx.lineWidth = 1;
        const barbY = by - 70;
        ctx.beginPath();
        for (let bx = sx - 55; bx < sx + 55; bx += 4) {
            const barbWave = Math.sin(bx * 0.3) * 2;
            ctx.lineTo(bx, barbY + barbWave);
        }
        ctx.stroke();
        // Barb points
        ctx.fillStyle = '#616161';
        for (let bx = sx - 55; bx < sx + 55; bx += 12) {
            const barbWave = Math.sin(bx * 0.3) * 2;
            ctx.beginPath();
            ctx.moveTo(bx, barbY + barbWave - 3);
            ctx.lineTo(bx + 2, barbY + barbWave);
            ctx.lineTo(bx, barbY + barbWave + 3);
            ctx.lineTo(bx - 2, barbY + barbWave);
            ctx.closePath();
            ctx.fill();
        }

        // Cannons
        ctx.fillStyle = '#212121';
        for (const side of [-1, 1]) {
            const canX = sx + side * 35;
            ctx.fillRect(canX - 3, by - 25, 6 + side * 12, 6);
            // Cannon highlight
            ctx.fillStyle = '#424242';
            ctx.fillRect(canX - 2, by - 25, 4 + side * 10, 2);
            ctx.fillStyle = '#212121';
        }

        // Red flag
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sx, by - 75);
        ctx.lineTo(sx, by - 100);
        ctx.stroke();
        const flagWave = Math.sin(frameCount * 0.08) * 3;
        ctx.fillStyle = '#c62828';
        ctx.beginPath();
        ctx.moveTo(sx, by - 100);
        ctx.quadraticCurveTo(sx + 8, by - 97 + flagWave, sx + 16, by - 95 + flagWave * 0.5);
        ctx.quadraticCurveTo(sx + 8, by - 91 + flagWave * 0.3, sx, by - 88);
        ctx.closePath();
        ctx.fill();
    }
    ctx.restore();

    // Health bar with Boom Beach style
    const hbWidth = 70;
    const hbX = sx - hbWidth / 2;
    const hbY = by - (team === 'player' ? 125 : 108);
    // Background
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    roundRect(hbX - 2, hbY - 2, hbWidth + 4, 10, 3);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1;
    roundRect(hbX - 2, hbY - 2, hbWidth + 4, 10, 3);
    ctx.stroke();
    // Bar
    const hpRatio = Math.max(0, base.hp / base.maxHp);
    const hpColor = hpRatio > 0.5 ? C.healthGreen : hpRatio > 0.25 ? '#ff9800' : C.healthRed;
    if (hpRatio > 0) {
        const barGrad = ctx.createLinearGradient(hbX, hbY, hbX, hbY + 6);
        barGrad.addColorStop(0, hpColor);
        barGrad.addColorStop(1, shadeColor(hpColor, -30));
        ctx.fillStyle = barGrad;
        roundRect(hbX, hbY, hbWidth * hpRatio, 6, 2);
        ctx.fill();
        // Shine
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(hbX + 1, hbY, hbWidth * hpRatio - 2, 2);
    }
}

function shadeColor(color, percent) {
    const num = parseInt(color.replace('#', ''), 16);
    const r = Math.min(255, Math.max(0, (num >> 16) + percent));
    const g = Math.min(255, Math.max(0, ((num >> 8) & 0xff) + percent));
    const b = Math.min(255, Math.max(0, (num & 0xff) + percent));
    return `rgb(${r},${g},${b})`;
}

function drawHelicopter() {
    const sx = heli.x - cameraX;
    const sy = heli.y + Math.sin(heli.bobTimer) * 2;
    const f = heli.facing;

    // Try sprite-based rendering first
    if (SPRITES.heli && SPRITES.heli.complete && SPRITES.heli.naturalWidth > 0) {
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.beginPath();
        const shadowDist = GROUND_Y - heli.y;
        const shadowScale = 1 + shadowDist * 0.002;
        ctx.ellipse(sx, GROUND_Y - 3, 50 * shadowScale, 9 * shadowScale, 0, 0, Math.PI * 2);
        ctx.fill();

        // Pitch tilt: nose dips toward direction of travel (in WORLD space, not local)
        // Convention: vx > 0 means "going right" → nose should dip right-and-down
        // In canvas coords (Y down), rotating by +angle is clockwise = nose-down-right.
        // So world pitch = +heli.vx * 0.04.
        const targetPitch = heli.vx * 0.04;
        heli.pitch = (heli.pitch || 0) + (targetPitch - (heli.pitch || 0)) * 0.15;

        // Order: translate → rotate (in world space) → flip → draw.
        // Rotating BEFORE flipping means the rotation is applied to the un-flipped sprite,
        // and then the whole thing is mirrored. Visually, mirroring a clockwise tilt produces
        // a counter-clockwise tilt — exactly what we want, because a left-facing heli's
        // nose-dive appears as counter-clockwise rotation on screen.
        const flip = f === -1;
        const img = SPRITES.heli;
        const aspect = img.naturalWidth / img.naturalHeight;
        const drawHeight = 90;
        const drawWidth = drawHeight * aspect;
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(heli.pitch);
        if (flip) ctx.scale(-1, 1);
        ctx.drawImage(img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
        ctx.restore();

        // Health bar
        if (heli.hp < heli.maxHp) {
            const hbWidth = 50;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(sx - hbWidth / 2 - 1, sy - 50, hbWidth + 2, 6);
            const hpRatio = heli.hp / heli.maxHp;
            ctx.fillStyle = hpRatio > 0.5 ? C.healthGreen : C.healthRed;
            ctx.fillRect(sx - hbWidth / 2, sy - 49, hbWidth * hpRatio, 4);
        }

        // Carrying indicator
        if (heli.carrying.length > 0) {
            ctx.fillStyle = C.gold;
            ctx.font = '600 14px "Fredoka", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`×${heli.carrying.length}`, sx, sy + 55);
        }
        return;
    }

    // ---- Fallback: procedural drawing ----
    ctx.save();
    ctx.translate(sx, sy);

    // Shadow on ground — bigger and softer
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath();
    const shadowDist = GROUND_Y - heli.y;
    const shadowScale = 1 + shadowDist * 0.002;
    ctx.ellipse(0, GROUND_Y - heli.y - 3, 28 * shadowScale, 7 * shadowScale, 0, 0, Math.PI * 2);
    ctx.fill();

    // Tail boom with taper
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-f * 20, -5);
    ctx.lineTo(-f * 52, -3);
    ctx.lineTo(-f * 52, 1);
    ctx.lineTo(-f * 20, 4);
    ctx.closePath();
    const tailGrad = ctx.createLinearGradient(0, -5, 0, 4);
    tailGrad.addColorStop(0, '#1565c0');
    tailGrad.addColorStop(1, '#0d47a1');
    ctx.fillStyle = tailGrad;
    ctx.fill();
    ctx.strokeStyle = '#0a3470';
    ctx.lineWidth = 1;
    ctx.stroke();
    // Tail stripe
    ctx.fillStyle = '#42a5f5';
    ctx.fillRect(-f * 35, -2, f * -12, 2);
    ctx.restore();

    // Tail rotor housing
    ctx.fillStyle = '#455a64';
    ctx.beginPath();
    ctx.arc(-f * 50, -2, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#37474f';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Tail rotor blades (spinning)
    ctx.save();
    ctx.translate(-f * 50, -2);
    ctx.rotate(heli.bladeAngle * 2);
    ctx.fillStyle = 'rgba(120,144,156,0.7)';
    ctx.fillRect(-2, -12, 4, 24);
    ctx.restore();

    // Landing skids with proper thickness
    ctx.strokeStyle = '#37474f';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    // Left skid
    ctx.beginPath();
    ctx.moveTo(-12, 12);
    ctx.lineTo(-12, 18);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-22, 19);
    ctx.lineTo(2, 19);
    ctx.stroke();
    // Right skid
    ctx.beginPath();
    ctx.moveTo(12, 12);
    ctx.lineTo(12, 18);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-2, 19);
    ctx.lineTo(22, 19);
    ctx.stroke();
    // Skid strut highlights
    ctx.strokeStyle = '#546e7a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-22, 18);
    ctx.lineTo(2, 18);
    ctx.moveTo(-2, 18);
    ctx.lineTo(22, 18);
    ctx.stroke();

    // Engine/exhaust housing on top-back
    ctx.fillStyle = '#455a64';
    roundRect(-f * 12, -16, 14, 8, 2);
    ctx.fill();
    ctx.strokeStyle = '#37474f';
    ctx.lineWidth = 1;
    roundRect(-f * 12, -16, 14, 8, 2);
    ctx.stroke();
    // Exhaust vent lines
    ctx.strokeStyle = '#263238';
    ctx.lineWidth = 0.5;
    for (let ev = 0; ev < 3; ev++) {
        ctx.beginPath();
        ctx.moveTo(-f * 10 + ev * 4, -15);
        ctx.lineTo(-f * 10 + ev * 4, -10);
        ctx.stroke();
    }

    // Main body — chunky cartoon heli with 3D shading
    const bodyGrad = ctx.createRadialGradient(f * 2, -4, 5, 0, 4, 30);
    bodyGrad.addColorStop(0, '#42a5f5'); // highlight
    bodyGrad.addColorStop(0.5, '#1e88e5');
    bodyGrad.addColorStop(1, '#0d47a1'); // shadow
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.ellipse(0, 2, 28, 15, 0, 0, Math.PI * 2);
    ctx.fill();
    // Body outline
    ctx.strokeStyle = '#0a3470';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(0, 2, 28, 15, 0, 0, Math.PI * 2);
    ctx.stroke();

    // Highlight on top of body
    ctx.fillStyle = 'rgba(100,181,246,0.4)';
    ctx.beginPath();
    ctx.ellipse(f * 3, -5, 18, 6, f * 0.1, 0, Math.PI * 2);
    ctx.fill();

    // Shadow on bottom of body
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.ellipse(0, 10, 20, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Cockpit glass with radial gradient for glossy bubble
    const cockpitGrad = ctx.createRadialGradient(f * 14, -6, 2, f * 11, -1, 14);
    cockpitGrad.addColorStop(0, 'rgba(255,255,255,0.9)');
    cockpitGrad.addColorStop(0.3, 'rgba(187,222,251,0.8)');
    cockpitGrad.addColorStop(0.7, 'rgba(100,181,246,0.5)');
    cockpitGrad.addColorStop(1, 'rgba(66,165,245,0.3)');
    ctx.fillStyle = cockpitGrad;
    ctx.beginPath();
    ctx.ellipse(f * 11, -1, 13, 10, f * 0.15, 0, Math.PI * 2);
    ctx.fill();
    // Cockpit outline
    ctx.strokeStyle = 'rgba(13,71,161,0.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(f * 11, -1, 13, 10, f * 0.15, 0, Math.PI * 2);
    ctx.stroke();
    // Glass reflection highlight
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.ellipse(f * 14, -5, 5, 3.5, f * 0.3, 0, Math.PI * 2);
    ctx.fill();

    // Accent stripe
    ctx.fillStyle = '#ffb300';
    ctx.fillRect(-18, 0, 36, 3);
    ctx.fillStyle = 'rgba(255,202,40,0.3)';
    ctx.fillRect(-18, 0, 36, 1);

    // Minigun underneath
    ctx.fillStyle = '#263238';
    const gunX = f * 20;
    ctx.fillRect(gunX, 9, f * 14, 3);
    ctx.fillRect(gunX + f * 2, 7, f * 4, 2);
    // Gun barrel detail
    ctx.fillStyle = '#37474f';
    ctx.fillRect(gunX + f * 12, 8, f * 4, 5);
    // Muzzle flash when shooting
    if (heli.shootCooldown > 5) {
        ctx.fillStyle = '#ffeb3b';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff9800';
        ctx.beginPath();
        ctx.arc(gunX + f * 16, 11, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(gunX + f * 16, 11, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    // Rotor mast
    ctx.fillStyle = '#455a64';
    ctx.fillRect(-3, -14, 6, -8);
    ctx.fillStyle = '#546e7a';
    ctx.fillRect(-2, -14, 4, -6);

    // Main rotor — motion blur disc when spinning
    ctx.save();
    ctx.translate(0, -22);
    // Semi-transparent rotor disc
    const rotorGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, 42);
    rotorGrad.addColorStop(0, 'rgba(120,144,156,0.25)');
    rotorGrad.addColorStop(0.5, 'rgba(120,144,156,0.15)');
    rotorGrad.addColorStop(0.8, 'rgba(120,144,156,0.08)');
    rotorGrad.addColorStop(1, 'rgba(120,144,156,0)');
    ctx.fillStyle = rotorGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, 42, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    // Blade tips
    ctx.save();
    ctx.rotate(heli.bladeAngle);
    ctx.strokeStyle = 'rgba(69,90,100,0.7)';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-40, 0);
    ctx.lineTo(40, 0);
    ctx.stroke();
    ctx.rotate(Math.PI / 2);
    ctx.beginPath();
    ctx.moveTo(-40, 0);
    ctx.lineTo(40, 0);
    ctx.stroke();
    ctx.restore();
    // Rotor hub
    ctx.fillStyle = '#455a64';
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Carried soldiers indicator
    if (heli.carrying.length > 0) {
        ctx.fillStyle = C.gold;
        ctx.shadowBlur = 4;
        ctx.shadowColor = 'rgba(255,193,7,0.5)';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`\u00d7${heli.carrying.length}`, 0, 32);
        ctx.shadowBlur = 0;
    }

    ctx.restore();

    // Heli health bar — Boom Beach style
    if (heli.hp < heli.maxHp) {
        const hbWidth = 44;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        roundRect(sx - hbWidth / 2 - 2, sy - 32, hbWidth + 4, 8, 3);
        ctx.fill();
        const hpRatio = heli.hp / heli.maxHp;
        const barColor = hpRatio > 0.5 ? C.healthGreen : C.healthRed;
        const barGrad = ctx.createLinearGradient(0, sy - 30, 0, sy - 24);
        barGrad.addColorStop(0, barColor);
        barGrad.addColorStop(1, shadeColor(barColor, -30));
        ctx.fillStyle = barGrad;
        if (hpRatio > 0) {
            roundRect(sx - hbWidth / 2, sy - 30, hbWidth * hpRatio, 4, 2);
            ctx.fill();
        }
    }
}

function drawUnit(u) {
    const sx = u.x - cameraX;
    if (sx < -30 || sx > W + 30) return;
    const sy = u.y;
    const isPlayer = u.team === 'player';
    const dir = isPlayer ? 1 : -1;

    // Try sprite rendering first
    let spriteKey = null;
    let spriteHeight = 0;
    if (u.type === 'infantry' || u.type === 'bazooka') {
        // Per-unit phase offset (deterministic, derived from spawn x) so units
        // don't all step in lockstep
        const phaseOffset = (u.x * 13) % WALK_CYCLE_MS;
        const cycleMs = performance.now() + phaseOffset;
        const marching = u.state === 'march';
        const frame = marching ? walkFrameAt(cycleMs) : 1;
        // Smooth interpolated Y bob — continuous, not stepped per frame
        u._walkY = marching ? walkYAt(cycleMs) : 0;
        const prefix = u.type === 'infantry'
            ? (isPlayer ? 'infantry_blue' : 'infantry_red')
            : (isPlayer ? 'bazooka_blue' : 'bazooka_red');
        spriteKey = `${prefix}_${frame}`;
        spriteHeight = 50;
    } else if (u.type === 'tank') {
        spriteKey = isPlayer ? 'tank_blue' : 'tank_red';
        spriteHeight = 55;
    }

    const img = spriteKey ? SPRITES[spriteKey] : null;
    if (img && img.complete && img.naturalWidth > 0) {
        // Sprite source faces right; flip enemy units (they march left)
        const flip = !isPlayer;
        // Adjust y so the sprite's feet sit on the ground
        let drawY = sy - spriteHeight / 2 + u.h / 2;

        // Soldier walk bob — smoothly interpolated through 8 keyframes.
        // Lowest at midstance (F3/F7), highest at push-off (F4/F8).
        if ((u.type === 'infantry' || u.type === 'bazooka') && u.state === 'march') {
            drawY += u._walkY || 0;
        }
        // Tanks get a tiny rumble while moving.
        if (u.type === 'tank' && u.state === 'march') {
            const phase = (frameCount * 0.35) + u.x * 0.1;
            drawY += Math.sin(phase * 4) * 0.6;
        }

        // Draw sprite
        const aspect = img.naturalWidth / img.naturalHeight;
        const drawWidth = spriteHeight * aspect;
        ctx.save();
        ctx.translate(sx, drawY);
        if (flip) ctx.scale(-1, 1);
        ctx.drawImage(img, -drawWidth / 2, -spriteHeight / 2, drawWidth, spriteHeight);
        ctx.restore();

        // Health bar
        if (u.hp < u.maxHp) {
            const hbWidth = u.type === 'tank' ? 40 : 28;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(sx - hbWidth / 2 - 1, drawY - spriteHeight / 2 - 8, hbWidth + 2, 5);
            const hpRatio = u.hp / u.maxHp;
